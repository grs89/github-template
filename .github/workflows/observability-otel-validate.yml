name: Observability Otel Validate
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  otel_validate:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$OTEL_VALIDATE_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\uFE0F\
        \ OTel validation deshabilitada (OTEL_VALIDATE_DISABLED=true)\"\n  exit 0\n\
        fi\n\nif [ -z \"$OTEL_COLLECTOR_URL\" ]; then\n  echo \"\u274C ERROR: OTEL_COLLECTOR_URL\
        \ no est\xE1 definida.\"\n  echo \"   Ejemplo: OTEL_COLLECTOR_URL: 'http://otel-collector:4318'\"\
        \n  exit 1\nfi\n\napk add --no-cache curl jq"
    - name: Run Script
      run: "echo \"\U0001F4E1 Validando instrumentaci\xF3n OpenTelemetry...\"\necho\
        \ \"   Servicio:   ${OTEL_SERVICE_URL:-N/A}\"\necho \"   Collector:  ${OTEL_COLLECTOR_URL}\"\
        \necho \"   Protocolo:  ${OTEL_PROTOCOL}\"\n\n# 1. Verificar que el OTEL Collector\
        \ est\xE1 accesible\necho \"\"\necho \"\U0001F50D Verificando conectividad\
        \ con el Collector...\"\nHEALTH_URL=\"${OTEL_COLLECTOR_URL}/health\"\nHTTP_CODE=$(curl\
        \ -s -o /dev/null -w \"%{http_code}\" --max-time 10 \"${HEALTH_URL}\" 2>/dev/null\
        \ || echo \"000\")\n\nif [ \"${HTTP_CODE}\" = \"000\" ] || [ \"${HTTP_CODE}\"\
        \ = \"404\" ]; then\n  # Intentar con el endpoint de metrics de Prometheus\
        \ del collector\n  PROM_URL=\"${OTEL_COLLECTOR_URL%:*}:8888/metrics\"\n  HTTP_CODE=$(curl\
        \ -s -o /dev/null -w \"%{http_code}\" --max-time 10 \"${PROM_URL}\" 2>/dev/null\
        \ || echo \"000\")\n  if [ \"${HTTP_CODE}\" = \"200\" ]; then\n    echo \"\
        \u2705 Collector accesible via Prometheus metrics.\"\n  else\n    echo \"\u26A0\
        \uFE0F Collector no responde en ${HEALTH_URL}. Continuando con validaci\xF3\
        n de trazas...\"\n  fi\nelse\n  echo \"\u2705 Collector responde con HTTP\
        \ ${HTTP_CODE}.\"\nfi\n\n# 2. Generar una traza de prueba s\xEDnt\xE9tica\
        \ si hay URL de servicio\nif [ -n \"${OTEL_SERVICE_URL}\" ]; then\n  echo\
        \ \"\"\n  echo \"\U0001F310 Generando traza s\xEDnt\xE9tica...\"\n  curl -s\
        \ -o /dev/null --max-time 10 \"${OTEL_SERVICE_URL}\" \\\n    -H \"traceparent:\
        \ 00-$(cat /proc/sys/kernel/random/uuid | tr -d '-')00000000000000000-01\"\
        \ \\\n    2>/dev/null || echo \"\u26A0\uFE0F El servicio no respondi\xF3,\
        \ puede ser normal en entornos internos.\"\n\n  echo \"\u23F3 Esperando ${OTEL_WAIT_SECONDS}s\
        \ para que las trazas lleguen al Collector...\"\n  sleep \"${OTEL_WAIT_SECONDS}\"\
        \nfi\n\n# 3. Verificar spans esperados (si se configuraron)\nVALIDATION_FAILED=0\n\
        if [ -n \"${OTEL_EXPECTED_SPANS}\" ]; then\n  echo \"\"\n  echo \"\U0001F50E\
        \ Verificando spans esperados: ${OTEL_EXPECTED_SPANS}\"\n  # Consultar el\
        \ endpoint zpages del collector si est\xE1 disponible\n  ZPAGES_URL=\"${OTEL_COLLECTOR_URL%:*}:55679/debug/tracez\"\
        \n  TRACE_DATA=$(curl -s --max-time 10 \"${ZPAGES_URL}\" 2>/dev/null || echo\
        \ \"\")\n\n  echo \"${OTEL_EXPECTED_SPANS}\" | tr ',' '\\n' | while read -r\
        \ SPAN; do\n    SPAN=$(echo \"${SPAN}\" | xargs)\n    if [ -n \"${TRACE_DATA}\"\
        \ ] && echo \"${TRACE_DATA}\" | grep -qi \"${SPAN}\"; then\n      echo \"\
        \  \u2705 Span encontrado: ${SPAN}\"\n    else\n      echo \"  \u26A0\uFE0F\
        \ Span no verificado (puede no estar disponible via zpages): ${SPAN}\"\n \
        \   fi\n  done\nfi\n\n# 4. Verificar m\xE9tricas esperadas (si se configuraron)\n\
        if [ -n \"${OTEL_EXPECTED_METRICS}\" ]; then\n  echo \"\"\n  echo \"\U0001F4CA\
        \ Verificando m\xE9tricas esperadas: ${OTEL_EXPECTED_METRICS}\"\n  PROM_URL=\"\
        ${OTEL_COLLECTOR_URL%:*}:8888/metrics\"\n  METRIC_DATA=$(curl -s --max-time\
        \ 10 \"${PROM_URL}\" 2>/dev/null || echo \"\")\n\n  echo \"${OTEL_EXPECTED_METRICS}\"\
        \ | tr ',' '\\n' | while read -r METRIC; do\n    METRIC=$(echo \"${METRIC}\"\
        \ | xargs)\n    if [ -n \"${METRIC_DATA}\" ] && echo \"${METRIC_DATA}\" |\
        \ grep -qi \"${METRIC}\"; then\n      echo \"  \u2705 M\xE9trica encontrada:\
        \ ${METRIC}\"\n    else\n      echo \"  \u274C M\xE9trica NO encontrada: ${METRIC}\"\
        \n      VALIDATION_FAILED=1\n    fi\n  done\nfi\n\n# 5. Reporte final\necho\
        \ \"\"\necho \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\
        \necho \"\U0001F4E1 Validaci\xF3n OTel completa\"\nif [ \"${VALIDATION_FAILED}\"\
        \ = \"1\" ] && [ \"${OTEL_FAIL_ON_MISSING}\" = \"true\" ]; then\n  echo \"\
        \u274C Algunas m\xE9tricas/spans no fueron detectados.\"\n  exit 1\nelse\n\
        \  echo \"\u2705 Instrumentaci\xF3n OpenTelemetry verificada.\"\nfi\n"
    container:
      image: alpine:latest
env:
  OTEL_VALIDATE_DISABLED: 'false'
  OTEL_SERVICE_URL: ''
  OTEL_COLLECTOR_URL: ''
  OTEL_EXPECTED_SPANS: ''
  OTEL_EXPECTED_METRICS: ''
  OTEL_WAIT_SECONDS: '15'
  OTEL_PROTOCOL: http
  OTEL_FAIL_ON_MISSING: 'true'
  RUNNER_TAG: docker
