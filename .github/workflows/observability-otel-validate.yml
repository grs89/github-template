name: Observability Otel Validate
on:
  workflow_call:
    inputs:
      OTEL_VALIDATE_DISABLED:
        description: OTEL_VALIDATE_DISABLED
        required: false
        type: string
        default: 'false'
      OTEL_SERVICE_URL:
        description: OTEL_SERVICE_URL
        required: false
        type: string
        default: ''
      OTEL_COLLECTOR_URL:
        description: OTEL_COLLECTOR_URL
        required: false
        type: string
        default: ''
      OTEL_EXPECTED_SPANS:
        description: OTEL_EXPECTED_SPANS
        required: false
        type: string
        default: ''
      OTEL_EXPECTED_METRICS:
        description: OTEL_EXPECTED_METRICS
        required: false
        type: string
        default: ''
      OTEL_WAIT_SECONDS:
        description: OTEL_WAIT_SECONDS
        required: false
        type: string
        default: '15'
      OTEL_PROTOCOL:
        description: OTEL_PROTOCOL
        required: false
        type: string
        default: http
      OTEL_FAIL_ON_MISSING:
        description: OTEL_FAIL_ON_MISSING
        required: false
        type: string
        default: 'true'
permissions:
  contents: read
jobs:
  otel_validate:
    name: otel validate
    runs-on: ubuntu-latest
    if: inputs.OTEL_VALIDATE_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - name: otel validate
      run: |
        if [ "$OTEL_VALIDATE_DISABLED" = "true" ]; then
          echo "⏭️ OTel validation deshabilitada (OTEL_VALIDATE_DISABLED=true)"
          exit 0
        fi

        if [ -z "$OTEL_COLLECTOR_URL" ]; then
          echo "❌ ERROR: OTEL_COLLECTOR_URL no está definida."
          echo "   Ejemplo: OTEL_COLLECTOR_URL: 'http://otel-collector:4318'"
          exit 1
        fi

        echo "📡 Validando instrumentación OpenTelemetry..."
        echo "   Servicio:   ${OTEL_SERVICE_URL:-N/A}"
        echo "   Collector:  ${OTEL_COLLECTOR_URL}"
        echo "   Protocolo:  ${OTEL_PROTOCOL}"

        # 1. Verificar que el OTEL Collector está accesible
        echo ""
        echo "🔍 Verificando conectividad con el Collector..."
        HEALTH_URL="${OTEL_COLLECTOR_URL}/health"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${HEALTH_URL}" 2>/dev/null || echo "000")

        if [ "${HTTP_CODE}" = "000" ] || [ "${HTTP_CODE}" = "404" ]; then
          # Intentar con el endpoint de metrics de Prometheus del collector
          PROM_URL="${OTEL_COLLECTOR_URL%:*}:8888/metrics"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${PROM_URL}" 2>/dev/null || echo "000")
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "✅ Collector accesible via Prometheus metrics."
          else
            echo "⚠️ Collector no responde en ${HEALTH_URL}. Continuando con validación de trazas..."
          fi
        else
          echo "✅ Collector responde con HTTP ${HTTP_CODE}."
        fi

        # 2. Generar una traza de prueba síntética si hay URL de servicio
        if [ -n "${OTEL_SERVICE_URL}" ]; then
          echo ""
          echo "🌐 Generando traza síntética..."
          curl -s -o /dev/null --max-time 10 "${OTEL_SERVICE_URL}" \
            -H "traceparent: 00-$(cat /proc/sys/kernel/random/uuid | tr -d '-')00000000000000000-01" \
            2>/dev/null || echo "⚠️ El servicio no respondió, puede ser normal en entornos internos."

          echo "⏳ Esperando ${OTEL_WAIT_SECONDS}s para que las trazas lleguen al Collector..."
          sleep "${OTEL_WAIT_SECONDS}"
        fi

        # 3. Verificar spans esperados (si se configuraron)
        VALIDATION_FAILED=0
        if [ -n "${OTEL_EXPECTED_SPANS}" ]; then
          echo ""
          echo "🔎 Verificando spans esperados: ${OTEL_EXPECTED_SPANS}"
          # Consultar el endpoint zpages del collector si está disponible
          ZPAGES_URL="${OTEL_COLLECTOR_URL%:*}:55679/debug/tracez"
          TRACE_DATA=$(curl -s --max-time 10 "${ZPAGES_URL}" 2>/dev/null || echo "")

          echo "${OTEL_EXPECTED_SPANS}" | tr ',' '\n' | while read -r SPAN; do
            SPAN=$(echo "${SPAN}" | xargs)
            if [ -n "${TRACE_DATA}" ] && echo "${TRACE_DATA}" | grep -qi "${SPAN}"; then
              echo "  ✅ Span encontrado: ${SPAN}"
            else
              echo "  ⚠️ Span no verificado (puede no estar disponible via zpages): ${SPAN}"
            fi
          done
        fi

        # 4. Verificar métricas esperadas (si se configuraron)
        if [ -n "${OTEL_EXPECTED_METRICS}" ]; then
          echo ""
          echo "📊 Verificando métricas esperadas: ${OTEL_EXPECTED_METRICS}"
          PROM_URL="${OTEL_COLLECTOR_URL%:*}:8888/metrics"
          METRIC_DATA=$(curl -s --max-time 10 "${PROM_URL}" 2>/dev/null || echo "")

          echo "${OTEL_EXPECTED_METRICS}" | tr ',' '\n' | while read -r METRIC; do
            METRIC=$(echo "${METRIC}" | xargs)
            if [ -n "${METRIC_DATA}" ] && echo "${METRIC_DATA}" | grep -qi "${METRIC}"; then
              echo "  ✅ Métrica encontrada: ${METRIC}"
            else
              echo "  ❌ Métrica NO encontrada: ${METRIC}"
              VALIDATION_FAILED=1
            fi
          done
        fi

        # 5. Reporte final
        echo ""
        echo "═══════════════════════════════════"
        echo "📡 Validación OTel completa"
        if [ "${VALIDATION_FAILED}" = "1" ] && [ "${OTEL_FAIL_ON_MISSING}" = "true" ]; then
          echo "❌ Algunas métricas/spans no fueron detectados."
          exit 1
        else
          echo "✅ Instrumentación OpenTelemetry verificada."
        fi
    env:
      OTEL_VALIDATE_DISABLED: ${{ inputs.OTEL_VALIDATE_DISABLED }}
      OTEL_SERVICE_URL: ${{ inputs.OTEL_SERVICE_URL }}
      OTEL_COLLECTOR_URL: ${{ inputs.OTEL_COLLECTOR_URL }}
      OTEL_EXPECTED_SPANS: ${{ inputs.OTEL_EXPECTED_SPANS }}
      OTEL_EXPECTED_METRICS: ${{ inputs.OTEL_EXPECTED_METRICS }}
      OTEL_WAIT_SECONDS: ${{ inputs.OTEL_WAIT_SECONDS }}
      OTEL_PROTOCOL: ${{ inputs.OTEL_PROTOCOL }}
      OTEL_FAIL_ON_MISSING: ${{ inputs.OTEL_FAIL_ON_MISSING }}
