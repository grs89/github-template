name: Git External_Component Git
permissions:
  contents: read
jobs:
  component_delivery:
    name: Entrega de component.yml
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Descargar release info
      if: inputs.RELEASE_ARTIFACT != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.RELEASE_ARTIFACT }}
    - name: component delivery
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        if [ -n "$DEPLOY_KEY" ]; then
          mkdir -p ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key)
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"
          SSH_HOST=$(echo "$REPO_ENTREGA_URL" | sed -E 's#^(ssh://)?(git@)?([^:/]+).*#\3#')
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        fi
        ERRORS=0
        if [ -z "$RELEASE_FILE" ]; then echo "❌ ERROR: La variable RELEASE_FILE no está definida."; ERRORS=1; fi
        if [ -z "$REPO_ENTREGA_URL" ]; then echo "❌ ERROR: La variable REPO_ENTREGA_URL no está definida."; ERRORS=1; fi

        if [ $ERRORS -eq 1 ]; then
          echo "💡 Revisa los inputs/secrets del workflow."
          exit 1
        fi

        if [ ! -f "$RELEASE_FILE" ]; then
          echo "❌ ERROR: El archivo de release '$RELEASE_FILE' no existe."
          exit 1
        fi

        echo "📑 Generando component.yml..."
        FULL_ENV=$(grep "^environment:" "$RELEASE_FILE" | cut -d'"' -f2)
        if [ -z "$FULL_ENV" ]; then FULL_ENV="DEFAULT"; fi

        if [ -z "$REPO_ENTREGA_COMPONENT" ]; then
          REPO_PREFIX=$(echo "$FULL_ENV" | cut -d'/' -f1)
          echo "ℹ️ REPO_ENTREGA_COMPONENT no definida. Usando prefijo extraído del entorno: $REPO_PREFIX"
        else
          REPO_PREFIX="$REPO_ENTREGA_COMPONENT"
        fi

        echo "${FULL_ENV}:" > component.yml

        sed -n '/microservicios:/,$p' "$RELEASE_FILE" | grep -v "microservicios:" | while read -r line; do
          if [ -n "$line" ]; then
            SERVICE=$(echo "$line" | cut -d':' -f1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            VERSION=$(echo "$line" | cut -d':' -f2 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^"//;s/"$//')

            if [ -n "$SERVICE" ]; then
              printf "  - %s:\n" "$SERVICE" >> component.yml
              printf "      repo: %s/%s\n" "$REPO_PREFIX" "$SERVICE" >> component.yml
              printf "      version: %s\n" "$VERSION" >> component.yml
            fi
          fi
        done
        echo "✅ Archivo component.yml generado con éxito"
        echo "📄 Contenido de component.yml:"
        cat component.yml

        # Configurar push al repositorio externo
        rm -rf target_repo
        # Detectar si es HTTPS o SSH
        if echo "$REPO_ENTREGA_URL" | grep -qE "^https?://"; then
          CLONE_URL="$REPO_ENTREGA_URL"
          echo "🌐 Usando protocolo HTTPS."
        else
          # SSH: limpiar y agregar git@ si no lo tiene
          CLEAN_REPO=$(echo "$REPO_ENTREGA_URL" | sed 's/^git@//;s|^ssh://||')
          CLONE_URL="git@${CLEAN_REPO}"
          echo "🔑 Usando protocolo SSH."
        fi
        echo "Clonando repositorio de entrega: ${CLONE_URL}"
        CLONE_OK="true"
        git clone "${CLONE_URL}" target_repo || {
          echo "⚠️ ADVERTENCIA: No se pudo clonar el repositorio. Verifica:"
          echo "  1. Que REPO_ENTREGA_URL sea correcto"
          echo "     - HTTPS: https://github.com/org/repo.git"
          echo "     - SSH:   github.com:org/repo.git"
          echo "  2. Que la llave SSH o credenciales sean correctas"
          echo "  3. Que tenga permisos de escritura en el repo destino"
          CLONE_OK="false"
        }

        if [ "$CLONE_OK" = "true" ]; then
          cp component.yml target_repo/
          cd target_repo

          if [ -n "$(git status --porcelain)" ]; then
            git add component.yml
            git commit -m "Update components from $FULL_ENV release $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
            echo "🚀 component.yml subido exitosamente."
          else
            echo "ℹ️ No hay cambios en component.yml, saltando push."
          fi
          cd ..
        else
          echo "ℹ️ Saltando entrega de component.yml por error en clon."
        fi

        echo "📤 Exportando variables para notificación..."
        echo "COMPONENT_FILE=component.yml" > component.env
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: component_delivery-artifacts
        path: component.yml
        if-no-files-found: ignore
      if: always()
    env:
      REPO_ENTREGA_URL: ${{ inputs.REPO_ENTREGA_URL }}
      REPO_ENTREGA_COMPONENT: ${{ inputs.REPO_ENTREGA_COMPONENT }}
      RELEASE_FILE: ${{ inputs.RELEASE_FILE }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
on:
  workflow_call:
    inputs:
      REPO_ENTREGA_URL:
        description: Repo destino (https://... o host:org/repo.git para SSH)
        required: true
        type: string
      REPO_ENTREGA_COMPONENT:
        description: Prefijo del repo de cada componente (vacío = prefijo del entorno)
        required: false
        type: string
        default: ''
      RELEASE_FILE:
        description: Archivo de release generado por git-infra-update
        required: false
        type: string
        default: release_info.yml
      RELEASE_ARTIFACT:
        description: Artefacto que contiene RELEASE_FILE (vacío = ya está en el workspace)
        required: false
        type: string
        default: release-info
    secrets:
      DEPLOY_KEY:
        description: Llave SSH privada con escritura en el repo destino (solo para URLs SSH)
        required: false
