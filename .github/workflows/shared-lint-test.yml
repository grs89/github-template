name: Shared Lint & Test

on:
  workflow_call:
    inputs:
      DETECTED_LANG:
        description: 'Lenguaje detectado del proyecto'
        required: true
        type: string
      CONTEXT_DIR:
        description: 'Directorio del contexto'
        required: true
        type: string

jobs:
  secret-scan:
    name: 🔑 Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          echo "📥 Descargando Gitleaks..."
          GITLEAKS_VERSION="8.18.2"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Run Gitleaks Detection
        id: gitleaks
        run: |
          echo "🔍 Analizando el repositorio en busca de secretos expuestos..."
          EXIT_CODE=0
          gitleaks detect --verbose --redact --report-path gitleaks-report.json || EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          
          if [ -f gitleaks-report.json ] && [ "$(jq '. | length' gitleaks-report.json 2>/dev/null || echo 0)" -gt 0 ]; then
            echo "🚨 Se han detectado posibles secretos expuestos!"
            echo "has_leaks=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No se detectaron secretos."
            echo "has_leaks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Gitleaks Summary to Job DX
        if: always()
        run: |
          echo "## 🔑 Resultado de Detección de Secretos (Gitleaks)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.gitleaks.outputs.has_leaks }}" = "true" ]; then
            echo "🚨 **¡ALERTA DE SEGURIDAD!** Se encontraron posibles credenciales, tokens o claves privadas expuestas en este commit/rama." >> $GITHUB_STEP_SUMMARY
            echo "Revisa el reporte descargando el artefacto \`gitleaks-report\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Excelente:** No se detectaron llaves privadas, tokens ni contraseñas expuestas en este análisis." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run lint
        working-directory: ${{ inputs.CONTEXT_DIR }}
        run: |
          case "${{ inputs.DETECTED_LANG }}" in
            go)
              echo "🐹 Instalando Go y golangci-lint..."
              sudo apt-get install -y --no-install-recommends golang curl
              curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin
              echo "🔍 Ejecutando golangci-lint..."
              golangci-lint run ./... --timeout 5m || true
              ;;
            js)
              echo "📦 Configurando Node.js..."
              sudo apt-get install -y --no-install-recommends nodejs npm
              npm ci --prefer-offline --no-audit 2>/dev/null || npm install --no-audit
              if grep -q '"lint"' package.json 2>/dev/null; then
                npm run lint || true
              else
                echo "ℹ️ No hay script 'lint' en package.json"
              fi
              ;;
            python)
              echo "🐍 Instalando linters Python..."
              sudo apt-get install -y --no-install-recommends python3 python3-pip
              pip install --quiet --break-system-packages flake8 black 2>/dev/null || true
              flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
              black --check --diff . 2>/dev/null || true
              ;;
            java-*)
              echo "☕ Lint Java no configurado por defecto. Usa SonarQube."
              ;;
            *)
              echo "⚠️ Lenguaje no detectado. Omitiendo lint."
              ;;
          esac

      - name: Check if Dockerfile exists
        id: check_dockerfile
        working-directory: ${{ inputs.CONTEXT_DIR }}
        run: |
          if find . -maxdepth 3 -name "Dockerfile*" -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Hadolint Dockerfile Linter
        if: ${{ steps.check_dockerfile.outputs.exists == 'true' }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          format: sarif
          output-file: hadolint-report.sarif
          ignore-rules: 'DL3008,DL3013,DL3018'
        continue-on-error: true

      - name: Rename Hadolint SARIF Report
        if: ${{ steps.check_dockerfile.outputs.exists == 'true' && always() }}
        working-directory: ${{ inputs.CONTEXT_DIR }}
        run: |
          [ -f hadolint-report.sarif ] && cp hadolint-report.sarif hadolint-report.json || true

      - name: Upload Hadolint Report
        if: ${{ steps.check_dockerfile.outputs.exists == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-report
          path: ${{ inputs.CONTEXT_DIR }}/hadolint-report.json
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Java)
        if: ${{ startsWith(inputs.DETECTED_LANG, 'java') }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        if: ${{ inputs.DETECTED_LANG == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Node.js
        if: ${{ inputs.DETECTED_LANG == 'js' }}
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up Python
        if: ${{ inputs.DETECTED_LANG == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tests
        working-directory: ${{ inputs.CONTEXT_DIR }}
        run: |
          case "${{ inputs.DETECTED_LANG }}" in
            go)
              echo "🧪 go test..."
              go test ./... -v -coverprofile=coverage.out || true
              if [ -f coverage.out ]; then go tool cover -func=coverage.out; fi
              ;;
            js)
              npm ci --prefer-offline --no-audit 2>/dev/null || npm install --no-audit
              echo "🧪 npm test..."
              if npx jest --version 2>/dev/null; then
                npx jest --coverage --passWithNoTests --ci || true
              else
                npm test || true
              fi
              ;;
            python)
              if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt 2>/dev/null || true; fi
              pip install --quiet pytest pytest-cov 2>/dev/null || true
              echo "🧪 pytest..."
              pytest --cov --cov-report=xml:coverage.xml --cov-report=term -v || true
              ;;
            java-maven)
              echo "🧪 mvn test..."
              mvn test -B -Dmaven.test.failure.ignore=true || true
              ;;
            java-gradle)
              if [ -f gradlew ]; then chmod +x gradlew; ./gradlew test --continue || true
              else gradle test --continue || true; fi
              ;;
            *)
              echo "⚠️ Lenguaje no detectado. Omitiendo tests."
              ;;
          esac

      - name: Run Native Language SCA Audit
        working-directory: ${{ inputs.CONTEXT_DIR }}
        run: |
          echo "🔐 Iniciando Auditorías de SCA Nativas..."
          case "${{ inputs.DETECTED_LANG }}" in
            go)
              echo "🐹 Ejecutando govulncheck para Go..."
              go install golang.org/x/vuln/cmd/govulncheck@latest 2>/dev/null || true
              $(go env GOPATH)/bin/govulncheck -json ./... > govulncheck-report.json 2>/dev/null || true
              [ -f govulncheck-report.json ] && echo "✅ govulncheck-report.json generado con éxito." || echo "❌ Falló la generación de govulncheck-report.json"
              ;;
            js)
              echo "📦 Ejecutando npm audit para Node.js..."
              npm audit --json > npm-audit-report.json 2>/dev/null || true
              [ -f npm-audit-report.json ] && echo "✅ npm-audit-report.json generado con éxito." || echo "❌ Falló la generación de npm-audit-report.json"
              ;;
            python)
              echo "🐍 Ejecutando pip-audit para Python..."
              pip install --quiet pip-audit 2>/dev/null || true
              pip-audit --format json -o pip-audit-report.json 2>/dev/null || true
              [ -f pip-audit-report.json ] && echo "✅ pip-audit-report.json generado con éxito." || echo "❌ Falló la generación de pip-audit-report.json"
              ;;
            *)
              echo "⚠️ Lenguaje no soportado para SCA nativo dinámico o no requiere auditorías de dependencias directas en esta etapa."
              ;;
          esac
        continue-on-error: true

      - name: Generate Coverage DX Summary
        if: always()
        working-directory: ${{ inputs.CONTEXT_DIR }}
        run: |
          echo "## 🧪 Resultados de Tests y Cobertura" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "coverage.out" ]; then
            echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            TOTAL_COV=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' || echo "N/A")
            echo "| Cobertura Go (Total) | $TOTAL_COV |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Lenguaje detectado:** Go" >> $GITHUB_STEP_SUMMARY
          elif [ -f "coverage/lcov-report/index.html" ] || [ -f "coverage/clover.xml" ]; then
            echo "✅ **Lenguaje detectado:** Javascript/Typescript" >> $GITHUB_STEP_SUMMARY
            echo "Puedes descargar el artefacto \`coverage-reports\` para ver el reporte LCOV detallado." >> $GITHUB_STEP_SUMMARY
          elif [ -f "coverage.xml" ]; then
            echo "✅ **Lenguaje detectado:** Python" >> $GITHUB_STEP_SUMMARY
            echo "Puedes descargar el artefacto \`coverage-reports\` para ver el reporte XML detallado." >> $GITHUB_STEP_SUMMARY
          elif [ -d "target/site/jacoco" ]; then
            echo "✅ **Lenguaje detectado:** Java (Maven/Gradle)" >> $GITHUB_STEP_SUMMARY
            echo "Puedes descargar el artefacto \`coverage-reports\` para abrir Jacoco." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No se encontraron reportes de cobertura automatizados estándar." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            ${{ inputs.CONTEXT_DIR }}/coverage.out
            ${{ inputs.CONTEXT_DIR }}/coverage.xml
            ${{ inputs.CONTEXT_DIR }}/coverage/
            ${{ inputs.CONTEXT_DIR }}/target/site/jacoco/
            ${{ inputs.CONTEXT_DIR }}/build/reports/jacoco/
            ${{ inputs.CONTEXT_DIR }}/*audit-report.json
            ${{ inputs.CONTEXT_DIR }}/govulncheck-report.json
          retention-days: 7
          if-no-files-found: ignore
