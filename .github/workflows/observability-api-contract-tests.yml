name: Observability Api Contract Tests
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  api_contract_test:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$CONTRACT_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\uFE0F\
        \ Contract testing deshabilitado. Omitiendo.\"\n  exit 0\nfi\n\necho \"\U0001F4E5\
        \ Instalando herramientas...\"\nnpm install -g @stoplight/spectral-cli 2>/dev/null\
        \ || true\n\nmkdir -p contract-reports"
    - name: Run Script
      run: "echo \"\U0001F50D Buscando especificaci\xF3n OpenAPI/Swagger...\"\nSPEC_FILE=\"\
        \"\n\nif [ -n \"$API_SPEC_PATH\" ] && [ -f \"$API_SPEC_PATH\" ]; then\n  SPEC_FILE=\"\
        $API_SPEC_PATH\"\n  echo \"\U0001F4C4 Usando spec local: ${SPEC_FILE}\"\n\
        elif [ -n \"$API_SPEC_URL\" ]; then\n  apk add --no-cache curl 2>/dev/null\
        \ || true\n  curl -sSL \"$API_SPEC_URL\" -o /tmp/api-spec.json\n  SPEC_FILE=\"\
        /tmp/api-spec.json\"\n  echo \"\U0001F310 Spec descargado desde: ${API_SPEC_URL}\"\
        \nelse\n  # Auto-detect local\n  for FILE in openapi.yaml openapi.yml openapi.json\
        \ swagger.yaml swagger.yml swagger.json api.yaml api.yml docs/openapi.yaml\
        \ docs/openapi.json; do\n    if [ -f \"$FILE\" ]; then\n      SPEC_FILE=\"\
        $FILE\"\n      echo \"\u2705 Auto-detectado: ${SPEC_FILE}\"\n      break\n\
        \    fi\n  done\n\n  # Auto-detect desde servidor\n  if [ -z \"$SPEC_FILE\"\
        \ ] && [ -n \"$API_BASE_URL\" ]; then\n    apk add --no-cache curl 2>/dev/null\
        \ || true\n    for ENDPOINT in \"/openapi.json\" \"/swagger.json\" \"/api-docs\"\
        \ \"/v3/api-docs\"; do\n      HTTP_CODE=$(curl -s -o /dev/null -w \"%{http_code}\"\
        \ \"${API_BASE_URL}${ENDPOINT}\" 2>/dev/null || echo \"000\")\n      if [\
        \ \"$HTTP_CODE\" = \"200\" ]; then\n        curl -sSL \"${API_BASE_URL}${ENDPOINT}\"\
        \ -o /tmp/api-spec.json\n        SPEC_FILE=\"/tmp/api-spec.json\"\n      \
        \  echo \"\u2705 Spec encontrado en: ${API_BASE_URL}${ENDPOINT}\"\n      \
        \  break\n      fi\n    done\n  fi\nfi\n\nif [ -z \"$SPEC_FILE\" ]; then\n\
        \  echo \"\u26A0\uFE0F No se encontr\xF3 especificaci\xF3n OpenAPI/Swagger.\"\
        \n  echo \"\U0001F4A1 Define API_SPEC_PATH, API_SPEC_URL, o API_BASE_URL.\"\
        \n  exit 0\nfi\n\necho \"\"\necho \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\"\necho \"\U0001F50D Validaci\xF3n de API Contract\"\necho \"\
        \  \U0001F4C4 Spec: ${SPEC_FILE}\"\necho \"\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\"\n\necho \"\U0001F4CF Ejecutando Spectral Lint...\"\n\
        SPECTRAL_ARGS=\"\"\nif [ -n \"$SPECTRAL_RULESET\" ] && [ -f \"$SPECTRAL_RULESET\"\
        \ ]; then\n  SPECTRAL_ARGS=\"--ruleset ${SPECTRAL_RULESET}\"\nfi\n\nspectral\
        \ lint \"${SPEC_FILE}\" \\\n  --format json \\\n  --output contract-reports/spectral-report.json\
        \ \\\n  ${SPECTRAL_ARGS} || LINT_FAILED=\"true\"\n\nspectral lint \"${SPEC_FILE}\"\
        \ \\\n  --format stylish \\\n  ${SPECTRAL_ARGS} || true\n\necho \"\"\nif [\
        \ -f \"contract-reports/spectral-report.json\" ]; then\n  ERRORS=$(grep -c\
        \ '\"severity\":0' contract-reports/spectral-report.json 2>/dev/null || echo\
        \ \"0\")\n  WARNINGS=$(grep -c '\"severity\":1' contract-reports/spectral-report.json\
        \ 2>/dev/null || echo \"0\")\n  INFOS=$(grep -c '\"severity\":2' contract-reports/spectral-report.json\
        \ 2>/dev/null || echo \"0\")\n  HINTS=$(grep -c '\"severity\":3' contract-reports/spectral-report.json\
        \ 2>/dev/null || echo \"0\")\n\n  echo \"\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\"\n  echo \"\U0001F4CA Resultados:\"\n  echo \"  \U0001F534\
        \ Errores:      ${ERRORS}\"\n  echo \"  \U0001F7E0 Advertencias: ${WARNINGS}\"\
        \n  echo \"  \U0001F535 Info:         ${INFOS}\"\n  echo \"  \U0001F4A1 Hints:\
        \        ${HINTS}\"\n  echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\"\nfi\n\nif [ -n \"$API_BASE_URL\" ]; then\n  echo \"\"\n  echo \"\U0001F9EA\
        \ Verificando endpoints contra el servidor...\"\n  apk add --no-cache curl\
        \ jq 2>/dev/null || true\n\n  PATHS=$(cat \"${SPEC_FILE}\" | jq -r '.paths\
        \ | keys[]' 2>/dev/null || echo \"\")\n  TESTED=0\n  PASSED=0\n  FAILED_EP=0\n\
        \n  for PATH in $PATHS; do\n    METHODS=$(cat \"${SPEC_FILE}\" | jq -r \"\
        .paths[\\\"${PATH}\\\"] | keys[]\" 2>/dev/null | grep -E \"^(get|post|put|delete|patch)$\"\
        \ || echo \"\")\n    for METHOD in $METHODS; do\n      TESTED=$((TESTED +\
        \ 1))\n      URL=\"${API_BASE_URL}${PATH}\"\n      HTTP_CODE=$(curl -s -o\
        \ /dev/null -w \"%{http_code}\" -X \"$(echo $METHOD | tr '[:lower:]' '[:upper:]')\"\
        \ \"$URL\" 2>/dev/null || echo \"000\")\n\n      if [ \"$HTTP_CODE\" -ge 200\
        \ ] && [ \"$HTTP_CODE\" -lt 500 ] 2>/dev/null; then\n        echo \"  \u2705\
        \ $(echo $METHOD | tr '[:lower:]' '[:upper:]') ${PATH} \u2192 HTTP ${HTTP_CODE}\"\
        \n        PASSED=$((PASSED + 1))\n      else\n        echo \"  \u274C $(echo\
        \ $METHOD | tr '[:lower:]' '[:upper:]') ${PATH} \u2192 HTTP ${HTTP_CODE}\"\
        \n        FAILED_EP=$((FAILED_EP + 1))\n      fi\n    done\n  done\n\n  echo\
        \ \"\"\n  echo \"\U0001F4CA Endpoints: ${PASSED}/${TESTED} OK, ${FAILED_EP}\
        \ fallidos\"\nfi\n\nif [ \"$LINT_FAILED\" = \"true\" ] && [ \"$CONTRACT_FAIL_ON_ERROR\"\
        \ = \"true\" ]; then\n  echo \"\u274C Validaci\xF3n de contrato fallida.\"\
        \n  exit 1\nfi\n"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api_contract_test-artifacts
        path: contract-reports/
    container:
      image: ${CONTRACT_IMAGE}
    env:
      API_SPEC_PATH: ''
      API_SPEC_URL: ''
      API_BASE_URL: ''
      CONTRACT_FAIL_ON_ERROR: 'false'
      SPECTRAL_RULESET: ''
env:
  CONTRACT_DISABLED: 'false'
  CONTRACT_IMAGE: node:22-alpine
