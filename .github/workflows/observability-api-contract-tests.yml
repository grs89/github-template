name: Observability Api Contract Tests
on:
  workflow_call:
    inputs:
      CONTRACT_DISABLED:
        description: CONTRACT_DISABLED
        required: false
        type: string
        default: 'false'
      API_SPEC_PATH:
        description: API_SPEC_PATH
        required: false
        type: string
        default: ''
      API_SPEC_URL:
        description: API_SPEC_URL
        required: false
        type: string
        default: ''
      API_BASE_URL:
        description: API_BASE_URL
        required: false
        type: string
        default: ''
      CONTRACT_FAIL_ON_ERROR:
        description: CONTRACT_FAIL_ON_ERROR
        required: false
        type: string
        default: 'false'
      SPECTRAL_RULESET:
        description: SPECTRAL_RULESET
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  api_contract_test:
    name: api contract test
    runs-on: ubuntu-latest
    if: inputs.CONTRACT_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - name: api contract test
      run: |
        if [ "$CONTRACT_DISABLED" = "true" ]; then
          echo "⏭️ Contract testing deshabilitado. Omitiendo."
          exit 0
        fi

        echo "📥 Instalando herramientas..."
        npm install -g @stoplight/spectral-cli 2>/dev/null || true

        mkdir -p contract-reports
        echo "🔍 Buscando especificación OpenAPI/Swagger..."
        SPEC_FILE=""

        if [ -n "$API_SPEC_PATH" ] && [ -f "$API_SPEC_PATH" ]; then
          SPEC_FILE="$API_SPEC_PATH"
          echo "📄 Usando spec local: ${SPEC_FILE}"
        elif [ -n "$API_SPEC_URL" ]; then
          curl -sSL "$API_SPEC_URL" -o /tmp/api-spec.json
          SPEC_FILE="/tmp/api-spec.json"
          echo "🌐 Spec descargado desde: ${API_SPEC_URL}"
        else
          # Auto-detect local
          for FILE in openapi.yaml openapi.yml openapi.json swagger.yaml swagger.yml swagger.json api.yaml api.yml docs/openapi.yaml docs/openapi.json; do
            if [ -f "$FILE" ]; then
              SPEC_FILE="$FILE"
              echo "✅ Auto-detectado: ${SPEC_FILE}"
              break
            fi
          done

          # Auto-detect desde servidor
          if [ -z "$SPEC_FILE" ] && [ -n "$API_BASE_URL" ]; then
            for ENDPOINT in "/openapi.json" "/swagger.json" "/api-docs" "/v3/api-docs"; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${API_BASE_URL}${ENDPOINT}" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                curl -sSL "${API_BASE_URL}${ENDPOINT}" -o /tmp/api-spec.json
                SPEC_FILE="/tmp/api-spec.json"
                echo "✅ Spec encontrado en: ${API_BASE_URL}${ENDPOINT}"
                break
              fi
            done
          fi
        fi

        if [ -z "$SPEC_FILE" ]; then
          echo "⚠️ No se encontró especificación OpenAPI/Swagger."
          echo "💡 Define API_SPEC_PATH, API_SPEC_URL, o API_BASE_URL."
          exit 0
        fi

        echo ""
        echo "═══════════════════════════════════"
        echo "🔍 Validación de API Contract"
        echo "  📄 Spec: ${SPEC_FILE}"
        echo "═══════════════════════════════════"

        echo "📏 Ejecutando Spectral Lint..."
        SPECTRAL_ARGS=""
        if [ -n "$SPECTRAL_RULESET" ] && [ -f "$SPECTRAL_RULESET" ]; then
          SPECTRAL_ARGS="--ruleset ${SPECTRAL_RULESET}"
        fi

        spectral lint "${SPEC_FILE}" \
          --format json \
          --output contract-reports/spectral-report.json \
          ${SPECTRAL_ARGS} || LINT_FAILED="true"

        spectral lint "${SPEC_FILE}" \
          --format stylish \
          ${SPECTRAL_ARGS} || true

        echo ""
        if [ -f "contract-reports/spectral-report.json" ]; then
          ERRORS=$(grep -c '"severity":0' contract-reports/spectral-report.json 2>/dev/null || echo "0")
          WARNINGS=$(grep -c '"severity":1' contract-reports/spectral-report.json 2>/dev/null || echo "0")
          INFOS=$(grep -c '"severity":2' contract-reports/spectral-report.json 2>/dev/null || echo "0")
          HINTS=$(grep -c '"severity":3' contract-reports/spectral-report.json 2>/dev/null || echo "0")

          echo "═══════════════════════════════════"
          echo "📊 Resultados:"
          echo "  🔴 Errores:      ${ERRORS}"
          echo "  🟠 Advertencias: ${WARNINGS}"
          echo "  🔵 Info:         ${INFOS}"
          echo "  💡 Hints:        ${HINTS}"
          echo "═══════════════════════════════════"
        fi

        if [ -n "$API_BASE_URL" ]; then
          echo ""
          echo "🧪 Verificando endpoints contra el servidor..."

          PATHS=$(cat "${SPEC_FILE}" | jq -r '.paths | keys[]' 2>/dev/null || echo "")
          TESTED=0
          PASSED=0
          FAILED_EP=0

          for PATH in $PATHS; do
            METHODS=$(cat "${SPEC_FILE}" | jq -r ".paths[\"${PATH}\"] | keys[]" 2>/dev/null | grep -E "^(get|post|put|delete|patch)$" || echo "")
            for METHOD in $METHODS; do
              TESTED=$((TESTED + 1))
              URL="${API_BASE_URL}${PATH}"
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X "$(echo $METHOD | tr '[:lower:]' '[:upper:]')" "$URL" 2>/dev/null || echo "000")

              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ] 2>/dev/null; then
                echo "  ✅ $(echo $METHOD | tr '[:lower:]' '[:upper:]') ${PATH} → HTTP ${HTTP_CODE}"
                PASSED=$((PASSED + 1))
              else
                echo "  ❌ $(echo $METHOD | tr '[:lower:]' '[:upper:]') ${PATH} → HTTP ${HTTP_CODE}"
                FAILED_EP=$((FAILED_EP + 1))
              fi
            done
          done

          echo ""
          echo "📊 Endpoints: ${PASSED}/${TESTED} OK, ${FAILED_EP} fallidos"
        fi

        if [ "$LINT_FAILED" = "true" ] && [ "$CONTRACT_FAIL_ON_ERROR" = "true" ]; then
          echo "❌ Validación de contrato fallida."
          exit 1
        fi
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api_contract_test-artifacts
        path: contract-reports/
        if-no-files-found: ignore
      if: always()
    env:
      CONTRACT_DISABLED: ${{ inputs.CONTRACT_DISABLED }}
      API_SPEC_PATH: ${{ inputs.API_SPEC_PATH }}
      API_SPEC_URL: ${{ inputs.API_SPEC_URL }}
      API_BASE_URL: ${{ inputs.API_BASE_URL }}
      CONTRACT_FAIL_ON_ERROR: ${{ inputs.CONTRACT_FAIL_ON_ERROR }}
      SPECTRAL_RULESET: ${{ inputs.SPECTRAL_RULESET }}
