name: 📊 Executive Report

# Consolida los reportes de seguridad de la corrida (artefactos *report*) en un reporte ejecutivo HTML/PDF.

on:
  workflow_call:
    inputs:
      REPORTS_ARTIFACT_PATTERN:
        description: 'Patrón de artefactos con reportes a consolidar'
        required: false
        type: string
        default: '*report*'
      TEMPLATE_PROJECT:
        description: 'Repo de plantillas con .github/utilidades/generate_report.py'
        required: false
        type: string
        default: 'grs89/github-template'

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.TEMPLATE_PROJECT }}
          path: github-template-utils

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ inputs.REPORTS_ARTIFACT_PATTERN }}
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar reporte ejecutivo
        run: |
          pip install --quiet jinja2 weasyprint
          python github-template-utils/.github/utilidades/generate_report.py

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: executive-report
          path: |
            security-report*.html
            security-report*.pdf
          if-no-files-found: warn

      - name: Resumen
        run: |
          {
            echo "## 📊 Executive Report generado"
            echo "Descarga el artefacto **executive-report** de esta ejecución."
          } >> "$GITHUB_STEP_SUMMARY"
