name: Test Playwright E2E
on:
  workflow_call:
    inputs:
      PLAYWRIGHT_DISABLED:
        description: PLAYWRIGHT_DISABLED
        required: false
        type: string
        default: 'false'
      PLAYWRIGHT_BASE_URL:
        description: PLAYWRIGHT_BASE_URL
        required: false
        type: string
        default: ''
      PLAYWRIGHT_BROWSER:
        description: PLAYWRIGHT_BROWSER
        required: false
        type: string
        default: chromium
      PLAYWRIGHT_WORKERS:
        description: PLAYWRIGHT_WORKERS
        required: false
        type: string
        default: '2'
      PLAYWRIGHT_RETRIES:
        description: PLAYWRIGHT_RETRIES
        required: false
        type: string
        default: '1'
      PLAYWRIGHT_TIMEOUT:
        description: PLAYWRIGHT_TIMEOUT
        required: false
        type: string
        default: '30000'
      PLAYWRIGHT_REPORT_DIR:
        description: PLAYWRIGHT_REPORT_DIR
        required: false
        type: string
        default: playwright-report
      PLAYWRIGHT_SCREENSHOT:
        description: PLAYWRIGHT_SCREENSHOT
        required: false
        type: string
        default: only-on-failure
      PLAYWRIGHT_VIDEO:
        description: PLAYWRIGHT_VIDEO
        required: false
        type: string
        default: retain-on-failure
permissions:
  contents: read
jobs:
  playwright_e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    if: inputs.PLAYWRIGHT_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: playwright e2e
      run: |
        if [ "$PLAYWRIGHT_DISABLED" = "true" ]; then
          echo "⏭️ Playwright E2E deshabilitado (PLAYWRIGHT_DISABLED=true)"
          exit 0
        fi

        if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
          echo "❌ ERROR: PLAYWRIGHT_BASE_URL no está definida."
          echo "   Ejemplo: PLAYWRIGHT_BASE_URL: 'https://staging.myapp.com'"
          exit 1
        fi

        echo "📦 Instalando dependencias del proyecto..."
        npm ci --prefer-offline --no-audit 2>/dev/null || npm install --no-audit
        echo "🎭 Instalando navegadores Playwright..."
        npx playwright install --with-deps ${PLAYWRIGHT_BROWSER}
        echo "🎭 Ejecutando tests Playwright E2E..."
        echo "   URL: ${PLAYWRIGHT_BASE_URL}"
        echo "   Browser: ${PLAYWRIGHT_BROWSER}"
        echo "   Workers: ${PLAYWRIGHT_WORKERS}"
        echo "   Retries: ${PLAYWRIGHT_RETRIES}"

        BASE_URL="${PLAYWRIGHT_BASE_URL}" \
        npx playwright test \
          --project="${PLAYWRIGHT_BROWSER}" \
          --workers="${PLAYWRIGHT_WORKERS}" \
          --retries="${PLAYWRIGHT_RETRIES}" \
          --timeout="${PLAYWRIGHT_TIMEOUT}" \
          --reporter=html,json \
          --output="${PLAYWRIGHT_REPORT_DIR}/test-results" || E2E_FAILED=1

        if [ "${E2E_FAILED}" = "1" ]; then
          echo "❌ Tests E2E fallidos. Revisa el reporte HTML en los artefactos."
          exit 1
        fi

        echo "✅ Todos los tests E2E pasaron."
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: playwright_e2e-artifacts
        path: |-
          ${{ inputs.PLAYWRIGHT_REPORT_DIR }}/
          test-results/
        if-no-files-found: ignore
      if: always()
    env:
      PLAYWRIGHT_DISABLED: ${{ inputs.PLAYWRIGHT_DISABLED }}
      PLAYWRIGHT_BASE_URL: ${{ inputs.PLAYWRIGHT_BASE_URL }}
      PLAYWRIGHT_BROWSER: ${{ inputs.PLAYWRIGHT_BROWSER }}
      PLAYWRIGHT_WORKERS: ${{ inputs.PLAYWRIGHT_WORKERS }}
      PLAYWRIGHT_RETRIES: ${{ inputs.PLAYWRIGHT_RETRIES }}
      PLAYWRIGHT_TIMEOUT: ${{ inputs.PLAYWRIGHT_TIMEOUT }}
      PLAYWRIGHT_REPORT_DIR: ${{ inputs.PLAYWRIGHT_REPORT_DIR }}
      PLAYWRIGHT_SCREENSHOT: ${{ inputs.PLAYWRIGHT_SCREENSHOT }}
      PLAYWRIGHT_VIDEO: ${{ inputs.PLAYWRIGHT_VIDEO }}
