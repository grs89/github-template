name: K8S Rollback
permissions:
  contents: read
jobs:
  k8s_rollback:
    name: k8s rollback
    runs-on: ubuntu-latest
    if: inputs.ROLLBACK_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - name: k8s rollback
      run: |
        if [ "$ROLLBACK_DISABLED" = "true" ]; then
          echo "⏭️ Rollback deshabilitado. Omitiendo."
          exit 0
        fi

        if [ -n "$KUBECONFIG_CONTENT" ]; then
          mkdir -p ~/.kube
          echo "${KUBECONFIG_CONTENT}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        elif [ -n "$KUBE_URL" ] && [ -n "$KUBE_TOKEN" ]; then
          kubectl config set-cluster k8s --server="${KUBE_URL}" --insecure-skip-tls-verify=true
          kubectl config set-credentials deployer --token="${KUBE_TOKEN}"
          kubectl config set-context deploy --cluster=k8s --user=deployer --namespace="${K8S_NAMESPACE}"
          kubectl config use-context deploy
        fi

        kubectl cluster-info || { echo "❌ No hay conexión al cluster"; exit 1; }
        echo "═══════════════════════════════════"
        echo "🔙 Kubernetes Rollback"
        echo "  📦 Deployment: ${ROLLBACK_DEPLOYMENT}"
        echo "  📁 Namespace:  ${K8S_NAMESPACE}"
        echo "═══════════════════════════════════"

        echo "📋 Estado actual del deployment:"
        kubectl get deployment "${ROLLBACK_DEPLOYMENT}" -n "${K8S_NAMESPACE}" -o wide 2>/dev/null || {
          echo "❌ Deployment '${ROLLBACK_DEPLOYMENT}' no encontrado en namespace '${K8S_NAMESPACE}'."
          exit 1
        }

        echo ""
        echo "📜 Historial de revisiones:"
        kubectl rollout history deployment/"${ROLLBACK_DEPLOYMENT}" -n "${K8S_NAMESPACE}"

        CURRENT_IMAGE=$(kubectl get deployment "${ROLLBACK_DEPLOYMENT}" -n "${K8S_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)
        echo ""
        echo "🏷️ Imagen actual: ${CURRENT_IMAGE}"

        echo ""
        if [ -n "$ROLLBACK_REVISION" ]; then
          echo "🔙 Rollback a revisión específica: ${ROLLBACK_REVISION}"
          kubectl rollout undo deployment/"${ROLLBACK_DEPLOYMENT}" \
            -n "${K8S_NAMESPACE}" \
            --to-revision="${ROLLBACK_REVISION}"
        else
          echo "🔙 Rollback a revisión anterior..."
          kubectl rollout undo deployment/"${ROLLBACK_DEPLOYMENT}" \
            -n "${K8S_NAMESPACE}"
        fi

        echo "⏳ Esperando rollout..."
        kubectl rollout status deployment/"${ROLLBACK_DEPLOYMENT}" \
          -n "${K8S_NAMESPACE}" \
          --timeout="${ROLLBACK_VERIFY_TIMEOUT}s" || {
            echo "⚠️ Timeout en rollback. Verificando estado de pods..."
            kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${ROLLBACK_DEPLOYMENT}" -o wide
            kubectl describe deployment "${ROLLBACK_DEPLOYMENT}" -n "${K8S_NAMESPACE}" | tail -20
          }

        if [ "$ROLLBACK_VERIFY" = "true" ]; then
          echo ""
          echo "🔍 Verificando rollback..."
          NEW_IMAGE=$(kubectl get deployment "${ROLLBACK_DEPLOYMENT}" -n "${K8S_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "  Imagen anterior: ${CURRENT_IMAGE}"
          echo "  Imagen actual:   ${NEW_IMAGE}"

          if [ "$CURRENT_IMAGE" != "$NEW_IMAGE" ]; then
            echo "  ✅ Imagen cambiada exitosamente."
          else
            echo "  ⚠️ La imagen no cambió. Posiblemente ya estaba en la versión anterior."
          fi

          echo ""
          echo "📋 Pods después del rollback:"
          kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${ROLLBACK_DEPLOYMENT}" -o wide

          # Verificar que todos los pods estén ready
          READY_COUNT=$(kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${ROLLBACK_DEPLOYMENT}" -o jsonpath='{range .items[*]}{.status.containerStatuses[0].ready}{"\n"}{end}' 2>/dev/null | grep -c "true" || echo "0")
          TOTAL_PODS=$(kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${ROLLBACK_DEPLOYMENT}" --no-headers 2>/dev/null | wc -l || echo "0")

          echo ""
          echo "═══════════════════════════════════"
          echo "📊 Resultado: ${READY_COUNT}/${TOTAL_PODS} pods ready"
          if [ "$READY_COUNT" = "$TOTAL_PODS" ] && [ "$TOTAL_PODS" -gt 0 ] 2>/dev/null; then
            echo "✅ Rollback exitoso."
          else
            echo "⚠️ Algunos pods no están ready."
          fi
          echo "═══════════════════════════════════"
        fi
    env:
      ROLLBACK_DISABLED: ${{ inputs.ROLLBACK_DISABLED }}
      K8S_NAMESPACE: ${{ inputs.K8S_NAMESPACE }}
      ROLLBACK_DEPLOYMENT: ${{ inputs.ROLLBACK_DEPLOYMENT }}
      ROLLBACK_REVISION: ${{ inputs.ROLLBACK_REVISION }}
      ROLLBACK_VERIFY: ${{ inputs.ROLLBACK_VERIFY }}
      ROLLBACK_VERIFY_TIMEOUT: ${{ inputs.ROLLBACK_VERIFY_TIMEOUT }}
      KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
      KUBE_URL: ${{ secrets.KUBE_URL }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
on:
  workflow_call:
    inputs:
      ROLLBACK_DISABLED:
        description: ROLLBACK_DISABLED
        required: false
        type: string
        default: 'false'
      K8S_NAMESPACE:
        description: K8S_NAMESPACE
        required: false
        type: string
        default: ''
      ROLLBACK_DEPLOYMENT:
        description: ROLLBACK_DEPLOYMENT
        required: false
        type: string
        default: ''
      ROLLBACK_REVISION:
        description: ROLLBACK_REVISION
        required: false
        type: string
        default: ''
      ROLLBACK_VERIFY:
        description: ROLLBACK_VERIFY
        required: false
        type: string
        default: 'true'
      ROLLBACK_VERIFY_TIMEOUT:
        description: ROLLBACK_VERIFY_TIMEOUT
        required: false
        type: string
        default: '120'
    secrets:
      KUBECONFIG_CONTENT:
        description: kubeconfig en base64
        required: false
      KUBE_URL:
        description: URL del API server (alternativa a kubeconfig)
        required: false
      KUBE_TOKEN:
        description: Token de ServiceAccount (alternativa a kubeconfig)
        required: false
