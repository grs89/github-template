name: K8S Rollback
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  k8s_rollback:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$ROLLBACK_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\uFE0F\
        \ Rollback deshabilitado. Omitiendo.\"\n  exit 0\nfi\n\nif [ -n \"$KUBECONFIG_CONTENT\"\
        \ ]; then\n  mkdir -p ~/.kube\n  echo \"${KUBECONFIG_CONTENT}\" | base64 -d\
        \ > ~/.kube/config\n  chmod 600 ~/.kube/config\nelif [ -n \"$KUBE_URL\" ]\
        \ && [ -n \"$KUBE_TOKEN\" ]; then\n  kubectl config set-cluster k8s --server=\"\
        ${KUBE_URL}\" --insecure-skip-tls-verify=true\n  kubectl config set-credentials\
        \ deployer --token=\"${KUBE_TOKEN}\"\n  kubectl config set-context deploy\
        \ --cluster=k8s --user=deployer --namespace=\"${K8S_NAMESPACE}\"\n  kubectl\
        \ config use-context deploy\nfi\n\nkubectl cluster-info || { echo \"\u274C\
        \ No hay conexi\xF3n al cluster\"; exit 1; }"
    - name: Run Script
      run: "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\necho\
        \ \"\U0001F519 Kubernetes Rollback\"\necho \"  \U0001F4E6 Deployment: ${ROLLBACK_DEPLOYMENT}\"\
        \necho \"  \U0001F4C1 Namespace:  ${K8S_NAMESPACE}\"\necho \"\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\"\n\necho \"\U0001F4CB Estado actual\
        \ del deployment:\"\nkubectl get deployment \"${ROLLBACK_DEPLOYMENT}\" -n\
        \ \"${K8S_NAMESPACE}\" -o wide 2>/dev/null || {\n  echo \"\u274C Deployment\
        \ '${ROLLBACK_DEPLOYMENT}' no encontrado en namespace '${K8S_NAMESPACE}'.\"\
        \n  exit 1\n}\n\necho \"\"\necho \"\U0001F4DC Historial de revisiones:\"\n\
        kubectl rollout history deployment/\"${ROLLBACK_DEPLOYMENT}\" -n \"${K8S_NAMESPACE}\"\
        \n\nCURRENT_IMAGE=$(kubectl get deployment \"${ROLLBACK_DEPLOYMENT}\" -n \"\
        ${K8S_NAMESPACE}\" -o jsonpath='{.spec.template.spec.containers[0].image}'\
        \ 2>/dev/null)\necho \"\"\necho \"\U0001F3F7\uFE0F Imagen actual: ${CURRENT_IMAGE}\"\
        \n\necho \"\"\nif [ -n \"$ROLLBACK_REVISION\" ]; then\n  echo \"\U0001F519\
        \ Rollback a revisi\xF3n espec\xEDfica: ${ROLLBACK_REVISION}\"\n  kubectl\
        \ rollout undo deployment/\"${ROLLBACK_DEPLOYMENT}\" \\\n    -n \"${K8S_NAMESPACE}\"\
        \ \\\n    --to-revision=\"${ROLLBACK_REVISION}\"\nelse\n  echo \"\U0001F519\
        \ Rollback a revisi\xF3n anterior...\"\n  kubectl rollout undo deployment/\"\
        ${ROLLBACK_DEPLOYMENT}\" \\\n    -n \"${K8S_NAMESPACE}\"\nfi\n\necho \"\u23F3\
        \ Esperando rollout...\"\nkubectl rollout status deployment/\"${ROLLBACK_DEPLOYMENT}\"\
        \ \\\n  -n \"${K8S_NAMESPACE}\" \\\n  --timeout=\"${ROLLBACK_VERIFY_TIMEOUT}s\"\
        \ || {\n    echo \"\u26A0\uFE0F Timeout en rollback. Verificando estado de\
        \ pods...\"\n    kubectl get pods -n \"${K8S_NAMESPACE}\" -l \"app=${ROLLBACK_DEPLOYMENT}\"\
        \ -o wide\n    kubectl describe deployment \"${ROLLBACK_DEPLOYMENT}\" -n \"\
        ${K8S_NAMESPACE}\" | tail -20\n  }\n\nif [ \"$ROLLBACK_VERIFY\" = \"true\"\
        \ ]; then\n  echo \"\"\n  echo \"\U0001F50D Verificando rollback...\"\n  NEW_IMAGE=$(kubectl\
        \ get deployment \"${ROLLBACK_DEPLOYMENT}\" -n \"${K8S_NAMESPACE}\" -o jsonpath='{.spec.template.spec.containers[0].image}')\n\
        \  echo \"  Imagen anterior: ${CURRENT_IMAGE}\"\n  echo \"  Imagen actual:\
        \   ${NEW_IMAGE}\"\n\n  if [ \"$CURRENT_IMAGE\" != \"$NEW_IMAGE\" ]; then\n\
        \    echo \"  \u2705 Imagen cambiada exitosamente.\"\n  else\n    echo \"\
        \  \u26A0\uFE0F La imagen no cambi\xF3. Posiblemente ya estaba en la versi\xF3\
        n anterior.\"\n  fi\n\n  echo \"\"\n  echo \"\U0001F4CB Pods despu\xE9s del\
        \ rollback:\"\n  kubectl get pods -n \"${K8S_NAMESPACE}\" -l \"app=${ROLLBACK_DEPLOYMENT}\"\
        \ -o wide\n\n  # Verificar que todos los pods est\xE9n ready\n  READY_COUNT=$(kubectl\
        \ get pods -n \"${K8S_NAMESPACE}\" -l \"app=${ROLLBACK_DEPLOYMENT}\" -o jsonpath='{range\
        \ .items[*]}{.status.containerStatuses[0].ready}{\"\\n\"}{end}' 2>/dev/null\
        \ | grep -c \"true\" || echo \"0\")\n  TOTAL_PODS=$(kubectl get pods -n \"\
        ${K8S_NAMESPACE}\" -l \"app=${ROLLBACK_DEPLOYMENT}\" --no-headers 2>/dev/null\
        \ | wc -l || echo \"0\")\n\n  echo \"\"\n  echo \"\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\"\n  echo \"\U0001F4CA Resultado: ${READY_COUNT}/${TOTAL_PODS}\
        \ pods ready\"\n  if [ \"$READY_COUNT\" = \"$TOTAL_PODS\" ] && [ \"$TOTAL_PODS\"\
        \ -gt 0 ] 2>/dev/null; then\n    echo \"\u2705 Rollback exitoso.\"\n  else\n\
        \    echo \"\u26A0\uFE0F Algunos pods no est\xE1n ready.\"\n  fi\n  echo \"\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\nfi\n"
    container:
      image: bitnami/kubectl:latest
    env:
      K8S_NAMESPACE: ${CI_PROJECT_NAME}
      ROLLBACK_DEPLOYMENT: ${CI_PROJECT_NAME}
      ROLLBACK_REVISION: ''
      ROLLBACK_VERIFY: 'true'
      ROLLBACK_VERIFY_TIMEOUT: '120'
env:
  ROLLBACK_DISABLED: 'false'
