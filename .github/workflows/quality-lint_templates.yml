name: Quality Lint Templates

on:
  workflow_call:
    inputs:
      LINT_PATH:
        description: 'Ruta a validar con yamllint'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        env:
          LINT_PATH: ${{ inputs.LINT_PATH }}
        run: |
          pip install --quiet yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable, trailing-spaces: disable, empty-lines: disable, document-start: disable, new-line-at-end-of-file: disable, key-duplicates: disable}}" "$LINT_PATH"

  actionlint:
    name: actionlint (GitHub Actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          ls .github/workflows/*.y*ml >/dev/null 2>&1 || { echo "ℹ️ Sin workflows que validar."; exit 0; }
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
