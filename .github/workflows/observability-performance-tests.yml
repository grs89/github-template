name: Observability Performance Tests
on:
  workflow_call:
    inputs:
      PERF_DISABLED:
        description: PERF_DISABLED
        required: false
        type: string
        default: 'false'
      PERF_TARGET_URL:
        description: PERF_TARGET_URL
        required: false
        type: string
        default: ''
      PERF_DURATION:
        description: PERF_DURATION
        required: false
        type: string
        default: 30s
      PERF_VUS:
        description: PERF_VUS
        required: false
        type: string
        default: '10'
      PERF_THRESHOLD_P95:
        description: PERF_THRESHOLD_P95
        required: false
        type: string
        default: '500'
      PERF_THRESHOLD_ERROR_RATE:
        description: PERF_THRESHOLD_ERROR_RATE
        required: false
        type: string
        default: '0.1'
      PERF_SCRIPT:
        description: PERF_SCRIPT
        required: false
        type: string
        default: ''
      PERF_FAIL_ON_THRESHOLD:
        description: PERF_FAIL_ON_THRESHOLD
        required: false
        type: string
        default: 'false'
permissions:
  contents: read
jobs:
  performance_test:
    name: performance test
    runs-on: ubuntu-latest
    if: inputs.PERF_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - uses: grafana/setup-k6-action@v1
    - name: performance test
      run: |
        if [ "$PERF_DISABLED" = "true" ]; then
          echo "⏭️ Tests de rendimiento deshabilitados. Omitiendo."
          exit 0
        fi

        if [ -z "$PERF_TARGET_URL" ] && [ -z "$PERF_SCRIPT" ]; then
          echo "❌ ERROR: Define PERF_TARGET_URL o PERF_SCRIPT."
          echo "💡 PERF_TARGET_URL: URL del servicio a testear"
          echo "💡 PERF_SCRIPT: Ruta a un script k6 personalizado"
          exit 1
        fi

        mkdir -p perf-reports
        echo "═══════════════════════════════════"
        echo "⚡ Performance Tests (k6)"
        echo "  🎯 Target:    ${PERF_TARGET_URL:-custom script}"
        echo "  👥 VUs:       ${PERF_VUS}"
        echo "  ⏱️  Duración:  ${PERF_DURATION}"
        echo "  📊 P95 Limit: ${PERF_THRESHOLD_P95}ms"
        echo "═══════════════════════════════════"

        if [ -n "$PERF_SCRIPT" ] && [ -f "$PERF_SCRIPT" ]; then
          echo "🔧 Usando script personalizado: ${PERF_SCRIPT}"
          k6 run \
            --out json=perf-reports/k6-results.json \
            --summary-export=perf-reports/k6-summary.json \
            "${PERF_SCRIPT}"
        else
          echo "🚀 Generando script de prueba..."
          cat > /tmp/perf-test.js <<EOF
        import http from 'k6/http';
        import { check, sleep } from 'k6';
        import { Rate, Trend } from 'k6/metrics';

        const errorRate = new Rate('errors');
        const responseTime = new Trend('response_time');

        export const options = {
          vus: ${PERF_VUS},
          duration: '${PERF_DURATION}',
          thresholds: {
            http_req_duration: ['p(95)<${PERF_THRESHOLD_P95}'],
            errors: ['rate<${PERF_THRESHOLD_ERROR_RATE}'],
          },
        };

        export default function () {
          const res = http.get('${PERF_TARGET_URL}');
          check(res, {
            'status is 2xx': (r) => r.status >= 200 && r.status < 300,
            'response time < ${PERF_THRESHOLD_P95}ms': (r) => r.timings.duration < ${PERF_THRESHOLD_P95},
          });
          errorRate.add(res.status >= 400);
          responseTime.add(res.timings.duration);
          sleep(1);
        }
        EOF

          k6 run \
            --out json=perf-reports/k6-results.json \
            --summary-export=perf-reports/k6-summary.json \
            /tmp/perf-test.js || PERF_FAILED="true"
        fi

        echo ""
        echo "═══════════════════════════════════"
        echo "📊 Resumen de Performance:"
        if [ -f "perf-reports/k6-summary.json" ]; then
          cat perf-reports/k6-summary.json | k6 || cat perf-reports/k6-summary.json 2>/dev/null || true
        fi
        echo "═══════════════════════════════════"

        if [ "$PERF_FAILED" = "true" ] && [ "$PERF_FAIL_ON_THRESHOLD" = "true" ]; then
          echo "❌ Thresholds de rendimiento no cumplidos."
          exit 1
        fi
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: performance_test-artifacts
        path: perf-reports/
        if-no-files-found: ignore
      if: always()
    env:
      PERF_DISABLED: ${{ inputs.PERF_DISABLED }}
      PERF_TARGET_URL: ${{ inputs.PERF_TARGET_URL }}
      PERF_DURATION: ${{ inputs.PERF_DURATION }}
      PERF_VUS: ${{ inputs.PERF_VUS }}
      PERF_THRESHOLD_P95: ${{ inputs.PERF_THRESHOLD_P95 }}
      PERF_THRESHOLD_ERROR_RATE: ${{ inputs.PERF_THRESHOLD_ERROR_RATE }}
      PERF_SCRIPT: ${{ inputs.PERF_SCRIPT }}
      PERF_FAIL_ON_THRESHOLD: ${{ inputs.PERF_FAIL_ON_THRESHOLD }}
