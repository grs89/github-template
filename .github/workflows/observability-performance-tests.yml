name: Observability Performance Tests
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  performance_test:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$PERF_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\uFE0F Tests\
        \ de rendimiento deshabilitados. Omitiendo.\"\n  exit 0\nfi\n\nif [ -z \"\
        $PERF_TARGET_URL\" ] && [ -z \"$PERF_SCRIPT\" ]; then\n  echo \"\u274C ERROR:\
        \ Define PERF_TARGET_URL o PERF_SCRIPT.\"\n  echo \"\U0001F4A1 PERF_TARGET_URL:\
        \ URL del servicio a testear\"\n  echo \"\U0001F4A1 PERF_SCRIPT: Ruta a un\
        \ script k6 personalizado\"\n  exit 1\nfi\n\nmkdir -p perf-reports"
    - name: Run Script
      run: "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\necho\
        \ \"\u26A1 Performance Tests (k6)\"\necho \"  \U0001F3AF Target:    ${PERF_TARGET_URL:-custom\
        \ script}\"\necho \"  \U0001F465 VUs:       ${PERF_VUS}\"\necho \"  \u23F1\
        \uFE0F  Duraci\xF3n:  ${PERF_DURATION}\"\necho \"  \U0001F4CA P95 Limit: ${PERF_THRESHOLD_P95}ms\"\
        \necho \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\n\nif\
        \ [ -n \"$PERF_SCRIPT\" ] && [ -f \"$PERF_SCRIPT\" ]; then\n  echo \"\U0001F527\
        \ Usando script personalizado: ${PERF_SCRIPT}\"\n  k6 run \\\n    --out json=perf-reports/k6-results.json\
        \ \\\n    --summary-export=perf-reports/k6-summary.json \\\n    \"${PERF_SCRIPT}\"\
        \nelse\n  echo \"\U0001F680 Generando script de prueba...\"\n  cat > /tmp/perf-test.js\
        \ <<EOF\nimport http from 'k6/http';\nimport { check, sleep } from 'k6';\n\
        import { Rate, Trend } from 'k6/metrics';\n\nconst errorRate = new Rate('errors');\n\
        const responseTime = new Trend('response_time');\n\nexport const options =\
        \ {\n  vus: ${PERF_VUS},\n  duration: '${PERF_DURATION}',\n  thresholds: {\n\
        \    http_req_duration: ['p(95)<${PERF_THRESHOLD_P95}'],\n    errors: ['rate<${PERF_THRESHOLD_ERROR_RATE}'],\n\
        \  },\n};\n\nexport default function () {\n  const res = http.get('${PERF_TARGET_URL}');\n\
        \  check(res, {\n    'status is 2xx': (r) => r.status >= 200 && r.status <\
        \ 300,\n    'response time < ${PERF_THRESHOLD_P95}ms': (r) => r.timings.duration\
        \ < ${PERF_THRESHOLD_P95},\n  });\n  errorRate.add(res.status >= 400);\n \
        \ responseTime.add(res.timings.duration);\n  sleep(1);\n}\nEOF\n\n  k6 run\
        \ \\\n    --out json=perf-reports/k6-results.json \\\n    --summary-export=perf-reports/k6-summary.json\
        \ \\\n    /tmp/perf-test.js || PERF_FAILED=\"true\"\nfi\n\necho \"\"\necho\
        \ \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\necho \"\U0001F4CA\
        \ Resumen de Performance:\"\nif [ -f \"perf-reports/k6-summary.json\" ]; then\n\
        \  cat perf-reports/k6-summary.json | k6 || cat perf-reports/k6-summary.json\
        \ 2>/dev/null || true\nfi\necho \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\"\n\nif [ \"$PERF_FAILED\" = \"true\" ] && [ \"$PERF_FAIL_ON_THRESHOLD\"\
        \ = \"true\" ]; then\n  echo \"\u274C Thresholds de rendimiento no cumplidos.\"\
        \n  exit 1\nfi\n"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: performance_test-artifacts
        path: perf-reports/
    container:
      image: ${K6_IMAGE}
    env:
      PERF_TARGET_URL: ''
      PERF_DURATION: 30s
      PERF_VUS: '10'
      PERF_THRESHOLD_P95: '500'
      PERF_THRESHOLD_ERROR_RATE: '0.1'
      PERF_SCRIPT: ''
      PERF_FAIL_ON_THRESHOLD: 'false'
env:
  PERF_DISABLED: 'false'
  K6_IMAGE: grafana/k6:latest
