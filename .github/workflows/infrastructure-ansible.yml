name: Infrastructure Ansible

on:
  workflow_call:
    inputs:
      TEMPLATE_PROJECT:
        description: 'Repo de plantillas con .github/utilidades/generate_report.py'
        required: false
        type: string
        default: 'grs89/github-template'

permissions:
  contents: read

jobs:
  run_ansible_lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet ansible-lint
      - name: ansible-lint
        run: ansible-lint . --exclude .git --exclude .venv

  run_yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet yamllint
      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable, trailing-spaces: disable, new-line-at-end-of-file: disable, braces: disable, comments: disable}}" .

  generate_security_report:
    name: Reporte de seguridad
    runs-on: ubuntu-latest
    needs: [run_ansible_lint, run_yamllint]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.TEMPLATE_PROJECT }}
          path: github-template-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generar reporte
        run: |
          pip install --quiet jinja2 weasyprint
          find . -path ./github-template-utils -prune -o -name '*.json' -exec cp -f {} . \; 2>/dev/null || true
          python3 github-template-utils/.github/utilidades/generate_report.py || echo "⚠️ generate_report.py falló"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: |
            *.html
            *.pdf
          if-no-files-found: ignore
