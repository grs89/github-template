name: Shared Security Scan

on:
  workflow_call:
    inputs:
      CONTEXT_DIR:
        required: true
        type: string
      IMAGE_TAG:
        required: true
        type: string
      REPO_LC:
        required: true
        type: string
      REGISTRY:
        required: false
        type: string
        default: 'ghcr.io'
      SITE_URL:
        required: false
        type: string
        default: ''
      DETECTED_LANG:
        required: false
        type: string
        default: 'unknown'
    secrets:
      REGISTRY_USER:
        required: false
      REGISTRY_PASSWORD:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      DOCKERHUB_REPO:
        required: false
      SITE_URL:
        required: false

jobs:
  trivy-sast:
    name: 🔐 Trivy SAST (filesystem)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.CONTEXT_DIR }}'
          format: 'sarif'
          output: 'trivy-fs-report.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy filesystem scan (summary)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ inputs.CONTEXT_DIR }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          output: 'trivy-fs-summary.txt'

      - name: Write SAST Summary to Job DX
        if: always()
        run: |
          echo "## 🔐 Resultado SAST (Código Fuente)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat trivy-fs-summary.txt 2>/dev/null || echo "No se encontraron vulnerabilidades altas o críticas." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "📥 Revisa los reportes en la lengüeta **Security** o descarga los PDF al finalizar el pipeline." >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-report.sarif'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-sast-report
          path: trivy-fs-report.sarif
          retention-days: 7

  trivy-image-scan:
    name: 🔎 Trivy Image Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Prepare Repository Name
        id: prep
        run: |
          REPO_SUFFIX="${GITHUB_REPOSITORY##*/}"
          REPO_SUFFIX="${REPO_SUFFIX,,}"
          REPO="${GITHUB_REPOSITORY,,}"
          
          REG_USER="${{ secrets.REGISTRY_USER }}"
          if [ -n "$REG_USER" ]; then
             CLEAN_USER=$(echo "${REG_USER,,}" | tr -d ' *')
             if [ -n "$CLEAN_USER" ]; then
               REPO="${CLEAN_USER}/${REPO_SUFFIX}"
             fi
          fi
          
          REPO="${REPO// /}"
          INPUT_REPO="${{ inputs.REPO_LC }}"
          if [ -n "$INPUT_REPO" ]; then
            REPO="$INPUT_REPO"
          fi
          echo "repo_lc=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ inputs.REGISTRY }}/${{ steps.prep.outputs.repo_lc }}:${{ inputs.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-image-report.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy image scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ inputs.REGISTRY }}/${{ steps.prep.outputs.repo_lc }}:${{ inputs.IMAGE_TAG }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          output: 'trivy-image-summary.txt'

      - name: Write Image Scan Summary to Job DX
        if: always()
        run: |
          echo "## 🐳 Resultado Escaneo de Imagen" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat trivy-image-summary.txt 2>/dev/null || echo "No se encontraron vulnerabilidades altas o críticas." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-report.sarif'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-report.sarif
          retention-days: 7

  trivy-dockerhub-scan:
    name: 🔎 Trivy Docker Hub Image Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    # Solo ejecutar si se proporcionaron credenciales de Docker Hub (se evalúa en el parseo)
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_REPO: ${{ secrets.DOCKERHUB_REPO }}
    steps:
      - name: Parse DOCKER_IMAGE lowercase
        id: prep
        run: |
          # 1. Default repo name to GITHUB_REPOSITORY suffix
          REPO="${GITHUB_REPOSITORY##*/}"
          REPO="${REPO,,}"
          REPO="${REPO// /}"
          
          # 2. Use DOCKER_REPO if provided
          if [ -n "$DOCKER_REPO" ]; then
            CLEAN_REPO=$(echo "${DOCKER_REPO,,}" | tr -d ' *')
            if [ -n "$CLEAN_REPO" ]; then
              REPO="$CLEAN_REPO"
            fi
          fi
          
          # 3. Default user to DOCKER_USER or GITHUB_REPOSITORY owner
          USER="${DOCKER_USER}"
          if [ -z "$USER" ]; then
            USER="${GITHUB_REPOSITORY%%/*}"
            USER="${USER,,}"
            USER="${USER// /}"
          fi
          
          DOCKER_IMAGE="${USER}/${REPO}"
          D_LC="${DOCKER_IMAGE,,}"
          echo "docker_image_lc=${D_LC}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ steps.prep.outputs.docker_image_lc }}:${{ inputs.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-dockerhub-report.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Run Trivy image scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ steps.prep.outputs.docker_image_lc }}:${{ inputs.IMAGE_TAG }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-dockerhub-report.sarif'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-dockerhub-report
          path: trivy-dockerhub-report.sarif
          retention-days: 7

  checkov-scan:
    name: 🏗️ Checkov IaC Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ inputs.CONTEXT_DIR }}
          framework: all
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: true

      - name: Upload Checkov Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json
          retention-days: 7

  dast-scan:
    name: 🌐 DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check if SITE_URL is configured
        id: check-url
        env:
          SITE_URL_SECRET: ${{ secrets.SITE_URL }}
          SITE_URL_INPUT: ${{ inputs.SITE_URL }}
        run: |
          RESOLVED_URL="${SITE_URL_INPUT:-$SITE_URL_SECRET}"
          if [ -z "$RESOLVED_URL" ]; then
            echo "⚠️ La variable/secreto SITE_URL no está configurada. Omitiendo DAST Scan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ SITE_URL detectada. DAST Scan habilitado."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: ${{ steps.check-url.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Prepare Repository Name
        if: ${{ steps.check-url.outputs.skip != 'true' }}
        id: prep
        run: |
          REPO_SUFFIX="${GITHUB_REPOSITORY##*/}"
          REPO_SUFFIX="${REPO_SUFFIX,,}"
          REPO="${GITHUB_REPOSITORY,,}"
          
          REG_USER="${{ secrets.REGISTRY_USER }}"
          if [ -n "$REG_USER" ]; then
             CLEAN_USER=$(echo "${REG_USER,,}" | tr -d ' *')
             if [ -n "$CLEAN_USER" ]; then
               REPO="${CLEAN_USER}/${REPO_SUFFIX}"
             fi
          fi
          
          REPO="${REPO// /}"
          INPUT_REPO="${{ inputs.REPO_LC }}"
          if [ -n "$INPUT_REPO" ]; then
            REPO="$INPUT_REPO"
          fi
          echo "repo_lc=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Log in to Registry
        if: ${{ steps.check-url.outputs.skip != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Run Ephemeral Container
        if: ${{ steps.check-url.outputs.skip != 'true' }}
        id: run-app
        run: |
          IMAGE_REF="${{ inputs.REGISTRY }}/${{ steps.prep.outputs.repo_lc }}:${{ inputs.IMAGE_TAG }}"
          echo "🚀 Desplegando contenedor efímero: ${IMAGE_REF}"
          
          docker rm -f ephemeral-app 2>/dev/null || true
          docker run -d --name ephemeral-app -P "${IMAGE_REF}"
          
          MAPPED_PORT=$(docker port ephemeral-app | head -n 1 | awk -F: '{print $2}')
          
          if [ -z "$MAPPED_PORT" ]; then
            echo "⚠️ No se detectó puerto expuesto. Mapeando 8080:8080 por defecto..."
            docker rm -f ephemeral-app 2>/dev/null || true
            docker run -d --name ephemeral-app -p 8080:8080 "${IMAGE_REF}"
            MAPPED_PORT="8080"
          fi
          
          echo "MAPPED_PORT=${MAPPED_PORT}" >> "$GITHUB_ENV"
          echo "✅ Contenedor corriendo en el puerto del host: ${MAPPED_PORT}"
          
          echo "⏳ Esperando respuesta HTTP del contenedor..."
          for i in {1..30}; do
            if curl -s -f "http://localhost:${MAPPED_PORT}" > /dev/null; then
              echo "✅ ¡Aplicación lista para escaneo!"
              break
            fi
            echo "   Esperando..."
            sleep 1
          done

      - name: Run OWASP ZAP Baseline Scan
        if: ${{ steps.check-url.outputs.skip != 'true' }}
        run: |
          echo "🌐 Iniciando escaneo DAST con OWASP ZAP en http://localhost:${MAPPED_PORT}..."
          docker run --rm --network="host" -v $(pwd):/zap/wrk/:rw -t zaproxy/zap-stable zap-baseline.py \
            -t "http://localhost:${MAPPED_PORT}" \
            -J zap-report.json || true
          
          echo "📂 Reportes generados en el espacio de trabajo:"
          ls -lh zap-report.json 2>/dev/null || echo "❌ No se encontró zap-report.json"

      - name: Write DAST Summary to Job DX
        if: ${{ always() && steps.check-url.outputs.skip != 'true' }}
        run: |
          echo "## 🌐 Resultado DAST Efímero (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f zap-report.json ]; then
            HIGH_ALERTS=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' zap-report.json 2>/dev/null || echo 0)
            MEDIUM_ALERTS=$(jq '[.site[].alerts[] | select(.riskcode == "2")] | length' zap-report.json 2>/dev/null || echo 0)
            LOW_ALERTS=$(jq '[.site[].alerts[] | select(.riskcode == "1")] | length' zap-report.json 2>/dev/null || echo 0)
            INFO_ALERTS=$(jq '[.site[].alerts[] | select(.riskcode == "0")] | length' zap-report.json 2>/dev/null || echo 0)
            
            echo "| Severidad | Hallazgos |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Alto | ${HIGH_ALERTS} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medio | ${MEDIUM_ALERTS} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔵 Bajo | ${LOW_ALERTS} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚪ Info | ${INFO_ALERTS} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Revisa los detalles en el reporte PDF consolidado." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ El reporte de OWASP ZAP no se generó. Es posible que el contenedor no expusiera un puerto HTTP interactivo." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Clean up Ephemeral Container
        if: ${{ always() && steps.check-url.outputs.skip != 'true' }}
        run: |
          echo "🧹 Limpiando contenedor efímero..."
          docker rm -f ephemeral-app 2>/dev/null || true

      - name: Upload ZAP Report Artifact
        if: ${{ always() && steps.check-url.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.json
          retention-days: 7
          if-no-files-found: ignore

  generate-security-report:
    name: 📄 Generate Security Report
    needs:
      - trivy-sast
      - trivy-image-scan
      - trivy-dockerhub-scan
      - checkov-scan
      - dast-scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Template for Utilities
        uses: actions/checkout@v4
        with:
          repository: grs89/github-template
          path: github-template-utils

      - name: Download Trivy SAST report
        uses: actions/download-artifact@v4
        with:
          name: trivy-sast-report
        continue-on-error: true

      - name: Download Trivy image report
        uses: actions/download-artifact@v4
        with:
          name: trivy-image-report
        continue-on-error: true

      - name: Download Trivy Docker Hub report
        uses: actions/download-artifact@v4
        with:
          name: trivy-dockerhub-report
        continue-on-error: true

      - name: Download Checkov report
        uses: actions/download-artifact@v4
        with:
          name: checkov-report
        continue-on-error: true

      - name: Download ZAP DAST report
        uses: actions/download-artifact@v4
        with:
          name: zap-report
        continue-on-error: true

      - name: Download Hadolint report
        uses: actions/download-artifact@v4
        with:
          name: hadolint-report
        continue-on-error: true

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
        continue-on-error: true

      - name: Rename SARIF files for generate_report.py detection
        run: |
          echo "🔄 Preparando archivos de reporte..."
          [ -f trivy-fs-report.sarif       ] && cp trivy-fs-report.sarif       trivy-sast-report.json      || true
          [ -f trivy-image-report.sarif     ] && cp trivy-image-report.sarif     trivy-report.json           || true
          [ -f trivy-dockerhub-report.sarif ] && cp trivy-dockerhub-report.sarif trivy-dockerhub-report.json || true
          echo "📂 Archivos disponibles:"
          ls -lh *.json *.sarif 2>/dev/null || echo "  (ninguno encontrado)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --quiet jinja2 weasyprint

      - name: Run generate_report.py
        env:
          CI_LANG: ${{ inputs.DETECTED_LANG }}
          CI_TAG: ${{ inputs.IMAGE_TAG }}
          CI_REPO: ${{ inputs.REPO_LC }}
          CI_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          CI_DAST_ACTIVE: ${{ inputs.SITE_URL != '' && 'true' || 'false' }}
        run: |
          echo "📊 Generando reporte de seguridad consolidado..."
          python github-template-utils/.github/utilidades/generate_report.py

      - name: Upload HTML/PDF reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: |
            security-report.html
            security-report.pdf
            *.html
            *.pdf
          retention-days: 30
          if-no-files-found: ignore
