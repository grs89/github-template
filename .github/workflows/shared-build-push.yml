name: Shared Build & Push

on:
  workflow_call:
    inputs:
      DETECTED_LANG:
        required: false
        type: string
        default: 'unknown'
      IMAGE_TAG:
        required: false
        type: string
        default: ''
      REPO_LC:
        required: false
        type: string
        default: ''
      CONTEXT_DIR:
        required: false
        type: string
        default: '.'
      SERVICE_NAME:
        required: false
        type: string
        default: ''
      DOCKERFILE_PATH:
        required: false
        type: string
        default: 'Dockerfile'
      REGISTRY:
        required: false
        type: string
        default: 'ghcr.io'
      PLATFORMS:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      PUSH_TO_ECR:
        required: false
        type: boolean
        default: false
      AWS_REGION:
        required: false
        type: string
        default: 'us-east-1'
    secrets:
      GITHUB_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      ECR_REGISTRY:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
    outputs:
      image_digest:
        description: 'Digest de la imagen Docker publicada'
        value: ${{ jobs.build-push.outputs.image_digest }}

jobs:
  build-push:
    name: 🏗️ Build & Push Docker Image (Multi-Registry)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Docker Hub (Fallback/Dual)
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔑 Log in to AWS ECR (Fallback/Dual)
        if: inputs.PUSH_TO_ECR == true && env.HAS_AWS == 'true'
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ inputs.AWS_REGION || 'us-east-1' }}

      - name: Prepare Registry Tags
        id: prep
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SRV_NAME="${IN_SERVICE_NAME}"
          [ -z "$SRV_NAME" ] && SRV_NAME="$REPO_NAME"

          TAG="${IN_IMAGE_TAG}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}_${GITHUB_SHA::7}"
          fi

          IMAGES="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${IN_CONTEXT_DIR}" != "." ] && [ -n "${IN_SERVICE_NAME_2}" ]; then
            IMAGES="ghcr.io/${GITHUB_REPOSITORY,,}/${SRV_NAME}"
          fi

          # Añadir DockerHub si está configurado
          if [ -n "${SECRET_DOCKERHUB_USERNAME}" ]; then
            DH_USER="${SECRET_DOCKERHUB_USERNAME}"
            IMAGES="${IMAGES},${DH_USER}/${SRV_NAME}"
          fi

          # Añadir AWS ECR si está configurado
          if [ "${IN_PUSH_TO_ECR}" = "true" ] && [ -n "${SECRET_ECR_REGISTRY}" ]; then
            ECR_REG="${SECRET_ECR_REGISTRY}"
            IMAGES="${IMAGES},${ECR_REG}/${SRV_NAME}"
          fi

          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

        env:
          IN_SERVICE_NAME: ${{ inputs.SERVICE_NAME || '' }}
          IN_IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
          IN_CONTEXT_DIR: ${{ inputs.CONTEXT_DIR }}
          IN_SERVICE_NAME_2: ${{ inputs.SERVICE_NAME }}
          IN_PUSH_TO_ECR: ${{ inputs.PUSH_TO_ECR }}
          SECRET_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      - name: Determine Dockerfile
        id: dockerfile
        shell: bash
        run: |
          DOCKERFILE="${IN_CONTEXT_DIR}/${IN_DOCKERFILE_PATH}"
          if [ ! -f "$DOCKERFILE" ]; then
            DOCKERFILE="${IN_CONTEXT_DIR}/Dockerfile"
          fi
          if [ ! -f "$DOCKERFILE" ]; then
            DOCKERFILE="./Dockerfile"
          fi
          echo "path=${DOCKERFILE}" >> "$GITHUB_OUTPUT"

        env:
          IN_CONTEXT_DIR: ${{ inputs.CONTEXT_DIR }}
          IN_DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.images }}
          tags: |
            type=raw,value=${{ steps.prep.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.CONTEXT_DIR || '.' }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          provenance: true
          sbom: true
          platforms: ${{ inputs.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "✅ Imagen publicada exitosamente en registros configurados."
          echo "   Digest: ${OUT_DIGEST}"

        env:
          OUT_DIGEST: ${{ steps.build.outputs.digest }}
  sign-image:
    name: ✍️ Sign Image (Cosign)
    runs-on: ubuntu-latest
    needs: build-push
    continue-on-error: true
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Firmar Imagen con Cosign (Keyless Sigstore)
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          SRV_NAME="${IN_SERVICE_NAME}"
          [ -z "$SRV_NAME" ] && SRV_NAME="${GITHUB_REPOSITORY##*/}"

          IMAGE_REF="ghcr.io/${REPO_LOWER}@${OUT_IMAGE_DIGEST}"
          if [ "${IN_CONTEXT_DIR}" != "." ] && [ -n "${IN_SERVICE_NAME_2}" ]; then
            IMAGE_REF="ghcr.io/${REPO_LOWER}/${SRV_NAME}@${OUT_IMAGE_DIGEST}"
          fi

          echo "✍️ Firmando imagen: ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}" || true
        env:
          IN_SERVICE_NAME: ${{ inputs.SERVICE_NAME || '' }}
          IN_CONTEXT_DIR: ${{ inputs.CONTEXT_DIR }}
          IN_SERVICE_NAME_2: ${{ inputs.SERVICE_NAME }}
          OUT_IMAGE_DIGEST: ${{ needs.build-push.outputs.image_digest }}
