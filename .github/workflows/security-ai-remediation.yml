name: Security AI Remediation

# Lee reportes SARIF / gl-sast-*.json de la corrida y publica sugerencias de corrección generadas por un LLM
# como comentarios de revisión (bloques `suggestion`) en el Pull Request.

on:
  workflow_call:
    inputs:
      AI_PROVIDER:
        description: 'ollama, openai, lm-studio, gemini o claude'
        required: false
        type: string
        default: 'ollama'
      AI_API_URL:
        description: 'URL del servidor LLM (ollama / lm-studio)'
        required: false
        type: string
        default: 'http://ollama-service.local:11434'
      AI_MODEL:
        description: 'Modelo a utilizar'
        required: false
        type: string
        default: 'codegemma'
      AI_MAX_SUGGESTIONS:
        description: 'Máximo de sugerencias por corrida (acota el consumo de cuota del LLM)'
        required: false
        type: string
        default: '10'
      REPORTS_ARTIFACT_PATTERN:
        description: 'Patrón de artefactos con reportes SARIF a analizar'
        required: false
        type: string
        default: '*report*'
      TEMPLATE_PROJECT:
        description: 'Repo de plantillas que contiene scripts/ai_remediation.py'
        required: false
        type: string
        default: 'grs89/github-template'
      TEMPLATE_REF:
        description: 'Rama o tag del repo de plantillas'
        required: false
        type: string
        default: 'main'
    secrets:
      AI_TOKEN:
        description: 'API key del proveedor LLM'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_remediation:
    name: AI remediation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ inputs.REPORTS_ARTIFACT_PATTERN }}
          merge-multiple: true
          path: ai-reports

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Obtener agente
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_PROJECT: ${{ inputs.TEMPLATE_PROJECT }}
          TEMPLATE_REF: ${{ inputs.TEMPLATE_REF }}
        run: |
          if [ -f scripts/ai_remediation.py ]; then
            cp scripts/ai_remediation.py "$RUNNER_TEMP/remediator.py"
          else
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_PROJECT}/contents/scripts/ai_remediation.py?ref=${TEMPLATE_REF}" > "$RUNNER_TEMP/remediator.py" \
              || { echo "❌ No se pudo obtener ai_remediation.py"; exit 1; }
          fi
          pip install --quiet requests

      - name: Ejecutar agente de IA
        env:
          AI_PROVIDER: ${{ inputs.AI_PROVIDER }}
          AI_API_URL: ${{ inputs.AI_API_URL }}
          AI_MODEL: ${{ inputs.AI_MODEL }}
          AI_MAX_SUGGESTIONS: ${{ inputs.AI_MAX_SUGGESTIONS }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # los reportes descargados se analizan junto al código del PR
          python3 "$RUNNER_TEMP/remediator.py"
