name: Utilities Semantic Release
on:
  workflow_call:
    inputs:
      SEMANTIC_RELEASE_DISABLED:
        description: SEMANTIC_RELEASE_DISABLED
        required: false
        type: string
        default: 'false'
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  semantic_release:
    name: semantic release
    runs-on: ubuntu-latest
    if: inputs.SEMANTIC_RELEASE_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: semantic release
      run: |
        if [ "$SEMANTIC_RELEASE_DISABLED" = "true" ]; then
          echo "⏭️ Semantic Release deshabilitado. Omitiendo."
          exit 0
        fi
        npm install -g semantic-release @semantic-release/github @semantic-release/changelog @semantic-release/git @semantic-release/commit-analyzer @semantic-release/release-notes-generator
        echo "🚀 Iniciando proceso de release automático..."

        # Crear archivo de configuración dinámico para semantic-release
        cat <<EOF > .releaserc.json
        {
          "branches": ["main", "master", "develop", "dev"],
          "plugins": [
            "@semantic-release/commit-analyzer",
            "@semantic-release/release-notes-generator",
            ["@semantic-release/changelog", {
              "changelogFile": "CHANGELOG.md"
            }],
            ["@semantic-release/git", {
              "assets": ["CHANGELOG.md", "package.json", "version.yml"],
              "message": "chore(release): \${nextRelease.version} [skip ci]\n\n\${nextRelease.notes}"
            }],
            "@semantic-release/github"
          ]
        }
        EOF

        npx semantic-release

        echo "✅ Proceso de release finalizado."
    env:
      SEMANTIC_RELEASE_DISABLED: ${{ inputs.SEMANTIC_RELEASE_DISABLED }}
      GITHUB_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
