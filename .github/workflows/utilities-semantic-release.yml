name: Utilities Semantic Release
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  semantic_release:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$SEMANTIC_RELEASE_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\
        \uFE0F Semantic Release deshabilitado. Omitiendo.\"\n  exit 0\nfi\n\napk add\
        \ --no-cache git openssh-client\nnpm install -g semantic-release @semantic-release/gitlab\
        \ @semantic-release/changelog @semantic-release/git @semantic-release/commit-analyzer\
        \ @semantic-release/release-notes-generator"
    - name: Run Script
      run: "echo \"\U0001F680 Iniciando proceso de release autom\xE1tico...\"\n\n\
        # Crear archivo de configuraci\xF3n din\xE1mico para semantic-release\ncat\
        \ <<EOF > .releaserc.json\n{\n  \"branches\": [\"main\", \"master\", \"develop\"\
        , \"dev\"],\n  \"plugins\": [\n    \"@semantic-release/commit-analyzer\",\n\
        \    \"@semantic-release/release-notes-generator\",\n    [\"@semantic-release/changelog\"\
        , {\n      \"changelogFile\": \"CHANGELOG.md\"\n    }],\n    [\"@semantic-release/git\"\
        , {\n      \"assets\": [\"CHANGELOG.md\", \"package.json\", \"version.yml\"\
        ],\n      \"message\": \"chore(release): \\${nextRelease.version} [skip ci]\\\
        n\\n\\${nextRelease.notes}\"\n    }],\n    \"@semantic-release/gitlab\"\n\
        \  ]\n}\nEOF\n\nnpx semantic-release\n\necho \"\u2705 Proceso de release finalizado.\"\
        \n"
    container:
      image: ${SEMANTIC_RELEASE_IMAGE}
env:
