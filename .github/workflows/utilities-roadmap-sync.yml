name: Utilities Roadmap Sync

# Sincroniza ROADMAP.md con Milestones e Issues de GitHub (idempotente: crea/actualiza/cierra).

on:
  workflow_call:
    inputs:
      ROADMAP_FILE:
        description: 'Ruta del ROADMAP.md'
        required: false
        type: string
        default: 'ROADMAP.md'
      DRY_RUN:
        description: 'Simular sin escribir en GitHub'
        required: false
        type: boolean
        default: false
      TEMPLATE_PROJECT:
        description: 'Repo de plantillas con scripts/sync_roadmap_milestones.py'
        required: false
        type: string
        default: 'grs89/github-template'
      TEMPLATE_REF:
        description: 'Rama o tag del repo de plantillas'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read
  issues: write

jobs:
  sync_roadmap_milestones:
    name: Sync ROADMAP → Milestones
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar
        env:
          GH_TOKEN: ${{ github.token }}
          ROADMAP_FILE: ${{ inputs.ROADMAP_FILE }}
          DRY_RUN: ${{ inputs.DRY_RUN }}
          TEMPLATE_PROJECT: ${{ inputs.TEMPLATE_PROJECT }}
          TEMPLATE_REF: ${{ inputs.TEMPLATE_REF }}
        run: |
          [ -f "$ROADMAP_FILE" ] || { echo "ℹ️ No existe $ROADMAP_FILE. Omitiendo."; exit 0; }
          if [ -f scripts/sync_roadmap_milestones.py ]; then cp scripts/sync_roadmap_milestones.py "$RUNNER_TEMP/sync.py"
          else
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_PROJECT}/contents/scripts/sync_roadmap_milestones.py?ref=${TEMPLATE_REF}" > "$RUNNER_TEMP/sync.py" \
              || { echo "❌ No se pudo obtener sync_roadmap_milestones.py"; exit 1; }
          fi
          ARGS=(--roadmap "$ROADMAP_FILE")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          python3 "$RUNNER_TEMP/sync.py" "${ARGS[@]}"
