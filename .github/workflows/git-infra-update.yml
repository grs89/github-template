        \nelse\n  echo \"A\xF1adiendo nuevo microservicio al reporte diario...\"\n\
        \  printf '  %s: \"%s\"\\n' \"${CI_PROJECT_NAME}\" \"${IMAGE_TAG:-${{ github.ref_name\
