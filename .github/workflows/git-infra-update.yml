        \  \"dev\")  ENV_DIR=\"DEV\" ;;\n  \"qa\")   ENV_DIR=\"STAGE\" ;;\n  \"pt\"\
        )   ENV_DIR=\"PT\" ;;\n  *)      ENV_DIR=\"${{ github.ref_name }}\" ;;\nesac\n\
        \necho \"Buscando archivos en entorno: ${ENV_DIR}...\"\nTARGET_FILES=$(find\
        \ \"${ENV_DIR}\" -name \"${CI_PROJECT_NAME}.yaml\" -type f)\n\nif [ -n \"\
        $TARGET_FILES\" ]; then\n  for FILE in $TARGET_FILES; do\n    echo \"Actualizando\
        \ imagen en: $FILE\"\n    sed -i \"s/\\(image:.*:\\).*/\\1${IMAGE_TAG:-${{\
