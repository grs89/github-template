        \ de la carpeta ${ENV_DIR}\"\n  echo \"Contenido de la carpeta ${ENV_DIR}:\"\
        \n  ls -R \"${ENV_DIR}\" || echo \"La carpeta ${ENV_DIR} no existe.\"\n  exit\
        \ 1\nfi\n\nRELEASE_DATE=$(TZ=\"America/Bogota\" date \"+%Y-%m-%d\")\nRELEASE_FILE=\"\
        ${ENV_DIR}/Release-${RELEASE_DATE}.yml\"\nCURRENT_DATE=$(TZ=\"America/Bogota\"\
        \ date \"+%Y-%m-%d %H:%M:%S\")\n\necho \"\U0001F4CA Gestionando resumen diario:\
        \ ${RELEASE_FILE}...\"\n\n# 1. Si no existe el archivo de HOY, es el primer\
        \ despliegue del d\xEDa\nif [ ! -f \"${RELEASE_FILE}\" ]; then\n  echo \"\U0001F195\
        \ Primer despliegue del d\xEDa (${RELEASE_DATE}). Limpiando registros anteriores...\"\
        \n  rm -f \"${ENV_DIR}/Release-\"*.yml || true\n  printf 'last_update: \"\
        %s\"\\nenvironment: \"%s\"\\nmicroservicios:\\n' \"${CURRENT_DATE}\" \"${ENV_DIR}\"\
        \ > \"${RELEASE_FILE}\"\nelse\n  # Si ya existe (mismo d\xEDa), solo actualizamos\
        \ la fecha de \xFAltima modificaci\xF3n\n  sed -i \"1s|.*|last_update: \\\"\
        ${CURRENT_DATE}\\\"|\" \"${RELEASE_FILE}\"\nfi\n\n# 2. Actualizar el microservicio\
