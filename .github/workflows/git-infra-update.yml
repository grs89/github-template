name: Git Infra Update
permissions:
  contents: read
jobs:
  commit_for_image_tag-argocd:
    name: Actualizar tag de imagen (GitOps)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: commit for image tag-argocd
      run: |
        mkdir -p ~/.ssh
        (echo "${DEPLOY_KEY}" | tr -d '\r'; echo "") > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"
        ssh-keyscan -H "${INFRA_REPO_URL%%:*}" >> ~/.ssh/known_hosts
        git clone git@${INFRA_REPO_URL}
        cd "${TARGET_FILE_PATH}"
        ls -al
        git checkout main
        case "${GITHUB_REF_NAME}" in
          "main") ENV_DIR="PROD" ;;
          "dev")  ENV_DIR="DEV" ;;
          "qa")   ENV_DIR="STAGE" ;;
          "pt")   ENV_DIR="PT" ;;
          *)      ENV_DIR="${GITHUB_REF_NAME}" ;;
        esac

        echo "Buscando archivos en entorno: ${ENV_DIR}..."
        TARGET_FILES=$(find "${ENV_DIR}" -name "${REPO_NAME}.yaml" -type f)

        if [ -n "$TARGET_FILES" ]; then
          for FILE in $TARGET_FILES; do
            echo "Actualizando imagen en: $FILE"
            sed -i "s/\(image:.*:\).*/\1${IMAGE_TAG:-${GITHUB_REF_NAME}_${GITHUB_RUN_NUMBER}}/g" "$FILE"
          done
        else
          echo "Error: No se encontró ningún archivo ${REPO_NAME}.yaml dentro de la carpeta ${ENV_DIR}"
          echo "Contenido de la carpeta ${ENV_DIR}:"
          ls -R "${ENV_DIR}" || echo "La carpeta ${ENV_DIR} no existe."
          exit 1
        fi

        RELEASE_DATE=$(TZ="America/Bogota" date "+%Y-%m-%d")
        RELEASE_FILE="${ENV_DIR}/Release-${RELEASE_DATE}.yml"
        CURRENT_DATE=$(TZ="America/Bogota" date "+%Y-%m-%d %H:%M:%S")

        echo "📊 Gestionando resumen diario: ${RELEASE_FILE}..."

        # 1. Si no existe el archivo de HOY, es el primer despliegue del día
        if [ ! -f "${RELEASE_FILE}" ]; then
          echo "🆕 Primer despliegue del día (${RELEASE_DATE}). Limpiando registros anteriores..."
          rm -f "${ENV_DIR}/Release-"*.yml || true
          printf 'last_update: "%s"\nenvironment: "%s"\nmicroservicios:\n' "${CURRENT_DATE}" "${ENV_DIR}" > "${RELEASE_FILE}"
        else
          # Si ya existe (mismo día), solo actualizamos la fecha de última modificación
          sed -i "1s|.*|last_update: \"${CURRENT_DATE}\"|" "${RELEASE_FILE}"
        fi

        # 2. Actualizar el microservicio o añadirlo si es nuevo dentro del reporte de hoy
        if grep -q "${REPO_NAME}:" "${RELEASE_FILE}"; then
          echo "Actualizando microservicio en el reporte diario..."
          sed -i "s|${REPO_NAME}:.*|${REPO_NAME}: \"${IMAGE_TAG:-${GITHUB_REF_NAME}_${GITHUB_RUN_NUMBER}}\"|" "${RELEASE_FILE}"
        else
          echo "Añadiendo nuevo microservicio al reporte diario..."
          printf '  %s: "%s"\n' "${REPO_NAME}" "${IMAGE_TAG:-${GITHUB_REF_NAME}_${GITHUB_RUN_NUMBER}}" >> "${RELEASE_FILE}"
        fi

        git add .
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore set image tag to ${REPO_NAME} ${IMAGE_TAG:-${GITHUB_REF_NAME}_${GITHUB_RUN_NUMBER}}" || echo "No changes to commit"
        git pull --rebase origin main
        git push origin main
        echo "📤 Exportando variables y archivos de release..."
        cp "${RELEASE_FILE}" "${GITHUB_WORKSPACE}/release_info.yml"
        echo "RELEASE_FILE=release_info.yml" > "${GITHUB_WORKSPACE}/release.env"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-info
        path: release_info.yml
        if-no-files-found: ignore
      if: always()
    env:
      INFRA_REPO_URL: ${{ inputs.INFRA_REPO_URL }}
      TARGET_FILE_PATH: ${{ inputs.TARGET_FILE_PATH }}
      REPO_NAME: ${{ github.event.repository.name }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
on:
  workflow_call:
    inputs:
      INFRA_REPO_URL:
        description: Repo de infraestructura en formato host:org/repo.git (se clona vía SSH como git@host:org/repo.git)
        required: true
        type: string
      TARGET_FILE_PATH:
        description: Directorio dentro del repo de infraestructura donde buscar <servicio>.yaml
        required: false
        type: string
        default: ''
      IMAGE_TAG:
        description: Tag de la imagen (vacío = <rama>_<run_number>)
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_KEY:
        description: Llave SSH privada con permiso de escritura en el repo de infraestructura
        required: true
