name: Infrastructure Infracost

# Estimación de costos (FinOps) de cambios Terraform, comentada en el Pull Request.

on:
  workflow_call:
    inputs:
      TF_ROOT:
        description: 'Directorio raíz de Terraform'
        required: false
        type: string
        default: '.'
    secrets:
      INFRACOST_API_KEY:
        description: 'API key de Infracost'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost_diff:
    name: Infracost diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      TF_ROOT: ${{ inputs.TF_ROOT }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - name: Checkout rama base (baseline)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr

      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Costos de la rama base
        run: infracost breakdown --path="base/${TF_ROOT}" --format=json --out-file=infracost-base.json

      - name: Diferencial de costos del PR
        run: |
          infracost diff --path="pr/${TF_ROOT}" --compare-to=infracost-base.json \
            --format=json --out-file=infracost-diff.json

      - name: Comentar en el Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          infracost comment github --path=infracost-diff.json \
            --repo="${GITHUB_REPOSITORY}" \
            --pull-request="${PR_NUMBER}" \
            --github-token="${GH_TOKEN}" \
            --behavior=update

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infracost-report
          path: infracost-*.json
          if-no-files-found: ignore
