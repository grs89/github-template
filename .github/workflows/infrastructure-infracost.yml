jobs:
  infracost_diff:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F4CA Iniciando an\xE1lisis de costos FinOps con Infracost...\"\
        \n\n# 1. Generar reporte del estado actual en el Merge Request\ninfracost\
        \ breakdown --path=$TF_ROOT \\\n                    --format=json \\\n   \
        \                 --out-file=infracost-current.json\n\n# 2. Clonar de manera\
