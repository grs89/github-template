        \ngit clone --depth=1 --branch=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME $CI_REPOSITORY_URL\
        \ /tmp/base-repo\n\n# 3. Generar reporte de costos de la rama base\ninfracost\
        \ breakdown --path=/tmp/base-repo/$TF_ROOT \\\n                    --format=json\
        \ \\\n                    --out-file=infracost-base.json\n\n# 4. Calcular\
        \ el diferencial (diff) de costos\necho \"\u2696\uFE0F Calculando diferencia\
        \ de costos...\"\ninfracost diff --path=infracost-current.json \\\n      \
        \         --compare-to=infracost-base.json \\\n               --format=json\
        \ \\\n               --out-file=infracost-diff.json\n\n# 5. Publicar el comentario\
        \ interactivo en el Merge Request de GitLab\nif [ -f infracost-diff.json ];\
        \ then\n  echo \"\U0001F4E4 Publicando reporte diferencial en el Merge Request...\"\
        \n  infracost comment gitlab --path=infracost-diff.json \\\n             \
        \              --repo=$CI_PROJECT_PATH \\\n                           --merge-request=$CI_MERGE_REQUEST_IID\
        \ \\\n                           --gitlab-server-url=$CI_SERVER_URL \\\n \
        \                          --gitlab-token=$GITLAB_TOKEN \\\n             \
        \              --behavior=update\nelse\n  echo \"\u26A0\uFE0F No se pudo generar\
        \ el reporte de Infracost diff.\"\nfi\n"
    container:
