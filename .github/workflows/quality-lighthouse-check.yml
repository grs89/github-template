name: Quality Lighthouse Check

on:
  workflow_call:
    inputs:
      LIGHTHOUSE_ENABLED:
        description: 'Habilitar la auditoría Lighthouse'
        required: false
        type: string
        default: 'true'
      LIGHTHOUSE_URL:
        description: 'URL a auditar'
        required: true
        type: string
      LIGHTHOUSE_EXTRA_ARGS:
        description: 'Argumentos extra para lighthouse'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lighthouse_audit:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    if: inputs.LIGHTHOUSE_ENABLED == 'true'
    steps:
      - name: Auditoría Lighthouse
        env:
          LIGHTHOUSE_URL: ${{ inputs.LIGHTHOUSE_URL }}
          LIGHTHOUSE_EXTRA_ARGS: ${{ inputs.LIGHTHOUSE_EXTRA_ARGS }}
        run: |
          mkdir -p reports
          # shellcheck disable=SC2086
          npx --yes lighthouse@12.2.1 "$LIGHTHOUSE_URL" \
            --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output=html --output-path=./reports/lighthouse-report \
            --only-categories=performance,accessibility,best-practices,seo \
            $LIGHTHOUSE_EXTRA_ARGS
          {
            echo "### 📊 Lighthouse – ${LIGHTHOUSE_URL}"
            echo "| Categoría | Score |"; echo "|---|---|"
            jq -r '.categories[] | "| \(.title) | \((.score // 0) * 100 | floor) |"' reports/lighthouse-report.report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: reports/
          if-no-files-found: ignore
