name: Sast Sonarcube Scan_Generic
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  sonarcube-scan_generic:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "if [ -z \"$SONAR_HOST_URL\" ] || [ -z \"$SONAR_TOKEN\" ]; then\n  echo\
        \ \"\u274C ERROR: Las variables SONAR_HOST_URL o SONAR_TOKEN no est\xE1n definidas.\"\
        \n  echo \"Ve a Settings > CI/CD > Variables y aseg\xFArate de configurarlas.\"\
        \n  exit 1\nfi\nif [[ ! \"$SONAR_HOST_URL\" =~ ^https?:// ]]; then\n  echo\
        \ \"\u274C ERROR: SONAR_HOST_URL debe comenzar con http:// o https://\"\n\
        \  echo \"Valor actual: $SONAR_HOST_URL\"\n  exit 1\nfi\n\necho \"--- DEBUG:\
        \ Verificando existencia de sonar-project.properties ---\"\ncat sonar-project.properties\
        \ 2>/dev/null || echo \"No existe sonar-project.properties\"\necho \"------------------------------------------------------------------\"\
        \n\n# Si existe sonar-project.properties y no se ha forzado su uso, lo omitimos\
        \ renombr\xE1ndolo.\nif [ -f \"sonar-project.properties\" ] && [ \"$SONAR_USE_PROJECT_PROPERTIES\"\
        \ != \"true\" ]; then\n  echo \"\u2139\uFE0F Omitiendo sonar-project.properties\
        \ para usar la configuraci\xF3n estandarizada del template.\"\n  mv sonar-project.properties\
        \ sonar-project.properties.bak\nfi\n\n# L\xF3gica de argumentos para Sonar\n\
        SONAR_ARGS=\"\"\n\n# 1. Configuraci\xF3n de fuentes (Sources)\n# Siempre usamos\
        \ . a menos que se defina SONAR_SOURCES\nSONAR_ARGS=\"$SONAR_ARGS -Dsonar.sources=${SONAR_SOURCES:-.}\"\
        \n\n# 2. Configuraci\xF3n de exclusiones (Exclusions)\nDEFAULT_EXCLUSIONS=\"\
        **/docker-compose.yml,**/jest.preset.js,**/nx.json,**/pnpm-workspace.yaml,**/pnpm-lock.yaml,**/package-lock.json,**/yarn.lock,**/tsconfig*.json,sonar-project.properties.bak,eslint.config.mjs\"\
        \nFINAL_EXCLUSIONS=\"${DEFAULT_EXCLUSIONS}${SONAR_EXCLUSIONS:+,}${SONAR_EXCLUSIONS}\"\
        \nSONAR_ARGS=\"$SONAR_ARGS -Dsonar.exclusions=$FINAL_EXCLUSIONS\"\necho \"\
        \u2139\uFE0F Aplicando configuraci\xF3n estandarizada por CLI.\"\n\n# 3. Manejo\
        \ de binarios para aplicaciones Java (Requerido por Sonar para .java)\nJAVA_BINARIES_ARG=\"\
        \"\n\necho \"\U0001F50D Detectando lenguaje del proyecto...\"\n# Usamos una\
        \ detecci\xF3n m\xE1s robusta: pom.xml, build.gradle o archivos .java\nIF_JAVA=\"\
        false\"\nif [ -f \"pom.xml\" ] || [ -f \"build.gradle\" ] || [ -d \"src/main/java\"\
        \ ]; then\n  IF_JAVA=\"true\"\nelif ls -R 2>/dev/null | grep -q \".java\"\
        ; then\n  IF_JAVA=\"true\"\nfi\n\nif [ \"$IF_JAVA\" = \"true\" ]; then\n \
        \ echo \"\u2615 Proyecto Java detectado.\"\n  \n  # Prioridad 1: Variable\
        \ expl\xEDcita del usuario\n  if [ -n \"$SONAR_JAVA_BINARIES\" ]; then\n \
        \   echo \"\U0001F527 Usando configuraci\xF3n manual: SONAR_JAVA_BINARIES=$SONAR_JAVA_BINARIES\"\
        \n    JAVA_BINARIES_ARG=\"-Dsonar.java.binaries=$SONAR_JAVA_BINARIES\"\n \
        \ else\n    # Prioridad 2: Auto-detecci\xF3n de rutas comunes\n    echo \"\
        \U0001F50D Buscando binarios...\"\n    if [ -d \"target/classes\" ]; then\n\
        \      JAVA_BINARIES_ARG=\"-Dsonar.java.binaries=target/classes\"\n    elif\
        \ [ -d \"build/classes/java/main\" ]; then\n      JAVA_BINARIES_ARG=\"-Dsonar.java.binaries=build/classes/java/main\"\
        \n    else\n      # Fallback seguro: punto (.) pero con advertencia clara\n\
        \      echo \"\u26A0\uFE0F ADVERTENCIA: No se encontraron carpetas de compilaci\xF3\
        n est\xE1ndar (Maven/Gradle).\"\n      echo \"\u2139\uFE0F Se intentar\xE1\
        \ usar '.' como fallback para evitar error cr\xEDtico de Sonar.\"\n      echo\
        \ \"\U0001F4A1 TIP: Si el an\xE1lisis falla, construye tu proyecto antes o\
        \ define SONAR_JAVA_BINARIES.\"\n      JAVA_BINARIES_ARG=\"-Dsonar.java.binaries=.\"\
        \n    fi\n  fi\n  echo \"\u2705 Configurado: $JAVA_BINARIES_ARG\"\nelse\n\
        \  echo \"\u2139\uFE0F No se detect\xF3 c\xF3digo Java. Omitiendo sonar.java.binaries.\"\
        \nfi\n\n# 4. Configuraci\xF3n de carpetas de tests (sonar.tests)\necho \"\U0001F9EA\
        \ Configurando carpetas de tests...\"\nSONAR_TESTS_ARG=\"\"\nif [ -n \"$SONAR_TESTS\"\
        \ ]; then\n  echo \"\U0001F527 Usando configuraci\xF3n manual: SONAR_TESTS=$SONAR_TESTS\"\
        \n  SONAR_TESTS_ARG=\"-Dsonar.tests=$SONAR_TESTS\"\nelif [ \"$IF_JAVA\" =\
        \ \"true\" ] && [ -d \"src/test\" ]; then\n  echo \"\u2705 Auto-detectado:\
        \ src/test (Java)\"\n  SONAR_TESTS_ARG=\"-Dsonar.tests=src/test\"\nelse\n\
        \  # Auto-detecci\xF3n para NestJS/JS/TS\n  TESTS_DIRS=\"\"\n  if [ -d \"\
        __tests__\" ]; then\n    TESTS_DIRS=\"__tests__\"\n  fi\n  if [ -d \"test\"\
        \ ]; then\n    TESTS_DIRS=\"${TESTS_DIRS:+$TESTS_DIRS,}test\"\n  fi\n  if\
        \ [ -n \"$TESTS_DIRS\" ]; then\n    echo \"\u2705 Auto-detectado: $TESTS_DIRS\
        \ (Node.js/NestJS)\"\n    SONAR_TESTS_ARG=\"-Dsonar.tests=$TESTS_DIRS\"\n\
        \  else\n    echo \"\u2139\uFE0F No se detectaron carpetas de tests est\xE1\
        ndar.\"\n  fi\nfi\n\n# Exclusiones de test inclusions para evitar duplicados\
        \ con sonar.sources\nif [ -n \"$SONAR_TEST_INCLUSIONS\" ]; then\n  SONAR_TESTS_ARG=\"\
        $SONAR_TESTS_ARG -Dsonar.test.inclusions=$SONAR_TEST_INCLUSIONS\"\nelif [\
        \ \"$IF_JAVA\" != \"true\" ] && [ -f \"package.json\" ]; then\n  SONAR_TESTS_ARG=\"\
        $SONAR_TESTS_ARG -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js\"\
        \nfi\n\n# 5. Configuraci\xF3n de reportes de coverage\necho \"\U0001F4CA Configurando\
        \ reportes de coverage...\"\nCOVERAGE_ARG=\"\"\n\n# Java - JaCoCo\nif [ \"\
        $IF_JAVA\" = \"true\" ]; then\n  if [ -n \"$SONAR_JACOCO_REPORT_PATHS\" ];\
        \ then\n    echo \"\U0001F527 Usando ruta manual de JaCoCo: $SONAR_JACOCO_REPORT_PATHS\"\
        \n    COVERAGE_ARG=\"-Dsonar.coverage.jacoco.xmlReportPaths=$SONAR_JACOCO_REPORT_PATHS\"\
        \n  elif [ -f \"target/site/jacoco/jacoco.xml\" ]; then\n    echo \"\u2705\
        \ Reporte JaCoCo detectado: target/site/jacoco/jacoco.xml\"\n    COVERAGE_ARG=\"\
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml\"\n \
        \ elif [ -f \"build/reports/jacoco/test/jacocoTestReport.xml\" ]; then\n \
        \   echo \"\u2705 Reporte JaCoCo detectado: build/reports/jacoco/test/jacocoTestReport.xml\"\
        \n    COVERAGE_ARG=\"-Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml\"\
        \n  else\n    echo \"\u26A0\uFE0F No se encontr\xF3 reporte JaCoCo. El coverage\
        \ no se reportar\xE1.\"\n    echo \"\U0001F4A1 TIP: Aseg\xFArate de que el\
        \ job run_tests_generic haya ejecutado correctamente.\"\n  fi\nfi\n\n# JS/TS\
        \ - LCOV\nif [ -n \"$SONAR_LCOV_REPORT_PATHS\" ]; then\n  echo \"\U0001F527\
        \ Usando ruta manual de LCOV: $SONAR_LCOV_REPORT_PATHS\"\n  COVERAGE_ARG=\"\
        $COVERAGE_ARG -Dsonar.javascript.lcov.reportPaths=$SONAR_LCOV_REPORT_PATHS\"\
        \nelif [ -f \"coverage/lcov.info\" ]; then\n  echo \"\u2705 Reporte LCOV detectado:\
        \ coverage/lcov.info\"\n  COVERAGE_ARG=\"$COVERAGE_ARG -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info\"\
        \nfi\n\n# 6. Exclusiones de coverage\nif [ -n \"$SONAR_COVERAGE_EXCLUSIONS\"\
        \ ]; then\n  echo \"\U0001F527 Exclusiones de coverage: $SONAR_COVERAGE_EXCLUSIONS\"\
        \n  COVERAGE_ARG=\"$COVERAGE_ARG -Dsonar.coverage.exclusions=$SONAR_COVERAGE_EXCLUSIONS\"\
        \nfi\n\necho \"\U0001F680 Iniciando SonarScanner...\"\nsonar-scanner \\\n\
        \  -Dsonar.projectKey=${SONAR_PROJECT_KEY:-$CI_PROJECT_NAME} \\\n  $SONAR_ARGS\
        \ \\\n  $JAVA_BINARIES_ARG \\\n  $SONAR_TESTS_ARG \\\n  $COVERAGE_ARG \\\n\
        \  -Dsonar.host.url=${SONAR_HOST_URL} \\\n  -Dsonar.token=${SONAR_TOKEN} \\\
        \n  -Dsonar.qualitygate.wait=true\n"
    container:
      image: sonarsource/sonar-scanner-cli:latest
    needs:
    - run_tests_generic
env:
  SONAR_USER_HOME: ${CI_PROJECT_DIR}/.sonar
  GIT_DEPTH: '0'
