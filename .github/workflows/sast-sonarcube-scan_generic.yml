name: Sast Sonarcube Scan_Generic
on:
  workflow_call:
    inputs:
      SONAR_HOST_URL:
        description: SONAR_HOST_URL
        required: true
        type: string
      SONAR_PROJECT_KEY:
        description: SONAR_PROJECT_KEY
        required: false
        type: string
        default: ''
      SONAR_SOURCES:
        description: SONAR_SOURCES
        required: false
        type: string
        default: ''
      SONAR_EXCLUSIONS:
        description: SONAR_EXCLUSIONS
        required: false
        type: string
        default: ''
      SONAR_TESTS:
        description: SONAR_TESTS
        required: false
        type: string
        default: ''
      SONAR_TEST_INCLUSIONS:
        description: SONAR_TEST_INCLUSIONS
        required: false
        type: string
        default: ''
      SONAR_JAVA_BINARIES:
        description: SONAR_JAVA_BINARIES
        required: false
        type: string
        default: ''
      SONAR_JACOCO_REPORT_PATHS:
        description: SONAR_JACOCO_REPORT_PATHS
        required: false
        type: string
        default: ''
      SONAR_LCOV_REPORT_PATHS:
        description: SONAR_LCOV_REPORT_PATHS
        required: false
        type: string
        default: ''
      SONAR_COVERAGE_EXCLUSIONS:
        description: SONAR_COVERAGE_EXCLUSIONS
        required: false
        type: string
        default: ''
      SONAR_USE_PROJECT_PROPERTIES:
        description: SONAR_USE_PROJECT_PROPERTIES
        required: false
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  sonarcube-scan_generic:
    name: sonarcube-scan generic
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Instalar SonarScanner CLI
      run: |
        curl -sSLo "$RUNNER_TEMP/sonar.zip" https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
        unzip -q "$RUNNER_TEMP/sonar.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/sonar-scanner-6.2.1.4610-linux-x64/bin" >> "$GITHUB_PATH"
    - name: sonarcube-scan generic
      run: |
        if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
          echo "❌ ERROR: Las variables SONAR_HOST_URL o SONAR_TOKEN no están definidas."
          echo "Ve a Settings > CI/CD > Variables y asegúrate de configurarlas."
          exit 1
        fi
        if [[ ! "$SONAR_HOST_URL" =~ ^https?:// ]]; then
          echo "❌ ERROR: SONAR_HOST_URL debe comenzar con http:// o https://"
          echo "Valor actual: $SONAR_HOST_URL"
          exit 1
        fi

        echo "--- DEBUG: Verificando existencia de sonar-project.properties ---"
        cat sonar-project.properties 2>/dev/null || echo "No existe sonar-project.properties"
        echo "------------------------------------------------------------------"

        # Si existe sonar-project.properties y no se ha forzado su uso, lo omitimos renombrándolo.
        if [ -f "sonar-project.properties" ] && [ "$SONAR_USE_PROJECT_PROPERTIES" != "true" ]; then
          echo "ℹ️ Omitiendo sonar-project.properties para usar la configuración estandarizada del template."
          mv sonar-project.properties sonar-project.properties.bak
        fi

        # Lógica de argumentos para Sonar
        SONAR_ARGS=""

        # 1. Configuración de fuentes (Sources)
        # Siempre usamos . a menos que se defina SONAR_SOURCES
        SONAR_ARGS="$SONAR_ARGS -Dsonar.sources=${SONAR_SOURCES:-.}"

        # 2. Configuración de exclusiones (Exclusions)
        DEFAULT_EXCLUSIONS="**/docker-compose.yml,**/jest.preset.js,**/nx.json,**/pnpm-workspace.yaml,**/pnpm-lock.yaml,**/package-lock.json,**/yarn.lock,**/tsconfig*.json,sonar-project.properties.bak,eslint.config.mjs"
        FINAL_EXCLUSIONS="${DEFAULT_EXCLUSIONS}${SONAR_EXCLUSIONS:+,}${SONAR_EXCLUSIONS}"
        SONAR_ARGS="$SONAR_ARGS -Dsonar.exclusions=$FINAL_EXCLUSIONS"
        echo "ℹ️ Aplicando configuración estandarizada por CLI."

        # 3. Manejo de binarios para aplicaciones Java (Requerido por Sonar para .java)
        JAVA_BINARIES_ARG=""

        echo "🔍 Detectando lenguaje del proyecto..."
        # Usamos una detección más robusta: pom.xml, build.gradle o archivos .java
        IF_JAVA="false"
        if [ -f "pom.xml" ] || [ -f "build.gradle" ] || [ -d "src/main/java" ]; then
          IF_JAVA="true"
        elif ls -R 2>/dev/null | grep -q ".java"; then
          IF_JAVA="true"
        fi

        if [ "$IF_JAVA" = "true" ]; then
          echo "☕ Proyecto Java detectado."

          # Prioridad 1: Variable explícita del usuario
          if [ -n "$SONAR_JAVA_BINARIES" ]; then
            echo "🔧 Usando configuración manual: SONAR_JAVA_BINARIES=$SONAR_JAVA_BINARIES"
            JAVA_BINARIES_ARG="-Dsonar.java.binaries=$SONAR_JAVA_BINARIES"
          else
            # Prioridad 2: Auto-detección de rutas comunes
            echo "🔍 Buscando binarios..."
            if [ -d "target/classes" ]; then
              JAVA_BINARIES_ARG="-Dsonar.java.binaries=target/classes"
            elif [ -d "build/classes/java/main" ]; then
              JAVA_BINARIES_ARG="-Dsonar.java.binaries=build/classes/java/main"
            else
              # Fallback seguro: punto (.) pero con advertencia clara
              echo "⚠️ ADVERTENCIA: No se encontraron carpetas de compilación estándar (Maven/Gradle)."
              echo "ℹ️ Se intentará usar '.' como fallback para evitar error crítico de Sonar."
              echo "💡 TIP: Si el análisis falla, construye tu proyecto antes o define SONAR_JAVA_BINARIES."
              JAVA_BINARIES_ARG="-Dsonar.java.binaries=."
            fi
          fi
          echo "✅ Configurado: $JAVA_BINARIES_ARG"
        else
          echo "ℹ️ No se detectó código Java. Omitiendo sonar.java.binaries."
        fi

        # 4. Configuración de carpetas de tests (sonar.tests)
        echo "🧪 Configurando carpetas de tests..."
        SONAR_TESTS_ARG=""
        if [ -n "$SONAR_TESTS" ]; then
          echo "🔧 Usando configuración manual: SONAR_TESTS=$SONAR_TESTS"
          SONAR_TESTS_ARG="-Dsonar.tests=$SONAR_TESTS"
        elif [ "$IF_JAVA" = "true" ] && [ -d "src/test" ]; then
          echo "✅ Auto-detectado: src/test (Java)"
          SONAR_TESTS_ARG="-Dsonar.tests=src/test"
        else
          # Auto-detección para NestJS/JS/TS
          TESTS_DIRS=""
          if [ -d "__tests__" ]; then
            TESTS_DIRS="__tests__"
          fi
          if [ -d "test" ]; then
            TESTS_DIRS="${TESTS_DIRS:+$TESTS_DIRS,}test"
          fi
          if [ -n "$TESTS_DIRS" ]; then
            echo "✅ Auto-detectado: $TESTS_DIRS (Node.js/NestJS)"
            SONAR_TESTS_ARG="-Dsonar.tests=$TESTS_DIRS"
          else
            echo "ℹ️ No se detectaron carpetas de tests estándar."
          fi
        fi

        # Exclusiones de test inclusions para evitar duplicados con sonar.sources
        if [ -n "$SONAR_TEST_INCLUSIONS" ]; then
          SONAR_TESTS_ARG="$SONAR_TESTS_ARG -Dsonar.test.inclusions=$SONAR_TEST_INCLUSIONS"
        elif [ "$IF_JAVA" != "true" ] && [ -f "package.json" ]; then
          SONAR_TESTS_ARG="$SONAR_TESTS_ARG -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js"
        fi

        # 5. Configuración de reportes de coverage
        echo "📊 Configurando reportes de coverage..."
        COVERAGE_ARG=""

        # Java - JaCoCo
        if [ "$IF_JAVA" = "true" ]; then
          if [ -n "$SONAR_JACOCO_REPORT_PATHS" ]; then
            echo "🔧 Usando ruta manual de JaCoCo: $SONAR_JACOCO_REPORT_PATHS"
            COVERAGE_ARG="-Dsonar.coverage.jacoco.xmlReportPaths=$SONAR_JACOCO_REPORT_PATHS"
          elif [ -f "target/site/jacoco/jacoco.xml" ]; then
            echo "✅ Reporte JaCoCo detectado: target/site/jacoco/jacoco.xml"
            COVERAGE_ARG="-Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml"
          elif [ -f "build/reports/jacoco/test/jacocoTestReport.xml" ]; then
            echo "✅ Reporte JaCoCo detectado: build/reports/jacoco/test/jacocoTestReport.xml"
            COVERAGE_ARG="-Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml"
          else
            echo "⚠️ No se encontró reporte JaCoCo. El coverage no se reportará."
            echo "💡 TIP: Asegúrate de que el job run_tests_generic haya ejecutado correctamente."
          fi
        fi

        # JS/TS - LCOV
        if [ -n "$SONAR_LCOV_REPORT_PATHS" ]; then
          echo "🔧 Usando ruta manual de LCOV: $SONAR_LCOV_REPORT_PATHS"
          COVERAGE_ARG="$COVERAGE_ARG -Dsonar.javascript.lcov.reportPaths=$SONAR_LCOV_REPORT_PATHS"
        elif [ -f "coverage/lcov.info" ]; then
          echo "✅ Reporte LCOV detectado: coverage/lcov.info"
          COVERAGE_ARG="$COVERAGE_ARG -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info"
        fi

        # 6. Exclusiones de coverage
        if [ -n "$SONAR_COVERAGE_EXCLUSIONS" ]; then
          echo "🔧 Exclusiones de coverage: $SONAR_COVERAGE_EXCLUSIONS"
          COVERAGE_ARG="$COVERAGE_ARG -Dsonar.coverage.exclusions=$SONAR_COVERAGE_EXCLUSIONS"
        fi

        echo "🚀 Iniciando SonarScanner..."
        sonar-scanner \
          -Dsonar.projectKey=${SONAR_PROJECT_KEY:-${REPO_NAME}} \
          $SONAR_ARGS \
          $JAVA_BINARIES_ARG \
          $SONAR_TESTS_ARG \
          $COVERAGE_ARG \
          -Dsonar.host.url=${SONAR_HOST_URL} \
          -Dsonar.token=${SONAR_TOKEN} \
          -Dsonar.qualitygate.wait=true
    env:
      SONAR_HOST_URL: ${{ inputs.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ inputs.SONAR_PROJECT_KEY }}
      SONAR_SOURCES: ${{ inputs.SONAR_SOURCES }}
      SONAR_EXCLUSIONS: ${{ inputs.SONAR_EXCLUSIONS }}
      SONAR_TESTS: ${{ inputs.SONAR_TESTS }}
      SONAR_TEST_INCLUSIONS: ${{ inputs.SONAR_TEST_INCLUSIONS }}
      SONAR_JAVA_BINARIES: ${{ inputs.SONAR_JAVA_BINARIES }}
      SONAR_JACOCO_REPORT_PATHS: ${{ inputs.SONAR_JACOCO_REPORT_PATHS }}
      SONAR_LCOV_REPORT_PATHS: ${{ inputs.SONAR_LCOV_REPORT_PATHS }}
      SONAR_COVERAGE_EXCLUSIONS: ${{ inputs.SONAR_COVERAGE_EXCLUSIONS }}
      SONAR_USE_PROJECT_PROPERTIES: ${{ inputs.SONAR_USE_PROJECT_PROPERTIES }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      REPO_NAME: ${{ github.event.repository.name }}
