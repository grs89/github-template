name: Infrastructure Terraform
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  tf_validate:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F4DD Formateando...\"\nterraform fmt -check -diff -recursive\
        \ || {\n  echo \"\u26A0\uFE0F Archivos sin formatear. Ejecuta 'terraform fmt'\
        \ localmente.\"\n}\n\necho \"\u2705 Validando configuraci\xF3n...\"\nterraform\
        \ validate\n\necho \"\U0001F4E5 Instalando tflint...\"\nif command -v tflint\
        \ >/dev/null 2>&1; then\n  echo \"tflint ya instalado.\"\nelse\n  apk add\
        \ --no-cache curl unzip 2>/dev/null || true\n  curl -sSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh\
        \ | bash 2>/dev/null || true\nfi\n\nif command -v tflint >/dev/null 2>&1;\
        \ then\n  echo \"\U0001F50D Ejecutando tflint...\"\n  tflint --init 2>/dev/null\
        \ || true\n  tflint || true\nfi\n"
  tf_plan:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F4CB Generando plan de ejecuci\xF3n...\"\nPLAN_ARGS=\"\"\n\
        if [ -n \"$TF_VAR_FILE\" ]; then\n  PLAN_ARGS=\"-var-file=${TF_VAR_FILE}\"\
        \nelif [ -f \"terraform.${{ github.ref_name }}.tfvars\" ]; then\n  PLAN_ARGS=\"\
        -var-file=terraform.${{ github.ref_name }}.tfvars\"\n  echo \"\U0001F4C4 Usando\
        \ vars por rama: terraform.${{ github.ref_name }}.tfvars\"\nfi\n\nterraform\
        \ plan \\\n  -out=tfplan \\\n  -input=false \\\n  ${PLAN_ARGS} \\\n  ${TF_EXTRA_ARGS}\n\
        \necho \"\"\necho \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \"\necho \"\U0001F4CA Resumen del plan:\"\nterraform show -no-color tfplan\
        \ | grep -E \"^(Plan:|  #|  \\+|  -|  ~)\" | head -30\necho \"\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\n"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tf_plan-artifacts
        path: ${TF_ROOT}/tfplan
    env:
      TF_VAR_FILE: ''
      TF_EXTRA_ARGS: ''
  tf_apply:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F680 Aplicando cambios de infraestructura...\"\nterraform\
        \ apply -input=false tfplan\n\necho \"\"\necho \"\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\"\necho \"\u2705 Infraestructura actualizada.\"\n\
        echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\nterraform\
        \ output -no-color 2>/dev/null || true\n"
    needs:
    - tf_plan
  tf_destroy:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\u26A0\uFE0F  DESTRUYENDO infraestructura...\"\necho \"  Ambiente:\
        \ ${{ github.ref_name }}\"\necho \"  Estado: ${TF_STATE_NAME}\"\n\nterraform\
        \ destroy -input=false -auto-approve\n\necho \"\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\"\necho \"\U0001F5D1\uFE0F Infraestructura destruida.\"\
        \necho \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\n"
  tf_drift_detect:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\"\necho \"\U0001F50D DETECTANDO DRIFT\
        \ EN TERRAFORM (C\xF3digo \u2194 Estado Real)\"\necho \"\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\"\n\nPLAN_ARGS=\"\"\nif [ -n \"$TF_VAR_FILE\" ]; then\n  PLAN_ARGS=\"\
        -var-file=${TF_VAR_FILE}\"\nelif [ -f \"terraform.${{ github.ref_name }}.tfvars\"\
        \ ]; then\n  PLAN_ARGS=\"-var-file=terraform.${{ github.ref_name }}.tfvars\"\
        \nfi\n\n# -detailed-exitcode:\n# Exits with 0 on success (no drift), 2 if\
        \ changes/drift are detected, and 1 on error.\nset +e\nterraform plan \\\n\
        \  -detailed-exitcode \\\n  -input=false \\\n  ${PLAN_ARGS} \\\n  ${TF_EXTRA_ARGS}\n\
        TF_EXIT_CODE=$?\nset -e\n\nif [ $TF_EXIT_CODE -eq 0 ]; then\n  echo \"\u2705\
        \ \xC9XITO: No se detect\xF3 ninguna desviaci\xF3n (Drift) en la infraestructura.\"\
        \n  exit 0\nelif [ $TF_EXIT_CODE -eq 2 ]; then\n  echo \"\U0001F6A8 ALERTA:\
        \ \xA1SE DETECT\xD3 DRIFT EN LA INFRAESTRUCTURA REAL!\"\n  echo \"Las configuraciones\
        \ reales difieren de las definidas en Git.\"\n  echo \"Por favor revise el\
        \ plan detallado arriba para ver las diferencias (Modificaciones/Eliminaciones).\"\
        \n  exit 2\nelse\n  echo \"\u274C ERROR: El comando terraform plan fall\xF3\
        \ con c\xF3digo de salida: $TF_EXIT_CODE\"\n  exit 1\nfi\n"
    env:
      TF_VAR_FILE: ''
      TF_EXTRA_ARGS: ''
env:
  TF_DISABLED: 'false'
  TF_IMAGE: hashicorp/terraform:latest
  TF_ROOT: .
  TF_STATE_NAME: default
