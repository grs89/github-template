name: Infrastructure Terraform

# validate -> plan -> apply (aprobación manual vía GitHub Environment) | destroy | drift detection.
# El estado debe vivir en un backend remoto (S3, GCS, azurerm, ...). Credenciales cloud: secret TF_CLOUD_ENV.

on:
  workflow_call:
    inputs:
      TF_DISABLED:
        description: 'Deshabilitar el pipeline de Terraform'
        required: false
        type: string
        default: 'false'
      TF_VERSION:
        description: 'Versión de Terraform'
        required: false
        type: string
        default: '1.9.8'
      TF_ROOT:
        description: 'Directorio raíz de Terraform'
        required: false
        type: string
        default: '.'
      TF_VAR_FILE:
        description: 'Archivo -var-file (vacío = terraform.<rama>.tfvars si existe)'
        required: false
        type: string
        default: ''
      TF_EXTRA_ARGS:
        description: 'Argumentos extra para plan/apply'
        required: false
        type: string
        default: ''
      TF_BACKEND_ARGS:
        description: 'Argumentos -backend-config para terraform init (ej. "-backend-config=bucket=mi-estado")'
        required: false
        type: string
        default: ''
      TF_WORKSPACE:
        description: 'Workspace de Terraform (vacío = nombre de la rama)'
        required: false
        type: string
        default: ''
      TF_LINT_FAIL:
        description: 'Fallar el job si tflint reporta hallazgos'
        required: false
        type: boolean
        default: false
      TF_APPLY:
        description: 'Habilitar apply en tags (v*)'
        required: false
        type: boolean
        default: true
      TF_DESTROY:
        description: 'Habilitar el job destroy (solo en tags, con aprobación del environment)'
        required: false
        type: boolean
        default: false
      TF_APPLY_ENVIRONMENT:
        description: 'GitHub Environment con required reviewers para apply/destroy'
        required: false
        type: string
        default: 'production'
    secrets:
      TF_CLOUD_ENV:
        description: 'Variables de entorno cloud, una por línea KEY=VALUE (ej. AWS_ACCESS_KEY_ID=...)'
        required: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  tf_validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.TF_ROOT }}
    if: inputs.TF_DISABLED != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt + validate
        run: |
          terraform fmt -check -diff -recursive || echo "::warning::Archivos sin formatear. Ejecuta 'terraform fmt' localmente."
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        env:
          LINT_FAIL: ${{ inputs.TF_LINT_FAIL }}
        run: |
          tflint --init
          if ! tflint; then
            [ "$LINT_FAIL" = "true" ] && exit 1
            echo "::warning::tflint reportó hallazgos"
          fi

  tf_plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.TF_ROOT }}
    if: inputs.TF_DISABLED != 'true'
    needs: tf_validate
    env:
      TF_VAR_FILE: ${{ inputs.TF_VAR_FILE }}
      TF_EXTRA_ARGS: ${{ inputs.TF_EXTRA_ARGS }}
      TF_BACKEND_ARGS: ${{ inputs.TF_BACKEND_ARGS }}
      TF_WORKSPACE_IN: ${{ inputs.TF_WORKSPACE }}
      TF_CLOUD_ENV: ${{ secrets.TF_CLOUD_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales cloud
        if: env.TF_CLOUD_ENV != ''
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::add-mask::${line#*=}"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$TF_CLOUD_ENV"

      - name: init + workspace + plan
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          terraform init -input=false $TF_BACKEND_ARGS
          WS="${TF_WORKSPACE_IN:-$GITHUB_REF_NAME}"
          terraform workspace select "$WS" 2>/dev/null || terraform workspace new "$WS"

          PLAN_ARGS=()
          if [ -n "$TF_VAR_FILE" ]; then PLAN_ARGS+=("-var-file=${TF_VAR_FILE}")
          elif [ -f "terraform.${GITHUB_REF_NAME}.tfvars" ]; then PLAN_ARGS+=("-var-file=terraform.${GITHUB_REF_NAME}.tfvars"); fi
          # shellcheck disable=SC2086
          terraform plan -out=tfplan -input=false "${PLAN_ARGS[@]}" $TF_EXTRA_ARGS
          {
            echo '### 📊 Terraform plan'
            echo '```'
            terraform show -no-color tfplan | grep -E '^(Plan:|  #|No changes)' | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ inputs.TF_ROOT }}/tfplan
          if-no-files-found: error
          retention-days: 7

  tf_apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.TF_ROOT }}
    needs: tf_plan
    if: inputs.TF_DISABLED != 'true' && inputs.TF_APPLY && startsWith(github.ref, 'refs/tags/')
    environment: ${{ inputs.TF_APPLY_ENVIRONMENT }}
    env:
      TF_BACKEND_ARGS: ${{ inputs.TF_BACKEND_ARGS }}
      TF_WORKSPACE_IN: ${{ inputs.TF_WORKSPACE }}
      TF_CLOUD_ENV: ${{ secrets.TF_CLOUD_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ inputs.TF_ROOT }}

      - name: Credenciales cloud
        if: env.TF_CLOUD_ENV != ''
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::add-mask::${line#*=}"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$TF_CLOUD_ENV"

      - name: apply
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          terraform init -input=false $TF_BACKEND_ARGS
          WS="${TF_WORKSPACE_IN:-$GITHUB_REF_NAME}"
          terraform workspace select "$WS"
          terraform apply -input=false tfplan
          terraform output -no-color || true

  tf_destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.TF_ROOT }}
    needs: tf_validate
    if: inputs.TF_DISABLED != 'true' && inputs.TF_DESTROY && startsWith(github.ref, 'refs/tags/')
    environment: ${{ inputs.TF_APPLY_ENVIRONMENT }}
    env:
      TF_VAR_FILE: ${{ inputs.TF_VAR_FILE }}
      TF_BACKEND_ARGS: ${{ inputs.TF_BACKEND_ARGS }}
      TF_WORKSPACE_IN: ${{ inputs.TF_WORKSPACE }}
      TF_CLOUD_ENV: ${{ secrets.TF_CLOUD_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales cloud
        if: env.TF_CLOUD_ENV != ''
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::add-mask::${line#*=}"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$TF_CLOUD_ENV"

      - name: destroy
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          terraform init -input=false $TF_BACKEND_ARGS
          WS="${TF_WORKSPACE_IN:-$GITHUB_REF_NAME}"
          terraform workspace select "$WS"
          ARGS=()
          [ -n "$TF_VAR_FILE" ] && ARGS+=("-var-file=${TF_VAR_FILE}")
          echo "⚠️  DESTRUYENDO infraestructura del workspace ${WS}"
          terraform destroy -input=false -auto-approve "${ARGS[@]}"

  tf_drift_detect:
    name: Terraform drift detection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.TF_ROOT }}
    if: inputs.TF_DISABLED != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    env:
      TF_VAR_FILE: ${{ inputs.TF_VAR_FILE }}
      TF_EXTRA_ARGS: ${{ inputs.TF_EXTRA_ARGS }}
      TF_BACKEND_ARGS: ${{ inputs.TF_BACKEND_ARGS }}
      TF_WORKSPACE_IN: ${{ inputs.TF_WORKSPACE }}
      TF_CLOUD_ENV: ${{ secrets.TF_CLOUD_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.TF_VERSION }}
          terraform_wrapper: false

      - name: Credenciales cloud
        if: env.TF_CLOUD_ENV != ''
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::add-mask::${line#*=}"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$TF_CLOUD_ENV"

      - name: plan -detailed-exitcode
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086
          terraform init -input=false $TF_BACKEND_ARGS || exit 1
          WS="${TF_WORKSPACE_IN:-$GITHUB_REF_NAME}"
          terraform workspace select "$WS" || exit 1
          PLAN_ARGS=()
          if [ -n "$TF_VAR_FILE" ]; then PLAN_ARGS+=("-var-file=${TF_VAR_FILE}")
          elif [ -f "terraform.${GITHUB_REF_NAME}.tfvars" ]; then PLAN_ARGS+=("-var-file=terraform.${GITHUB_REF_NAME}.tfvars"); fi
          # shellcheck disable=SC2086
          terraform plan -detailed-exitcode -input=false "${PLAN_ARGS[@]}" $TF_EXTRA_ARGS
          CODE=$?
          case $CODE in
            0) echo "✅ Sin drift." ;;
            2) echo "::error::🚨 Drift detectado: la infraestructura real difiere del código."; exit 2 ;;
            *) echo "::error::terraform plan falló (código $CODE)"; exit 1 ;;
          esac
