name: Security DefectDojo

# Sube a DefectDojo los reportes (SARIF, Trivy, Checkov, ZAP, Gitleaks) generados en la corrida.

on:
  workflow_call:
    inputs:
      DEFECTDOJO_URL:
        description: 'URL base de DefectDojo'
        required: true
        type: string
      DEFECTDOJO_PRODUCT:
        description: 'Producto (vacío = owner/repo)'
        required: false
        type: string
        default: ''
      DEFECTDOJO_ENGAGEMENT:
        description: 'Engagement (vacío = Pipeline #<run> - Branch: <rama>)'
        required: false
        type: string
        default: ''
      REPORTS_ARTIFACT_PATTERN:
        description: 'Patrón de artefactos con reportes a subir'
        required: false
        type: string
        default: '*report*'
      TEMPLATE_PROJECT:
        description: 'Repo de plantillas que contiene scripts/upload_defectdojo.py'
        required: false
        type: string
        default: 'grs89/github-template'
      TEMPLATE_REF:
        description: 'Rama o tag del repo de plantillas'
        required: false
        type: string
        default: 'main'
    secrets:
      DEFECTDOJO_TOKEN:
        description: 'API token de DefectDojo'
        required: true

permissions:
  contents: read

jobs:
  defectdojo_upload:
    name: Subir a DefectDojo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ inputs.REPORTS_ARTIFACT_PATTERN }}
          merge-multiple: true
          path: dd-reports

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Subir reportes
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_PROJECT: ${{ inputs.TEMPLATE_PROJECT }}
          TEMPLATE_REF: ${{ inputs.TEMPLATE_REF }}
          DEFECTDOJO_URL: ${{ inputs.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DEFECTDOJO_PRODUCT: ${{ inputs.DEFECTDOJO_PRODUCT || github.repository }}
          DEFECTDOJO_ENGAGEMENT: "${{ inputs.DEFECTDOJO_ENGAGEMENT || format('Pipeline #{0} - Branch: {1}', github.run_number, github.ref_name) }}"
        run: |
          if [ -f scripts/upload_defectdojo.py ]; then
            cp scripts/upload_defectdojo.py "$RUNNER_TEMP/upload_defectdojo.py"
          else
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_PROJECT}/contents/scripts/upload_defectdojo.py?ref=${TEMPLATE_REF}" > "$RUNNER_TEMP/upload_defectdojo.py" \
              || { echo "❌ No se pudo obtener upload_defectdojo.py"; exit 1; }
          fi
          pip install --quiet requests
          cd dd-reports 2>/dev/null || true
          python3 "$RUNNER_TEMP/upload_defectdojo.py"
