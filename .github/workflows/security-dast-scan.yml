        \ -w \"%{http_code}\" \"${DAST_TARGET_URL}${ENDPOINT}\" 2>/dev/null || echo\
        \ \"000\")\n        if [ \"$HTTP_CODE\" = \"200\" ]; then\n          DAST_API_SPEC=\"\
