name: Security DAST Scan

on:
  workflow_call:
    inputs:
      DAST_DISABLED:
        description: 'Deshabilitar el escaneo DAST'
        required: false
        type: string
        default: 'false'
      DAST_TARGET_URL:
        description: 'URL del ambiente a escanear (ej. https://staging.myapp.com)'
        required: true
        type: string
      DAST_SCAN_TYPE:
        description: 'baseline (pasivo), full (activo) o api'
        required: false
        type: string
        default: 'baseline'
      DAST_API_SPEC:
        description: 'URL del spec OpenAPI (solo scan api; si está vacío se autodetecta)'
        required: false
        type: string
        default: ''
      DAST_EXTRA_ARGS:
        description: 'Argumentos extra para el script de ZAP'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dast_baseline_scan:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    if: inputs.DAST_DISABLED != 'true'
    steps:
      - name: Ejecutar ZAP
        env:
          DAST_TARGET_URL: ${{ inputs.DAST_TARGET_URL }}
          DAST_SCAN_TYPE: ${{ inputs.DAST_SCAN_TYPE }}
          DAST_API_SPEC: ${{ inputs.DAST_API_SPEC }}
          DAST_EXTRA_ARGS: ${{ inputs.DAST_EXTRA_ARGS }}
        run: |
          mkdir -p dast-reports && chmod 777 dast-reports
          zap() { docker run --rm -v "$PWD/dast-reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable "$@"; }

          echo "🎯 Target: ${DAST_TARGET_URL} | 📋 Tipo: ${DAST_SCAN_TYPE}"
          # shellcheck disable=SC2086  # DAST_EXTRA_ARGS es una lista de flags intencionalmente separada por palabras
          case "$DAST_SCAN_TYPE" in
            baseline)
              zap zap-baseline.py -t "$DAST_TARGET_URL" -r zap-baseline-report.html -J zap-baseline-report.json -x zap-baseline-report.xml -I $DAST_EXTRA_ARGS || true ;;
            full)
              zap zap-full-scan.py -t "$DAST_TARGET_URL" -r zap-full-report.html -J zap-full-report.json -x zap-full-report.xml -I $DAST_EXTRA_ARGS || true ;;
            api)
              if [ -z "$DAST_API_SPEC" ]; then
                for EP in /openapi.json /swagger.json /api-docs /v3/api-docs; do
                  if [ "$(curl -s -o /dev/null -w '%{http_code}' "${DAST_TARGET_URL}${EP}")" = "200" ]; then
                    DAST_API_SPEC="${DAST_TARGET_URL}${EP}"; echo "✅ OpenAPI detectado: $DAST_API_SPEC"; break
                  fi
                done
              fi
              [ -n "$DAST_API_SPEC" ] || { echo "❌ Define DAST_API_SPEC con la URL del spec OpenAPI/Swagger."; exit 1; }
              zap zap-api-scan.py -t "$DAST_API_SPEC" -f openapi -r zap-api-report.html -J zap-api-report.json -x zap-api-report.xml -I $DAST_EXTRA_ARGS || true ;;
            *)
              echo "❌ Tipo de scan no soportado: ${DAST_SCAN_TYPE} (baseline, full, api)"; exit 1 ;;
          esac

          {
            echo "### 🛡️ DAST (${DAST_SCAN_TYPE}) – ${DAST_TARGET_URL}"
            echo "| Riesgo | Alertas |"; echo "|---|---|"
            for R in High Medium Low Informational; do
              N=$(cat dast-reports/*.json 2>/dev/null | grep -o "\"riskdesc\": *\"$R" | wc -l || true)
              echo "| $R | ${N:-0} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports
          path: dast-reports/
          if-no-files-found: ignore
