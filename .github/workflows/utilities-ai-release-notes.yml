name: Utilities AI Release Notes

# Genera RELEASE_NOTES.md categorizado con un agente LLM (Strands) al publicar un tag.

on:
  workflow_call:
    inputs:
      AI_PROVIDER:
        description: 'ollama, gemini, claude, openai, lm-studio'
        required: true
        type: string
      AI_MODEL:
        description: 'Modelo del proveedor'
        required: true
        type: string
      AI_API_URL:
        description: 'Endpoint (ollama / lm-studio)'
        required: false
        type: string
        default: ''
      AI_MAX_TURNS:
        description: 'Máximo de turnos del agente'
        required: false
        type: string
        default: '15'
      AI_MAX_TOKENS:
        description: 'Máximo de tokens por respuesta'
        required: false
        type: string
        default: '4096'
      TEMPLATE_PROJECT:
        description: 'Repo de plantillas con scripts/ai_release_notes.py'
        required: false
        type: string
        default: 'grs89/github-template'
      TEMPLATE_REF:
        description: 'Rama o tag del repo de plantillas'
        required: false
        type: string
        default: 'main'
    secrets:
      AI_TOKEN:
        description: 'API key del proveedor externo'
        required: false

permissions:
  contents: read

jobs:
  ai_release_notes:
    name: Release notes con IA
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar release notes
        env:
          AI_PROVIDER: ${{ inputs.AI_PROVIDER }}
          AI_MODEL: ${{ inputs.AI_MODEL }}
          AI_API_URL: ${{ inputs.AI_API_URL }}
          AI_MAX_TURNS: ${{ inputs.AI_MAX_TURNS }}
          AI_MAX_TOKENS: ${{ inputs.AI_MAX_TOKENS }}
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          PREVIOUS_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_PROJECT: ${{ inputs.TEMPLATE_PROJECT }}
          TEMPLATE_REF: ${{ inputs.TEMPLATE_REF }}
        run: |
          if [ -f scripts/ai_release_notes.py ]; then cp scripts/ai_release_notes.py "$RUNNER_TEMP/ai_release_notes.py"
          else
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_PROJECT}/contents/scripts/ai_release_notes.py?ref=${TEMPLATE_REF}" > "$RUNNER_TEMP/ai_release_notes.py" \
              || { echo "❌ No se pudo obtener ai_release_notes.py"; exit 1; }
          fi
          pip install --quiet --no-cache-dir "strands-agents[ollama,openai,gemini,anthropic]"
          python3 "$RUNNER_TEMP/ai_release_notes.py"
          echo "📋 Vista previa:"; head -n 25 RELEASE_NOTES.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: ignore
          retention-days: 30
