# Please review the generated actions for correctness.

name: Observability Smoke Tests
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  smoke_tests:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$SMOKE_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\uFE0F Smoke\
        \ tests deshabilitados. Omitiendo.\"\n  exit 0\nfi\n\napk add --no-cache curl\
        \ jq"
    - name: Run Script
      run: "if [ -z \"$SMOKE_ENDPOINTS\" ]; then\n  echo \"\u2139\uFE0F No se definieron\
        \ SMOKE_ENDPOINTS.\"\n  echo \"\U0001F4A1 Define como lista separada por comas:\"\
        \n  echo '   SMOKE_ENDPOINTS: \"https://api.example.com/health,https://api.example.com/status\"\
        '\n  echo \"\"\n  echo \"\U0001F4A1 Formato avanzado (endpoint|m\xE9todo|status\
        \ esperado):\"\n  echo '   SMOKE_ENDPOINTS: \"https://api.com/health|GET|200,https://api.com/users|POST|201\"\
        '\n  exit 0\nfi\n\necho \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\"\necho \"\U0001F9EA Smoke Tests Post-Deploy\"\necho \"  \u23F1\uFE0F\
        \ Timeout:    ${SMOKE_TIMEOUT}s\"\necho \"  \U0001F504 Reintentos: ${SMOKE_RETRIES}\"\
        \necho \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\necho\
        \ \"\"\n\nTOTAL=0\nPASSED=0\nFAILED=0\nRESULTS=\"\"\n\nIFS=','\nfor ENTRY\
        \ in $SMOKE_ENDPOINTS; do\n  ENTRY=$(echo \"$ENTRY\" | xargs)\n  TOTAL=$((TOTAL\
        \ + 1))\n\n  # Parsear formato: URL|METHOD|EXPECTED_STATUS\n  ENDPOINT=$(echo\
        \ \"$ENTRY\" | cut -d'|' -f1)\n  METHOD=$(echo \"$ENTRY\" | cut -d'|' -sf2)\n\
        \  EXPECTED=$(echo \"$ENTRY\" | cut -d'|' -sf3)\n\n  METHOD=${METHOD:-GET}\n\
        \  EXPECTED=${EXPECTED:-${SMOKE_EXPECTED_STATUS}}\n\n  # Reintentos\n  SUCCESS=\"\
        false\"\n  ATTEMPT=0\n  while [ \"$ATTEMPT\" -lt \"$SMOKE_RETRIES\" ]; do\n\
        \    ATTEMPT=$((ATTEMPT + 1))\n    HTTP_CODE=$(curl -s -o /dev/null -w \"\
        %{http_code}\" \\\n      --connect-timeout \"${SMOKE_TIMEOUT}\" \\\n     \
        \ -X \"${METHOD}\" \\\n      \"${ENDPOINT}\" 2>/dev/null || echo \"000\")\n\
        \    RESPONSE_TIME=$(curl -s -o /dev/null -w \"%{time_total}\" \\\n      --connect-timeout\
        \ \"${SMOKE_TIMEOUT}\" \\\n      -X \"${METHOD}\" \\\n      \"${ENDPOINT}\"\
        \ 2>/dev/null || echo \"0\")\n\n    if [ \"$HTTP_CODE\" = \"$EXPECTED\" ];\
        \ then\n      SUCCESS=\"true\"\n      break\n    fi\n\n    if [ \"$ATTEMPT\"\
        \ -lt \"$SMOKE_RETRIES\" ]; then\n      echo \"  \U0001F504 Reintento ${ATTEMPT}/${SMOKE_RETRIES}\
        \ para ${ENDPOINT}...\"\n      sleep \"${SMOKE_RETRY_DELAY}\"\n    fi\n  done\n\
        \n  if [ \"$SUCCESS\" = \"true\" ]; then\n    echo \"  \u2705 ${METHOD} ${ENDPOINT}\
        \ \u2192 HTTP ${HTTP_CODE} (${RESPONSE_TIME}s)\"\n    PASSED=$((PASSED + 1))\n\
        \    RESULTS=\"${RESULTS}\\n{\\\"endpoint\\\":\\\"${ENDPOINT}\\\",\\\"method\\\
        \":\\\"${METHOD}\\\",\\\"status\\\":${HTTP_CODE},\\\"expected\\\":${EXPECTED},\\\
        \"time\\\":${RESPONSE_TIME},\\\"result\\\":\\\"pass\\\"}\"\n  else\n    echo\
        \ \"  \u274C ${METHOD} ${ENDPOINT} \u2192 HTTP ${HTTP_CODE} (esperado: ${EXPECTED})\"\
        \n    FAILED=$((FAILED + 1))\n    RESULTS=\"${RESULTS}\\n{\\\"endpoint\\\"\
        :\\\"${ENDPOINT}\\\",\\\"method\\\":\\\"${METHOD}\\\",\\\"status\\\":${HTTP_CODE},\\\
        \"expected\\\":${EXPECTED},\\\"time\\\":0,\\\"result\\\":\\\"fail\\\"}\"\n\
        \  fi\ndone\nunset IFS\n\necho \"\"\necho \"\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\"\necho \"\U0001F4CA Resultados Smoke Tests\"\necho\
        \ \"  \u2705 Exitosos: ${PASSED}/${TOTAL}\"\necho \"  \u274C Fallidos: ${FAILED}/${TOTAL}\"\
        \n\nif [ \"$TOTAL\" -gt 0 ]; then\n  PCT=$((PASSED * 100 / TOTAL))\n  echo\
        \ \"  \U0001F4C8 Tasa:     ${PCT}%\"\nfi\necho \"\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\"\n\n# Generar reporte JSON\nprintf \"[${RESULTS}]\"\
        \ | sed 's/\\[\\\\n/[/' | sed 's/\\\\n/,/g' > smoke-test-report.json\n\nif\
        \ [ \"$FAILED\" -gt 0 ] && [ \"$SMOKE_FAIL_ON_ERROR\" = \"true\" ]; then\n\
        \  echo \"\u274C FALLO: ${FAILED} smoke tests fallidos.\"\n  exit 1\nfi\n"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: smoke_tests-artifacts
        path: smoke-test-report.json
    container:
      image: ${SMOKE_IMAGE}
    env:
      SMOKE_ENDPOINTS: ''
      SMOKE_TIMEOUT: '10'
      SMOKE_RETRIES: '3'
      SMOKE_RETRY_DELAY: '5'
      SMOKE_EXPECTED_STATUS: '200'
      SMOKE_FAIL_ON_ERROR: 'false'
env:
  SMOKE_DISABLED: 'false'
  SMOKE_IMAGE: alpine:latest
