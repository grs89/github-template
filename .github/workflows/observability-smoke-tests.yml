name: Observability Smoke Tests
on:
  workflow_call:
    inputs:
      SMOKE_DISABLED:
        description: SMOKE_DISABLED
        required: false
        type: string
        default: 'false'
      SMOKE_ENDPOINTS:
        description: SMOKE_ENDPOINTS
        required: false
        type: string
        default: ''
      SMOKE_TIMEOUT:
        description: SMOKE_TIMEOUT
        required: false
        type: string
        default: '10'
      SMOKE_RETRIES:
        description: SMOKE_RETRIES
        required: false
        type: string
        default: '3'
      SMOKE_RETRY_DELAY:
        description: SMOKE_RETRY_DELAY
        required: false
        type: string
        default: '5'
      SMOKE_EXPECTED_STATUS:
        description: SMOKE_EXPECTED_STATUS
        required: false
        type: string
        default: '200'
      SMOKE_FAIL_ON_ERROR:
        description: SMOKE_FAIL_ON_ERROR
        required: false
        type: string
        default: 'false'
permissions:
  contents: read
jobs:
  smoke_tests:
    name: smoke tests
    runs-on: ubuntu-latest
    if: inputs.SMOKE_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - name: smoke tests
      run: |
        if [ "$SMOKE_DISABLED" = "true" ]; then
          echo "⏭️ Smoke tests deshabilitados. Omitiendo."
          exit 0
        fi

        if [ -z "$SMOKE_ENDPOINTS" ]; then
          echo "ℹ️ No se definieron SMOKE_ENDPOINTS."
          echo "💡 Define como lista separada por comas:"
          echo '   SMOKE_ENDPOINTS: "https://api.example.com/health,https://api.example.com/status"'
          echo ""
          echo "💡 Formato avanzado (endpoint|método|status esperado):"
          echo '   SMOKE_ENDPOINTS: "https://api.com/health|GET|200,https://api.com/users|POST|201"'
          exit 0
        fi

        echo "═══════════════════════════════════"
        echo "🧪 Smoke Tests Post-Deploy"
        echo "  ⏱️ Timeout:    ${SMOKE_TIMEOUT}s"
        echo "  🔄 Reintentos: ${SMOKE_RETRIES}"
        echo "═══════════════════════════════════"
        echo ""

        TOTAL=0
        PASSED=0
        FAILED=0
        RESULTS=""

        IFS=','
        for ENTRY in $SMOKE_ENDPOINTS; do
          ENTRY=$(echo "$ENTRY" | xargs)
          TOTAL=$((TOTAL + 1))

          # Parsear formato: URL|METHOD|EXPECTED_STATUS
          ENDPOINT=$(echo "$ENTRY" | cut -d'|' -f1)
          METHOD=$(echo "$ENTRY" | cut -d'|' -sf2)
          EXPECTED=$(echo "$ENTRY" | cut -d'|' -sf3)

          METHOD=${METHOD:-GET}
          EXPECTED=${EXPECTED:-${SMOKE_EXPECTED_STATUS}}

          # Reintentos
          SUCCESS="false"
          ATTEMPT=0
          while [ "$ATTEMPT" -lt "$SMOKE_RETRIES" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout "${SMOKE_TIMEOUT}" \
              -X "${METHOD}" \
              "${ENDPOINT}" 2>/dev/null || echo "000")
            RESPONSE_TIME=$(curl -s -o /dev/null -w "%{time_total}" \
              --connect-timeout "${SMOKE_TIMEOUT}" \
              -X "${METHOD}" \
              "${ENDPOINT}" 2>/dev/null || echo "0")

            if [ "$HTTP_CODE" = "$EXPECTED" ]; then
              SUCCESS="true"
              break
            fi

            if [ "$ATTEMPT" -lt "$SMOKE_RETRIES" ]; then
              echo "  🔄 Reintento ${ATTEMPT}/${SMOKE_RETRIES} para ${ENDPOINT}..."
              sleep "${SMOKE_RETRY_DELAY}"
            fi
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "  ✅ ${METHOD} ${ENDPOINT} → HTTP ${HTTP_CODE} (${RESPONSE_TIME}s)"
            PASSED=$((PASSED + 1))
            RESULTS="${RESULTS}\n{\"endpoint\":\"${ENDPOINT}\",\"method\":\"${METHOD}\",\"status\":${HTTP_CODE},\"expected\":${EXPECTED},\"time\":${RESPONSE_TIME},\"result\":\"pass\"}"
          else
            echo "  ❌ ${METHOD} ${ENDPOINT} → HTTP ${HTTP_CODE} (esperado: ${EXPECTED})"
            FAILED=$((FAILED + 1))
            RESULTS="${RESULTS}\n{\"endpoint\":\"${ENDPOINT}\",\"method\":\"${METHOD}\",\"status\":${HTTP_CODE},\"expected\":${EXPECTED},\"time\":0,\"result\":\"fail\"}"
          fi
        done
        unset IFS

        echo ""
        echo "═══════════════════════════════════"
        echo "📊 Resultados Smoke Tests"
        echo "  ✅ Exitosos: ${PASSED}/${TOTAL}"
        echo "  ❌ Fallidos: ${FAILED}/${TOTAL}"

        if [ "$TOTAL" -gt 0 ]; then
          PCT=$((PASSED * 100 / TOTAL))
          echo "  📈 Tasa:     ${PCT}%"
        fi
        echo "═══════════════════════════════════"

        # Generar reporte JSON
        printf "[${RESULTS}]" | sed 's/\[\\n/[/' | sed 's/\\n/,/g' > smoke-test-report.json

        if [ "$FAILED" -gt 0 ] && [ "$SMOKE_FAIL_ON_ERROR" = "true" ]; then
          echo "❌ FALLO: ${FAILED} smoke tests fallidos."
          exit 1
        fi
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: smoke_tests-artifacts
        path: smoke-test-report.json
        if-no-files-found: ignore
      if: always()
    env:
      SMOKE_DISABLED: ${{ inputs.SMOKE_DISABLED }}
      SMOKE_ENDPOINTS: ${{ inputs.SMOKE_ENDPOINTS }}
      SMOKE_TIMEOUT: ${{ inputs.SMOKE_TIMEOUT }}
      SMOKE_RETRIES: ${{ inputs.SMOKE_RETRIES }}
      SMOKE_RETRY_DELAY: ${{ inputs.SMOKE_RETRY_DELAY }}
      SMOKE_EXPECTED_STATUS: ${{ inputs.SMOKE_EXPECTED_STATUS }}
      SMOKE_FAIL_ON_ERROR: ${{ inputs.SMOKE_FAIL_ON_ERROR }}
