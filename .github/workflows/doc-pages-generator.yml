name: Doc Pages Generator

# Compila el wiki/README a un sitio estático (public/) y lo publica en GitHub Pages.
# Requiere: Settings > Pages > Source = "GitHub Actions".

on:
  workflow_call:
    inputs:
      PAGES_ENABLED:
        description: 'Publicar en GitHub Pages'
        required: false
        type: string
        default: 'true'
      TEMPLATE_PROJECT:
        description: 'Repositorio de plantillas que contiene scripts/generate_docs.py'
        required: false
        type: string
        default: 'grs89/github-template'
      TEMPLATE_REF:
        description: 'Rama o tag del repositorio de plantillas'
        required: false
        type: string
        default: 'main'
      DEPLOY:
        description: 'Desplegar a Pages (false = solo compilar y subir artefacto)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar documentación
    runs-on: ubuntu-latest
    if: inputs.PAGES_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Obtener compilador de documentación
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_PROJECT: ${{ inputs.TEMPLATE_PROJECT }}
          TEMPLATE_REF: ${{ inputs.TEMPLATE_REF }}
        run: |
          if [ -f scripts/generate_docs.py ]; then
            echo "✅ Compilador local detectado."
            cp scripts/generate_docs.py compiler.py
          else
            echo "📥 Descargando scripts/generate_docs.py de ${TEMPLATE_PROJECT}@${TEMPLATE_REF}"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_PROJECT}/contents/scripts/generate_docs.py?ref=${TEMPLATE_REF}" > compiler.py \
              || { echo "❌ No se pudo obtener generate_docs.py (¿repositorio de plantillas privado? usa un PAT)."; exit 1; }
          fi
          [ -s compiler.py ] || { echo "❌ generate_docs.py vacío."; exit 1; }

      - name: Compilar sitio (public/)
        env:
          CI_PROJECT_NAME: ${{ github.event.repository.name }}
          CI_PROJECT_URL: ${{ github.event.repository.html_url }}
        run: |
          python3 compiler.py
          rm -f compiler.py
          test -f public/index.html

      - uses: actions/configure-pages@v5
        if: inputs.DEPLOY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    if: inputs.DEPLOY
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
