name: Observability Grafana Annotations
permissions:
  contents: read
jobs:
  grafana_annotation:
    name: grafana annotation
    runs-on: ubuntu-latest
    if: inputs.GRAFANA_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - name: grafana annotation
      run: |
        if [ "$GRAFANA_DISABLED" = "true" ]; then
          echo "⏭️ Grafana annotations deshabilitadas. Omitiendo."
          exit 0
        fi

        if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_API_KEY" ]; then
          echo "❌ ERROR: GRAFANA_URL y GRAFANA_API_KEY son requeridas."
          echo "💡 Configura las variables en Settings > CI/CD > Variables."
          exit 1
        fi

        echo "═══════════════════════════════════"
        echo "📊 Creando anotación en Grafana"
        echo "  🎯 Grafana:  ${GRAFANA_URL}"
        echo "  📦 Servicio: ${REPO_NAME}"
        echo "  📌 Rama:     ${GITHUB_REF_NAME}"
        echo "═══════════════════════════════════"

        # Determinar ambiente
        case "${GITHUB_REF_NAME}" in
          "main") ENV="PROD" ;;
          "dev")  ENV="DEV" ;;
          "qa")   ENV="STAGE" ;;
          "pt")   ENV="PT" ;;
          *)      ENV="${GITHUB_REF_NAME}" ;;
        esac

        # Construir texto de la anotación
        if [ -n "$GRAFANA_TEXT" ]; then
          ANNOTATION_TEXT="$GRAFANA_TEXT"
        else
          ANNOTATION_TEXT="<b>🚀 Deploy: ${REPO_NAME}</b><br>"
          ANNOTATION_TEXT="${ANNOTATION_TEXT}Ambiente: ${ENV}<br>"
          ANNOTATION_TEXT="${ANNOTATION_TEXT}Imagen: ${IMAGE_TAG:-latest}<br>"
          ANNOTATION_TEXT="${ANNOTATION_TEXT}Commit: ${GITHUB_SHA:0:7}<br>"
          ANNOTATION_TEXT="${ANNOTATION_TEXT}Autor: ${GITHUB_ACTOR}<br>"
          ANNOTATION_TEXT="${ANNOTATION_TEXT}<a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">Ver Pipeline #${GITHUB_RUN_ID}</a>"
        fi

        # Construir tags
        TAGS_JSON=$(echo "${GRAFANA_TAGS},${REPO_NAME},${ENV}" | tr ',' '\n' | jq -R . | jq -s .)

        # Timestamp en milisegundos
        TIMESTAMP=$(($(date +%s) * 1000))

        # Crear payload
        PAYLOAD=$(jq -n \
          --arg text "$ANNOTATION_TEXT" \
          --argjson tags "$TAGS_JSON" \
          --argjson time "$TIMESTAMP" \
          '{
            time: $time,
            tags: $tags,
            text: $text
          }')

        # Si hay dashboard ID, añadirlo
        if [ -n "$GRAFANA_DASHBOARD_ID" ]; then
          PAYLOAD=$(echo "$PAYLOAD" | jq --argjson did "$GRAFANA_DASHBOARD_ID" '. + {dashboardId: $did}')
        fi

        echo "📤 Enviando anotación..."
        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GRAFANA_API_KEY}" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}" \
          "${GRAFANA_URL}/api/annotations")

        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | head -n -1)

        if [ "$HTTP_CODE" = "200" ]; then
          ANNOTATION_ID=$(echo "$BODY" | jq -r '.id // "N/A"')
          echo "✅ Anotación creada exitosamente (ID: ${ANNOTATION_ID})"
        else
          echo "⚠️ Error al crear anotación (HTTP ${HTTP_CODE})"
          echo "  Respuesta: ${BODY}"
        fi
    env:
      GRAFANA_DISABLED: ${{ inputs.GRAFANA_DISABLED }}
      GRAFANA_URL: ${{ inputs.GRAFANA_URL }}
      GRAFANA_DASHBOARD_ID: ${{ inputs.GRAFANA_DASHBOARD_ID }}
      GRAFANA_TAGS: ${{ inputs.GRAFANA_TAGS }}
      GRAFANA_TEXT: ${{ inputs.GRAFANA_TEXT }}
      GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
      REPO_NAME: ${{ github.event.repository.name }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
on:
  workflow_call:
    inputs:
      GRAFANA_DISABLED:
        description: GRAFANA_DISABLED
        required: false
        type: string
        default: 'false'
      GRAFANA_URL:
        description: GRAFANA_URL
        required: false
        type: string
        default: ''
      GRAFANA_DASHBOARD_ID:
        description: GRAFANA_DASHBOARD_ID
        required: false
        type: string
        default: ''
      GRAFANA_TAGS:
        description: GRAFANA_TAGS
        required: false
        type: string
        default: deploy,ci
      GRAFANA_TEXT:
        description: GRAFANA_TEXT
        required: false
        type: string
        default: ''
      IMAGE_TAG:
        description: Tag de la imagen desplegada (informativo)
        required: false
        type: string
        default: ''
    secrets:
      GRAFANA_API_KEY:
        required: false
