# Automatically generated by migrate_gitlab_to_github.py
# Please review the generated actions for correctness.

name: Observability Grafana Annotations
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  grafana_annotation:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$GRAFANA_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\uFE0F Grafana\
        \ annotations deshabilitadas. Omitiendo.\"\n  exit 0\nfi\n\nif [ -z \"$GRAFANA_URL\"\
        \ ] || [ -z \"$GRAFANA_API_KEY\" ]; then\n  echo \"\u274C ERROR: GRAFANA_URL\
        \ y GRAFANA_API_KEY son requeridas.\"\n  echo \"\U0001F4A1 Configura las variables\
        \ en Settings > CI/CD > Variables.\"\n  exit 1\nfi\n\napk add --no-cache curl\
        \ jq"
    - name: Run Script
      run: "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\necho\
        \ \"\U0001F4CA Creando anotaci\xF3n en Grafana\"\necho \"  \U0001F3AF Grafana:\
        \  ${GRAFANA_URL}\"\necho \"  \U0001F4E6 Servicio: ${CI_PROJECT_NAME}\"\n\
        echo \"  \U0001F4CC Rama:     ${{ github.ref_name }}\"\necho \"\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\n\n# Determinar ambiente\ncase\
        \ \"${{ github.ref_name }}\" in\n  \"main\") ENV=\"PROD\" ;;\n  \"dev\") \
        \ ENV=\"DEV\" ;;\n  \"qa\")   ENV=\"STAGE\" ;;\n  \"pt\")   ENV=\"PT\" ;;\n\
        \  *)      ENV=\"${{ github.ref_name }}\" ;;\nesac\n\n# Construir texto de\
        \ la anotaci\xF3n\nif [ -n \"$GRAFANA_TEXT\" ]; then\n  ANNOTATION_TEXT=\"\
        $GRAFANA_TEXT\"\nelse\n  ANNOTATION_TEXT=\"<b>\U0001F680 Deploy: ${CI_PROJECT_NAME}</b><br>\"\
        \n  ANNOTATION_TEXT=\"${ANNOTATION_TEXT}Ambiente: ${ENV}<br>\"\n  ANNOTATION_TEXT=\"\
        ${ANNOTATION_TEXT}Imagen: ${IMAGE_TAG:-latest}<br>\"\n  ANNOTATION_TEXT=\"\
        ${ANNOTATION_TEXT}Commit: ${CI_COMMIT_SHORT_SHA}<br>\"\n  ANNOTATION_TEXT=\"\
        ${ANNOTATION_TEXT}Autor: ${CI_COMMIT_AUTHOR}<br>\"\n  ANNOTATION_TEXT=\"${ANNOTATION_TEXT}<a\
        \ href=\\\"${CI_PIPELINE_URL}\\\">Ver Pipeline #${CI_PIPELINE_ID}</a>\"\n\
        fi\n\n# Construir tags\nTAGS_JSON=$(echo \"${GRAFANA_TAGS},${CI_PROJECT_NAME},${ENV}\"\
        \ | tr ',' '\\n' | jq -R . | jq -s .)\n\n# Timestamp en milisegundos\nTIMESTAMP=$(($(date\
        \ +%s) * 1000))\n\n# Crear payload\nPAYLOAD=$(jq -n \\\n  --arg text \"$ANNOTATION_TEXT\"\
        \ \\\n  --argjson tags \"$TAGS_JSON\" \\\n  --argjson time \"$TIMESTAMP\"\
        \ \\\n  '{\n    time: $time,\n    tags: $tags,\n    text: $text\n  }')\n\n\
        # Si hay dashboard ID, a\xF1adirlo\nif [ -n \"$GRAFANA_DASHBOARD_ID\" ]; then\n\
        \  PAYLOAD=$(echo \"$PAYLOAD\" | jq --argjson did \"$GRAFANA_DASHBOARD_ID\"\
        \ '. + {dashboardId: $did}')\nfi\n\necho \"\U0001F4E4 Enviando anotaci\xF3\
        n...\"\nRESPONSE=$(curl -s -w \"\\n%{http_code}\" \\\n  -X POST \\\n  -H \"\
        Authorization: Bearer ${GRAFANA_API_KEY}\" \\\n  -H \"Content-Type: application/json\"\
        \ \\\n  -d \"${PAYLOAD}\" \\\n  \"${GRAFANA_URL}/api/annotations\")\n\nHTTP_CODE=$(echo\
        \ \"$RESPONSE\" | tail -1)\nBODY=$(echo \"$RESPONSE\" | head -n -1)\n\nif\
        \ [ \"$HTTP_CODE\" = \"200\" ]; then\n  ANNOTATION_ID=$(echo \"$BODY\" | jq\
        \ -r '.id // \"N/A\"')\n  echo \"\u2705 Anotaci\xF3n creada exitosamente (ID:\
        \ ${ANNOTATION_ID})\"\nelse\n  echo \"\u26A0\uFE0F Error al crear anotaci\xF3\
        n (HTTP ${HTTP_CODE})\"\n  echo \"  Respuesta: ${BODY}\"\nfi\n"
    container:
      image: alpine:latest
    env:
      GRAFANA_URL: ''
      GRAFANA_API_KEY: ''
      GRAFANA_DASHBOARD_ID: ''
      GRAFANA_TAGS: deploy,ci
      GRAFANA_TEXT: ''
env:
  GRAFANA_DISABLED: 'false'
