name: Git External Mirror

# Replica este repositorio (ramas y tags) hacia un Git externo (GitLab, Bitbucket, Gitea, ...).

on:
  workflow_call:
    inputs:
      EXTERNAL_REPO_URL:
        description: 'URL del repo destino sin credenciales (https://gitlab.com/grupo/repo.git o git@gitlab.com:grupo/repo.git)'
        required: true
        type: string
      EXTERNAL_GIT_USER:
        description: 'Usuario para HTTPS con token (oauth2 en GitLab, x-token-auth en Bitbucket)'
        required: false
        type: string
        default: 'oauth2'
      SYNC_ALL_BRANCHES:
        description: 'Sincronizar todas las ramas (false = solo la rama actual)'
        required: false
        type: boolean
        default: true
      SYNC_ALL_TAGS:
        description: 'Sincronizar todos los tags'
        required: false
        type: boolean
        default: true
    secrets:
      EXTERNAL_GIT_TOKEN:
        description: 'Token de acceso con permiso de escritura (para URLs https)'
        required: false
      EXTERNAL_GIT_SSH_KEY:
        description: 'Llave SSH privada con permiso de escritura (para URLs git@)'
        required: false

permissions:
  contents: read

jobs:
  sync_to_external:
    name: Mirror a Git externo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar
        env:
          EXTERNAL_REPO_URL: ${{ inputs.EXTERNAL_REPO_URL }}
          EXTERNAL_GIT_USER: ${{ inputs.EXTERNAL_GIT_USER }}
          SYNC_ALL_BRANCHES: ${{ inputs.SYNC_ALL_BRANCHES }}
          SYNC_ALL_TAGS: ${{ inputs.SYNC_ALL_TAGS }}
          EXTERNAL_GIT_TOKEN: ${{ secrets.EXTERNAL_GIT_TOKEN }}
          EXTERNAL_GIT_SSH_KEY: ${{ secrets.EXTERNAL_GIT_SSH_KEY }}
        run: |
          set -euo pipefail
          GIT=(git)
          case "$EXTERNAL_REPO_URL" in
            *@*:*|ssh://*)
              [ -n "$EXTERNAL_GIT_SSH_KEY" ] || { echo "❌ URL SSH requiere el secret EXTERNAL_GIT_SSH_KEY"; exit 1; }
              install -m 700 -d ~/.ssh
              (umask 077; printf '%s\n' "$EXTERNAL_GIT_SSH_KEY" > ~/.ssh/mirror_key)
              HOST=$(echo "$EXTERNAL_REPO_URL" | sed -E 's#^(ssh://)?([^@]+@)?([^:/]+).*#\3#')
              ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
              export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/mirror_key -o IdentitiesOnly=yes"
              ;;
            https://*)
              [ -n "$EXTERNAL_GIT_TOKEN" ] || { echo "❌ URL HTTPS requiere el secret EXTERNAL_GIT_TOKEN"; exit 1; }
              AUTH=$(printf '%s:%s' "$EXTERNAL_GIT_USER" "$EXTERNAL_GIT_TOKEN" | base64 -w0)
              echo "::add-mask::$AUTH"
              GIT=(git -c "http.extraHeader=Authorization: Basic ${AUTH}")
              ;;
            *) echo "❌ EXTERNAL_REPO_URL debe ser https:// o SSH"; exit 1 ;;
          esac

          "${GIT[@]}" ls-remote "$EXTERNAL_REPO_URL" > /dev/null || { echo "❌ Sin acceso al repo externo (revisa URL y permisos de escritura)"; exit 1; }

          if [ "$SYNC_ALL_BRANCHES" = "true" ]; then
            echo "Sincronizando todas las ramas..."
            "${GIT[@]}" push --force "$EXTERNAL_REPO_URL" 'refs/remotes/origin/*:refs/heads/*' ':refs/heads/HEAD' 2>/dev/null \
              || "${GIT[@]}" push --force "$EXTERNAL_REPO_URL" 'refs/remotes/origin/*:refs/heads/*'
          else
            echo "Sincronizando rama ${GITHUB_REF_NAME}..."
            "${GIT[@]}" push --force "$EXTERNAL_REPO_URL" "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

          if [ "$SYNC_ALL_TAGS" = "true" ]; then
            echo "Sincronizando tags..."
            "${GIT[@]}" push --force "$EXTERNAL_REPO_URL" --tags
          fi
          echo "✅ Mirror completado."
