# Automatically generated by migrate_gitlab_to_github.py
# Please review the generated actions for correctness.

name: Git External Git
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  sync_to_github:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "apk add --no-cache git openssh-client\ngit config --global user.email\
        \ ${GITLAB_USER}\ngit config --global user.name ${GITLAB_USER_NAME}\nmkdir\
        \ -p ~/.ssh\nchmod 700 ~/.ssh\nif [ -n \"$GITHUB_SSH_PRIVATE_KEY\" ]; then\n\
        \  echo \"$GITHUB_SSH_PRIVATE_KEY\" > ~/.ssh/id_rsa\n  chmod 600 ~/.ssh/id_rsa\n\
        \  ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null\nfi\n"
    - name: Run Script
      run: "set -e\n# Verificar que GITHUB_REPO est\xE9 configurado\nif [ -z \"$GITHUB_REPO\"\
        \ ]; then\n  echo \"Error: GITHUB_REPO no est\xE1 configurado\"\n  exit 1\n\
        fi\n# Limpiar formato de GITHUB_REPO (quitar espacios, barras finales, etc.)\n\
        GITHUB_REPO=$(echo \"$GITHUB_REPO\" | sed 's|^https://github.com/||' | sed\
        \ 's|^git@github.com:||' | sed 's|\\.git$||' | sed 's|/$||' | tr -d ' ')\n\
        echo \"Repositorio GitHub configurado: $GITHUB_REPO\"\n# Verificar autenticaci\xF3\
        n\nif [ -z \"$GITHUB_SSH_PRIVATE_KEY\" ] && [ -z \"$GITHUB_TOKEN\" ]; then\n\
        \  echo \"Error: Se requiere GITHUB_SSH_PRIVATE_KEY o GITHUB_TOKEN\"\n  exit\
        \ 1\nfi\n# Remover remote github si existe\nif git remote | grep -q \"^github$\"\
        ; then\n  git remote remove github\nfi\n# Agregar GitHub como remote\nif [\
        \ -n \"$GITHUB_SSH_PRIVATE_KEY\" ]; then\n  GITHUB_URL=\"git@github.com:${GITHUB_REPO}.git\"\
        \n  git remote add github \"$GITHUB_URL\"\n  echo \"Remote configurado (SSH):\
        \ $GITHUB_URL\"\nelse\n  GITHUB_URL=\"https://${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git\"\
        \n  git remote add github \"$GITHUB_URL\"\n  echo \"Remote configurado (HTTPS):\
        \ https://github.com/${GITHUB_REPO}.git\"\nfi\n# Verificar que el repositorio\
        \ existe y es accesible\necho \"Verificando acceso al repositorio...\"\nif\
        \ ! git ls-remote github ; then\n  echo \"ERROR: No se puede acceder al repositorio\
        \ de GitHub\"\n  echo \"Verifica que:\"\n  echo \"  1. El repositorio existe:\
        \ https://github.com/${GITHUB_REPO}\"\n  echo \"  2. El token/SSH key tiene\
        \ permisos de escritura\"\n  echo \"  3. El formato de GITHUB_REPO es correcto\
        \ (ej: usuario/repo)\"\n  exit 1\nfi\necho \"Acceso al repositorio verificado\
        \ correctamente\"\n# Obtener todas las referencias de origin (GitLab)\necho\
        \ \"Obteniendo todas las referencias de origin...\"\n# Si el repositorio es\
        \ shallow, hacer un fetch completo\nif [ -f .git/shallow ]; then\n  echo \"\
        Repositorio shallow detectado, obteniendo historial completo...\"\n  git fetch\
        \ --unshallow origin || git fetch origin --depth=2147483647 || true\nfi\n\
        # Obtener todas las ramas y tags\ngit fetch origin --prune --tags --force\
        \ || true\n# Asegurarse de tener todos los objetos necesarios\ngit fetch origin\
        \ --all --prune || true\n# Mostrar informaci\xF3n\necho \"Ramas disponibles\
        \ en origin:\"\ngit branch -r | grep \"^  origin/\" | grep -v HEAD || true\n\
        echo \"Tags disponibles:\"\ngit tag -l || true\n# Sincronizar ramas\nif [\
        \ \"$SYNC_ALL_BRANCHES\" = \"true\" ]; then\n  echo \"Sincronizando todas\
        \ las ramas...\"\n  # Construir lista de refspecs para todas las ramas de\
        \ origin\n  REFSPECS=\"\"\n  for branch_ref in $(git branch -r | grep \"^\
        \  origin/\" | grep -v \"HEAD ->\" | sed 's|^  origin/||' | sed 's/ //g' |\
        \ grep -v '^$'); do\n    if [ -n \"$branch_ref\" ]; then\n      if [ -z \"\
        $REFSPECS\" ]; then\n        REFSPECS=\"origin/$branch_ref:refs/heads/$branch_ref\"\
        \n      else\n        REFSPECS=\"$REFSPECS origin/$branch_ref:refs/heads/$branch_ref\"\
        \n      fi\n      echo \"Preparando rama: $branch_ref\"\n    fi\n  done\n\
        \  # Hacer push de todas las ramas de una vez para incluir todos los objetos\
        \ necesarios\n  if [ -n \"$REFSPECS\" ]; then\n    echo \"Enviando todas las\
        \ ramas a GitHub...\"\n    git push github $REFSPECS --force || {\n      echo\
        \ \"Push masivo fall\xF3, intentando rama por rama...\"\n      # Si falla\
        \ el push masivo, intentar rama por rama\n      for branch_ref in $(git branch\
        \ -r | grep \"^  origin/\" | grep -v \"HEAD ->\" | sed 's|^  origin/||' |\
        \ sed 's/ //g' | grep -v '^$'); do\n        if [ -n \"$branch_ref\" ]; then\n\
        \          echo \"Enviando rama individual: $branch_ref\"\n          git push\
        \ github \"origin/$branch_ref:refs/heads/$branch_ref\" --force || echo \"\
        Error al enviar rama $branch_ref, continuando...\"\n        fi\n      done\n\
        \    }\n  fi\n  echo \"Todas las ramas sincronizadas\"\nelse\n  echo \"Enviando\
        \ solo la rama actual: ${CI_COMMIT_REF_NAME}\"\n  git push github \"origin/${CI_COMMIT_REF_NAME}:refs/heads/${CI_COMMIT_REF_NAME}\"\
        \ --force\nfi\n# Sincronizar tags\nif [ \"$SYNC_ALL_TAGS\" = \"true\" ]; then\n\
        \  echo \"Sincronizando todos los tags...\"\n  git push github --tags --force\
        \ || echo \"No hay tags para sincronizar\"\n  echo \"Todos los tags sincronizados\"\
        \nfi\necho \"Proyecto completo sincronizado exitosamente con GitHub\"\n"
    container:
      image: alpine:latest
env:
  GITHUB_REPO: ''
  GITHUB_USER: ''
  GITLAB_USER: ''
  GITLAB_NAME: ''
  SYNC_ALL_BRANCHES: 'true'
  SYNC_ALL_TAGS: 'true'
  RUNNER_TAG: docker
