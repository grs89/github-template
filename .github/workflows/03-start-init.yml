name: 03 Start Init

on:
  workflow_call:
    inputs:
      SERVICES:
        description: 'Lista opcional de microservicios explícitos separados por espacio'
        required: false
        type: string
        default: ''
      PUSH_TO_ECR:
        description: 'Activar push a AWS ECR'
        required: false
        type: boolean
        default: false
      RUNNER_TAG:
        description: 'Runner label'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      GITLAB_TOKEN:
        required: false
      GITHUB_TOKEN:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      DEFECTDOJO_API_KEY:
        required: false
      DEFECTDOJO_URL:
        required: false
      INFRACOST_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

jobs:
  detect_matrix:
    name: 🔍 Detectar Ecosistema y Monorepo
    runs-on: ${{ inputs.RUNNER_TAG || 'ubuntu-latest' }}
    outputs:
      has_docker: ${{ steps.detect.outputs.has_docker }}
      docker_matrix: ${{ steps.detect.outputs.docker_matrix }}
      has_terraform: ${{ steps.detect.outputs.has_terraform }}
      has_maven: ${{ steps.detect.outputs.has_maven }}
      has_ansible: ${{ steps.detect.outputs.has_ansible }}
      has_gitops: ${{ steps.detect.outputs.has_gitops }}
      target_env: ${{ steps.detect.outputs.target_env }}
      env_name: ${{ steps.detect.outputs.env_name }}
    steps:
      - name: Checkout Código del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕵️ Detección Inteligente de Stack y Microservicios
        id: detect
        shell: bash
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "  🔍 Detectando tecnologías y estructura del proyecto..."
          echo "════════════════════════════════════════════════════════════════"

          # 1. Determinar Entorno de Despliegue según Branch / Tag
          REF_NAME="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          TARGET_ENV="PROD"
          ENV_NAME="production"

          if [[ "$REF_NAME" =~ ^(dev|development)$ ]]; then
            TARGET_ENV="DEV"
            ENV_NAME="development"
          elif [[ "$REF_NAME" =~ ^(stg|staging|qa)$ ]]; then
            TARGET_ENV="STG"
            ENV_NAME="staging"
          elif [[ "$REF_NAME" =~ ^(main|master)$ ]] || [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            TARGET_ENV="PROD"
            ENV_NAME="production"
          fi

          echo "target_env=${TARGET_ENV}" >> "$GITHUB_OUTPUT"
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "🎯 Entorno resuelto: ${ENV_NAME} (Target: ${TARGET_ENV})"

          # 2. Detección de Dockerfiles
          SERVICES_FOUND=""
          INPUT_SERVICES="${{ inputs.SERVICES }}"
          if [ -n "$INPUT_SERVICES" ]; then
            SERVICES_FOUND="$INPUT_SERVICES"
          else
            SERVICES_FOUND=$(find . -maxdepth 3 -type f \( -name "Dockerfile" -o -name "Dockerfile.*" -o -name "*.dockerfile" \) ! -path "*/.git/*" 2>/dev/null | xargs -r -n 1 dirname 2>/dev/null | sed 's|^\./||' | sed 's|^\.$|root|' | sort -u)
          fi

          if [ -n "$SERVICES_FOUND" ]; then
            echo "has_docker=true" >> "$GITHUB_OUTPUT"
            echo "🐳 Servicios Docker detectados: $SERVICES_FOUND"
            
            # Construir Matriz JSON
            MATRIX_JSON="{\"include\":["
            FIRST=1
            for s in $SERVICES_FOUND; do
              ACTUAL_PATH=$( [ "$s" = "root" ] && echo "." || echo "$s" )
              REPO_NAME="${GITHUB_REPOSITORY##*/}"
              S_NAME=$( [ "$s" = "root" ] && echo "${REPO_NAME:-app}" || echo "$s" )
              S_LANG="unknown"
              if [ -f "$ACTUAL_PATH/go.mod" ]; then S_LANG="go"
              elif [ -f "$ACTUAL_PATH/package.json" ]; then S_LANG="js"
              elif [ -f "$ACTUAL_PATH/pyproject.toml" ] || [ -f "$ACTUAL_PATH/requirements.txt" ] || [ -f "$ACTUAL_PATH/setup.py" ]; then S_LANG="python"
              elif [ -f "$ACTUAL_PATH/pom.xml" ]; then S_LANG="java-maven"
              elif [ -f "$ACTUAL_PATH/build.gradle" ] || [ -f "$ACTUAL_PATH/build.gradle.kts" ]; then S_LANG="java-gradle"
              fi

              if [ $FIRST -eq 0 ]; then
                MATRIX_JSON="${MATRIX_JSON},"
              fi
              MATRIX_JSON="${MATRIX_JSON}{\"service_path\":\"${ACTUAL_PATH}\",\"service_name\":\"${S_NAME}\",\"service_lang\":\"${S_LANG}\"}"
              FIRST=0
            done
            MATRIX_JSON="${MATRIX_JSON}]}"
            echo "docker_matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
            echo "📋 Matriz generada: ${MATRIX_JSON}"
          else
            echo "has_docker=false" >> "$GITHUB_OUTPUT"
            echo "docker_matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          fi

          # 3. Detección de Terraform
          if find . -maxdepth 3 -type f -name "*.tf" ! -path "*/.git/*" | grep -q .; then
            echo "has_terraform=true" >> "$GITHUB_OUTPUT"
            echo "🏗️ Archivos Terraform detectados."
          else
            echo "has_terraform=false" >> "$GITHUB_OUTPUT"
          fi

          # 4. Detección de Maven
          if [ -f "pom.xml" ]; then
            echo "has_maven=true" >> "$GITHUB_OUTPUT"
            echo "☕ Archivo pom.xml detectado (Librería Maven)."
          else
            echo "has_maven=false" >> "$GITHUB_OUTPUT"
          fi

          # 5. Detección de Ansible
          if [ -f "site.yml" ] || [ -f "playbook.yml" ] || [ -f "ansible.cfg" ] || [ -d "roles" ]; then
            echo "has_ansible=true" >> "$GITHUB_OUTPUT"
            echo "📜 Configuración Ansible detectada."
          else
            echo "has_ansible=false" >> "$GITHUB_OUTPUT"
          fi

          # 6. Detección de GitOps K8s Manifiestos
          if find . -maxdepth 3 -type f \( -name "*.yaml" -o -name "*.yml" \) ! -path "*/.github/*" ! -path "*/.git/*" | grep -q .; then
            echo "has_gitops=true" >> "$GITHUB_OUTPUT"
            echo "☸️ Manifiestos YAML de Kubernetes / GitOps detectados."
          else
            echo "has_gitops=false" >> "$GITHUB_OUTPUT"
          fi

  trigger_docker:
    name: 🚀 App [${{ matrix.service_name }}]
    needs: detect_matrix
    if: needs.detect_matrix.outputs.has_docker == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect_matrix.outputs.docker_matrix) }}
    uses: grs89/github-template/.github/workflows/03-start-docker-matrix-child.yml@main
    with:
      SERVICE_PATH: ${{ matrix.service_path }}
      SERVICE_NAME: ${{ matrix.service_name }}
      SERVICE_LANG: ${{ matrix.service_lang }}
      GITOPS_TARGET_ENV: ${{ needs.detect_matrix.outputs.target_env }}
      TARGET_ENVIRONMENT: ${{ needs.detect_matrix.outputs.env_name }}
    secrets: inherit

  trigger_terraform:
    name: 🏗️ Terraform IaC
    needs: detect_matrix
    if: needs.detect_matrix.outputs.has_docker == 'false' && needs.detect_matrix.outputs.has_terraform == 'true'
    uses: grs89/github-template/.github/workflows/03-start-iac.yml@main
    with:
      TARGET_ENVIRONMENT: ${{ needs.detect_matrix.outputs.env_name }}
    secrets: inherit

  trigger_maven:
    name: ☕ Maven Library
    needs: detect_matrix
    if: needs.detect_matrix.outputs.has_docker == 'false' && needs.detect_matrix.outputs.has_maven == 'true'
    uses: grs89/github-template/.github/workflows/libraries-maven-lib.yml@main
    secrets: inherit

  trigger_ansible:
    name: 📜 Ansible Automation
    needs: detect_matrix
    if: needs.detect_matrix.outputs.has_docker == 'false' && needs.detect_matrix.outputs.has_terraform == 'false' && needs.detect_matrix.outputs.has_ansible == 'true'
    uses: grs89/github-template/.github/workflows/infrastructure-ansible.yml@main
    secrets: inherit

  trigger_gitops:
    name: ☸️ GitOps K8s
    needs: detect_matrix
    if: needs.detect_matrix.outputs.has_docker == 'false' && needs.detect_matrix.outputs.has_terraform == 'false' && needs.detect_matrix.outputs.has_ansible == 'false' && needs.detect_matrix.outputs.has_gitops == 'true'
    uses: grs89/github-template/.github/workflows/k8s-gitops.yml@main
    secrets: inherit

  create_release:
    name: 📦 Publicar Release Oficial
    needs: [trigger_docker, trigger_terraform, trigger_maven, trigger_ansible, trigger_gitops]
    if: startsWith(github.ref, 'refs/tags/') && always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Extraer o Generar Notas de Release
        id: release_notes
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_TITLE="Release ${TAG_NAME}"
          NOTES_FILE="RELEASE_CHANGELOG.md"

          if [ -f "CHANGELOG.md" ]; then
            head -n 100 CHANGELOG.md > "$NOTES_FILE"
          else
            echo "## 🚀 ${RELEASE_TITLE}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Release automatizado generado por GitHub DevSecOps Templates." >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "### 📦 Commits recientes:" >> "$NOTES_FILE"
            git log -n 10 --pretty=format:"* %s (%h)" >> "$NOTES_FILE"
          fi

          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Crear / Actualizar GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TITLE: ${{ steps.release_notes.outputs.release_title }}
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "ℹ️ El release $TAG_NAME ya existe. Actualizando notas..."
            gh release edit "$TAG_NAME" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "🚀 Creando nuevo release $TAG_NAME..."
            gh release create "$TAG_NAME" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi
          echo "✅ Release completado exitosamente."
