  SEARCH_MAX_DEPTH: '2'
  SECRET_DETECTION_DISABLED: 'false'
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ''
  GIT_DEPTH: '0'
  GIT_STRATEGY: fetch
  IMAGE_NAME: ${CI_PROJECT_NAME}
  RUNNER_TAG: docker
  DOCKER_BUILDKIT: '1'
  DOCKER_PLATFORMS: linux/amd64
  TEMPLATE_PROJECT: grs89/gitlab-templates
