name: 03 Start Docker Brk
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  push_container:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "if [ \"$DOCKER_BUILDKIT\" = \"1\" ]; then\n  echo \"\u2705 BuildKit detectado.\
        \ El push de im\xE1genes se gestion\xF3 autom\xE1ticamente durante el paso\
        \ de construcci\xF3n.\"\n  exit 0\nfi\n\nNone"
    needs:
    - build_container_bk
    - build_container
    - detect_language
  generate_badges:
    runs-on: ubuntu-latest
    steps:
    - name: After Script
      run: 'mkdir -p "badges/${SERVICE_NAME:-$CI_PROJECT_NAME}"

        cp badges/*.svg "badges/${SERVICE_NAME:-$CI_PROJECT_NAME}/" 2>/dev/null ||
        true'
      if: always()
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: generate_badges-artifacts
        path: badges/
    needs:
    - detect_language
    - test_auto
    - generate_changelog
    - image_sign
    - image_provenance
  generate_security_report:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F4CA Generando reporte de seguridad...\"\n# Recolectar todos\
        \ los reportes JSON de subdirectorios al root para consolidaci\xF3n\n# -mindepth\
        \ 2 evita intentar copiar archivos que ya est\xE1n en el root (mismo archivo)\n\
        find . -mindepth 2 -name \"*.json\" -exec cp -f {} . \\; 2>/dev/null || true\n\
        \necho \"\U0001F680 Ejecutando generador de reportes...\"\npython3 /app/generate_report.py\n"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: generate_security_report-artifacts
        path: '*.html

          *.pdf'
    container:
      image: ${REPORT_IMAGE}
    needs:
    - semgrep-sast
    - sast
    - dependency_scanning
    - secret_detection
    - container_scanning
    - cleanup_registry
    - image_sign
    - image_provenance
    - license_compliance_check
    - code_quality
    - test_auto
    - generate_sbom
    - trivy_sast_scan
    - trivy_iac_scan
    - checkov_scan
    - dast_zap_scan
    - api_security
    - smoke_tests
    - performance_test
    - dependency_update
    - generate_badges
