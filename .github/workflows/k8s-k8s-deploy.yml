name: K8S K8S Deploy
permissions:
  contents: read
jobs:
  k8s_deploy_kustomize:
    name: k8s deploy kustomize
    runs-on: ubuntu-latest
    if: inputs.DEPLOY_DISABLED != 'true' && inputs.DEPLOY_METHOD == 'kustomize'
    steps:
    - uses: actions/checkout@v4
    - &id001
      name: Configurar kubeconfig
      run: |
        umask 077
        mkdir -p ~/.kube
        echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - name: k8s deploy kustomize
      run: |
        echo "🔍 Detectando método de deploy..."

        # Determinar directorio de Kustomize
        if [ -f "${KUSTOMIZE_DIR}/kustomization.yaml" ] || [ -f "${KUSTOMIZE_DIR}/kustomization.yml" ]; then
          DEPLOY_DIR="${KUSTOMIZE_DIR}"
          echo "📂 Usando overlay por rama: ${DEPLOY_DIR}"
        elif [ -f "${KUSTOMIZE_FALLBACK_DIR}/kustomization.yaml" ] || [ -f "${KUSTOMIZE_FALLBACK_DIR}/kustomization.yml" ]; then
          DEPLOY_DIR="${KUSTOMIZE_FALLBACK_DIR}"
          echo "📂 Usando directorio base: ${DEPLOY_DIR}"
        else
          echo "❌ No se encontró kustomization.yaml en ${KUSTOMIZE_DIR} ni en ${KUSTOMIZE_FALLBACK_DIR}"
          echo "💡 Estructura esperada:"
          echo "   k8s/"
          echo "   ├── kustomization.yaml"
          echo "   ├── overlays/"
          echo "   │   ├── dev/"
          echo "   │   ├── qa/"
          echo "   │   └── main/"
          exit 1
        fi

        echo "🏷️ Actualizando imagen en Kustomize..."
        if [ -n "$IMAGE_TAG" ]; then
          cd "${DEPLOY_DIR}"
          kubectl kustomize edit set image "${REGISTRY}/${GITHUB_REPOSITORY}:${IMAGE_TAG}" 2>/dev/null || {
            echo "ℹ️ kustomize edit no disponible no soportado. Usando sed..."
            sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|g" kustomization.yaml kustomization.yml 2>/dev/null || true
          }
          cd "${GITHUB_WORKSPACE}"
        fi

        echo "🚀 Aplicando deploy con Kustomize..."
        kubectl apply -k "${DEPLOY_DIR}" -n "${K8S_NAMESPACE}"

        echo "⏳ Esperando rollout..."
        DEPLOYMENTS=$(kubectl get deployments -n "${K8S_NAMESPACE}" -o name 2>/dev/null)
        for DEPLOY in $DEPLOYMENTS; do
          echo "  ⏳ Esperando ${DEPLOY}..."
          kubectl rollout status "${DEPLOY}" -n "${K8S_NAMESPACE}" --timeout=300s || {
            echo "⚠️ Timeout en rollout de ${DEPLOY}"
            kubectl describe "${DEPLOY}" -n "${K8S_NAMESPACE}"
          }
        done

        echo ""
        echo "═══════════════════════════════════"
        echo "📋 Estado del deploy:"
        echo "═══════════════════════════════════"
        kubectl get pods -n "${K8S_NAMESPACE}" -o wide
        echo ""
        kubectl get services -n "${K8S_NAMESPACE}"
        echo "═══════════════════════════════════"
    env:
      DEPLOY_DISABLED: ${{ inputs.DEPLOY_DISABLED }}
      K8S_NAMESPACE: ${{ inputs.K8S_NAMESPACE }}
      KUSTOMIZE_DIR: ${{ inputs.KUSTOMIZE_DIR }}
      KUSTOMIZE_FALLBACK_DIR: ${{ inputs.KUSTOMIZE_FALLBACK_DIR }}
      HELM_CHART_PATH: ${{ inputs.HELM_CHART_PATH }}
      HELM_RELEASE_NAME: ${{ inputs.HELM_RELEASE_NAME }}
      HELM_VALUES_FILE: ${{ inputs.HELM_VALUES_FILE }}
      HELM_EXTRA_ARGS: ${{ inputs.HELM_EXTRA_ARGS }}
      K8S_MANIFESTS_DIR: ${{ inputs.K8S_MANIFESTS_DIR }}
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  k8s_deploy_helm:
    name: k8s deploy helm
    runs-on: ubuntu-latest
    if: inputs.DEPLOY_DISABLED != 'true' && inputs.DEPLOY_METHOD == 'helm'
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - *id001
    - name: k8s deploy helm
      run: |
        echo "🔍 Detectando Helm chart..."
        if [ -f "${HELM_CHART_PATH}/Chart.yaml" ]; then
          echo "📂 Chart encontrado en: ${HELM_CHART_PATH}"
        else
          echo "❌ No se encontró Chart.yaml en ${HELM_CHART_PATH}"
          echo "💡 Estructura esperada:"
          echo "   helm/"
          echo "   ├── Chart.yaml"
          echo "   ├── values.yaml"
          echo "   └── templates/"
          exit 1
        fi

        echo "📦 Actualizando dependencias del chart..."
        helm dependency update "${HELM_CHART_PATH}" 2>/dev/null || true

        echo "🚀 Ejecutando deploy con Helm..."

        # Construir argumentos de values
        VALUES_ARGS=""
        if [ -n "$HELM_VALUES_FILE" ]; then
          VALUES_ARGS="-f ${HELM_VALUES_FILE}"
        elif [ -f "${HELM_CHART_PATH}/values-${GITHUB_REF_NAME}.yaml" ]; then
          VALUES_ARGS="-f ${HELM_CHART_PATH}/values-${GITHUB_REF_NAME}.yaml"
          echo "📄 Usando values por rama: values-${GITHUB_REF_NAME}.yaml"
        fi

        helm upgrade --install "${HELM_RELEASE_NAME}" "${HELM_CHART_PATH}" \
          --namespace "${K8S_NAMESPACE}" \
          --create-namespace \
          --set image.repository="${REGISTRY}/${GITHUB_REPOSITORY}" \
          --set image.tag="${IMAGE_TAG:-latest}" \
          --wait \
          --timeout 300s \
          ${VALUES_ARGS} \
          ${HELM_EXTRA_ARGS}

        echo ""
        echo "═══════════════════════════════════"
        echo "📋 Estado del release Helm:"
        echo "═══════════════════════════════════"
        helm status "${HELM_RELEASE_NAME}" -n "${K8S_NAMESPACE}"
        echo ""
        kubectl get pods -n "${K8S_NAMESPACE}" -o wide
        echo "═══════════════════════════════════"
    env:
      DEPLOY_DISABLED: ${{ inputs.DEPLOY_DISABLED }}
      K8S_NAMESPACE: ${{ inputs.K8S_NAMESPACE }}
      KUSTOMIZE_DIR: ${{ inputs.KUSTOMIZE_DIR }}
      KUSTOMIZE_FALLBACK_DIR: ${{ inputs.KUSTOMIZE_FALLBACK_DIR }}
      HELM_CHART_PATH: ${{ inputs.HELM_CHART_PATH }}
      HELM_RELEASE_NAME: ${{ inputs.HELM_RELEASE_NAME }}
      HELM_VALUES_FILE: ${{ inputs.HELM_VALUES_FILE }}
      HELM_EXTRA_ARGS: ${{ inputs.HELM_EXTRA_ARGS }}
      K8S_MANIFESTS_DIR: ${{ inputs.K8S_MANIFESTS_DIR }}
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  k8s_deploy_manifest:
    name: k8s deploy manifest
    runs-on: ubuntu-latest
    if: inputs.DEPLOY_DISABLED != 'true' && inputs.DEPLOY_METHOD == 'manifest'
    steps:
    - uses: actions/checkout@v4
    - *id001
    - name: k8s deploy manifest
      run: |
        echo "🔍 Buscando manifiestos YAML en ${K8S_MANIFESTS_DIR}..."
        YAML_FILES=$(find "${K8S_MANIFESTS_DIR}" -maxdepth 1 -name "*.yaml" -o -name "*.yml" | sort)

        if [ -z "$YAML_FILES" ]; then
          echo "❌ No se encontraron manifiestos en ${K8S_MANIFESTS_DIR}"
          exit 1
        fi

        echo "📄 Manifiestos encontrados:"
        echo "$YAML_FILES"

        echo "🏷️ Actualizando imagen en manifiestos..."
        if [ -n "$IMAGE_TAG" ]; then
          for FILE in $(find "${K8S_MANIFESTS_DIR}" -maxdepth 1 -name "*.yaml" -o -name "*.yml"); do
            sed -i "s|image:.*${REPO_NAME}.*|image: ${REGISTRY}/${GITHUB_REPOSITORY}:${IMAGE_TAG}|g" "$FILE" 2>/dev/null || true
          done
        fi

        echo "🚀 Aplicando manifiestos..."
        kubectl apply -f "${K8S_MANIFESTS_DIR}" -n "${K8S_NAMESPACE}"

        echo "⏳ Esperando rollout..."
        DEPLOYMENTS=$(kubectl get deployments -n "${K8S_NAMESPACE}" -o name 2>/dev/null)
        for DEPLOY in $DEPLOYMENTS; do
          echo "  ⏳ Esperando ${DEPLOY}..."
          kubectl rollout status "${DEPLOY}" -n "${K8S_NAMESPACE}" --timeout=300s || true
        done

        echo ""
        echo "═══════════════════════════════════"
        echo "📋 Estado del deploy:"
        kubectl get all -n "${K8S_NAMESPACE}"
        echo "═══════════════════════════════════"
    env:
      DEPLOY_DISABLED: ${{ inputs.DEPLOY_DISABLED }}
      K8S_NAMESPACE: ${{ inputs.K8S_NAMESPACE }}
      KUSTOMIZE_DIR: ${{ inputs.KUSTOMIZE_DIR }}
      KUSTOMIZE_FALLBACK_DIR: ${{ inputs.KUSTOMIZE_FALLBACK_DIR }}
      HELM_CHART_PATH: ${{ inputs.HELM_CHART_PATH }}
      HELM_RELEASE_NAME: ${{ inputs.HELM_RELEASE_NAME }}
      HELM_VALUES_FILE: ${{ inputs.HELM_VALUES_FILE }}
      HELM_EXTRA_ARGS: ${{ inputs.HELM_EXTRA_ARGS }}
      K8S_MANIFESTS_DIR: ${{ inputs.K8S_MANIFESTS_DIR }}
      REGISTRY: ghcr.io
      REPO_NAME: ${{ github.event.repository.name }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
on:
  workflow_call:
    inputs:
      DEPLOY_DISABLED:
        description: DEPLOY_DISABLED
        required: false
        type: string
        default: 'false'
      K8S_NAMESPACE:
        description: K8S_NAMESPACE
        required: false
        type: string
        default: ''
      KUSTOMIZE_DIR:
        description: KUSTOMIZE_DIR
        required: false
        type: string
        default: ''
      KUSTOMIZE_FALLBACK_DIR:
        description: KUSTOMIZE_FALLBACK_DIR
        required: false
        type: string
        default: k8s
      HELM_CHART_PATH:
        description: HELM_CHART_PATH
        required: false
        type: string
        default: helm/
      HELM_RELEASE_NAME:
        description: HELM_RELEASE_NAME
        required: false
        type: string
        default: ''
      HELM_VALUES_FILE:
        description: HELM_VALUES_FILE
        required: false
        type: string
        default: ''
      HELM_EXTRA_ARGS:
        description: HELM_EXTRA_ARGS
        required: false
        type: string
        default: ''
      K8S_MANIFESTS_DIR:
        description: K8S_MANIFESTS_DIR
        required: false
        type: string
        default: k8s/
      IMAGE_TAG:
        description: Tag de la imagen (vacío = latest)
        required: false
        type: string
        default: ''
      DEPLOY_METHOD:
        description: kustomize, helm o manifest
        required: false
        type: string
        default: kustomize
    secrets:
      KUBE_CONFIG:
        description: kubeconfig en base64
        required: true
