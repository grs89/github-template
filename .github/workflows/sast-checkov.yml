name: SAST Checkov

on:
  workflow_call:
    inputs:
      CHECK_DIR:
        description: 'Directorio a escanear'
        required: false
        type: string
        default: '.'
      CHECKOV_FRAMEWORK:
        description: 'Framework de Checkov (all, terraform, kubernetes, dockerfile, ...)'
        required: false
        type: string
        default: 'all'
      CHECKOV_SOFT_FAIL:
        description: 'No fallar el job al encontrar hallazgos'
        required: false
        type: boolean
        default: true
      UPLOAD_SARIF:
        description: 'Publicar SARIF en GitHub Code Scanning (requiere GHAS o repo público)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checkov_scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkov (JSON + SARIF)
        env:
          CHECK_DIR: ${{ inputs.CHECK_DIR }}
          FRAMEWORK: ${{ inputs.CHECKOV_FRAMEWORK }}
          SOFT_FAIL: ${{ inputs.CHECKOV_SOFT_FAIL }}
        run: |
          python3 -m pip install --quiet checkov
          FLAGS=(-d "$CHECK_DIR" --framework "$FRAMEWORK" --output json --output sarif --output-file-path checkov-results)
          [ "$SOFT_FAIL" = "true" ] && FLAGS+=(--soft-fail)
          mkdir -p checkov-results
          checkov "${FLAGS[@]}"
          # checkov escribe results_json.json / results_sarif.sarif
          [ -f checkov-results/results_json.json ] && cp checkov-results/results_json.json checkov-report.json || true

      - name: Subir SARIF a Code Scanning
        if: inputs.UPLOAD_SARIF && hashFiles('checkov-results/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: |
            checkov-report.json
            checkov-results/
          if-no-files-found: ignore
