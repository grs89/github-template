name: Quality Accessibility

on:
  workflow_call:
    inputs:
      PA11Y_TARGET_URL:
        description: 'URL a auditar con pa11y (WCAG 2)'
        required: true
        type: string
      PA11Y_STANDARD:
        description: 'Estándar pa11y (WCAG2A, WCAG2AA, WCAG2AAA)'
        required: false
        type: string
        default: 'WCAG2AA'

permissions:
  contents: read

jobs:
  accessibility:
    name: Pa11y Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Auditoría pa11y-ci
        env:
          PA11Y_TARGET_URL: ${{ inputs.PA11Y_TARGET_URL }}
          PA11Y_STANDARD: ${{ inputs.PA11Y_STANDARD }}
        run: |
          jq -n --arg std "$PA11Y_STANDARD" --arg url "$PA11Y_TARGET_URL" \
            '{defaults: {standard: $std, chromeLaunchConfig: {args: ["--no-sandbox"]}}, urls: [$url]}' > .pa11yci.json
          npx --yes pa11y-ci@3.1.0 --config .pa11yci.json --json > pa11y-report.json || STATUS=$?
          cat pa11y-report.json
          exit "${STATUS:-0}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: pa11y-report.json
          if-no-files-found: ignore
