name: 03 Start Docker Matrix Ch
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  detect_services_ch:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "apk add --no-cache bash\nSERVICES=$(find . -maxdepth 2 -name Dockerfile\
        \ -exec dirname {} \\; | sed 's|^\\./||' | sed 's|^\\.$|root|' | sort -u |\
        \ xargs)\n[ -z \"$SERVICES\" ] && (echo \"\u274C No services found\"; exit\
        \ 1)\necho \"SERVICES_CH=$SERVICES\" > detect.env\n"
    container:
      image: alpine:latest
  generate_trigger_ch:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F3D7\uFE0F Generando child_pipeline.yml (Grandchild Pipeline\
        \ Matrix Trigger)...\"\n\n# 1. Crear la estructura del disparador con la matriz\n\
        cat <<EOF > child_pipeline.yml\n# Pipeline Autogenerado - Disparador de Microservicios\
        \ Anidados\nstages:\n  - trigger\n\ntrigger_child_pipeline:\n  stage: trigger\n\
        \  trigger:\n    include:\n      - project: '${TEMPLATE_PROJECT}'\n      \
        \  ref: '${TEMPLATE_REF}'\n        file: '03-start/docker-matrix-child.yml'\n\
        \    strategy: depend\n  parallel:\n    matrix:\nEOF\n\nfor s in ${SERVICES_CH};\
        \ do\n  ACTUAL_PATH=$( [ \"$s\" = \"root\" ] && echo \".\" || echo \"$s\"\
        \ )\n  \n  # \U0001F50D Detecci\xF3n r\xE1pida de lenguaje para la matriz\n\
        \  S_LANG=\"unknown\"\n  if [ -f \"$ACTUAL_PATH/go.mod\" ]; then S_LANG=\"\
        go\";\n  elif [ -f \"$ACTUAL_PATH/package.json\" ]; then S_LANG=\"js\";\n\
        \  elif [ -f \"$ACTUAL_PATH/pyproject.toml\" ] || [ -f \"$ACTUAL_PATH/requirements.txt\"\
        \ ] || [ -f \"$ACTUAL_PATH/setup.py\" ]; then S_LANG=\"python\";\n  elif [\
        \ -f \"$ACTUAL_PATH/pom.xml\" ]; then S_LANG=\"java-maven\";\n  elif [ -f\
        \ \"$ACTUAL_PATH/build.gradle\" ] || [ -f \"$ACTUAL_PATH/build.gradle.kts\"\
        \ ]; then S_LANG=\"java-gradle\";\n  fi\n\n  echo \"            - SERVICE_PATH:\
        \ \\\"$ACTUAL_PATH\\\"\" >> child_pipeline.yml\n  echo \"              SERVICE_NAME:\
        \ \\\"$s\\\"\" >> child_pipeline.yml\n  echo \"              SERVICE_LANG:\
        \ \\\"$S_LANG\\\"\" >> child_pipeline.yml\ndone\n\necho \"\u2705 Pipeline\
        \ anidado generado con \xE9xito.\"\n"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: generate_trigger_ch-artifacts
        path: child_pipeline.yml
    container:
      image: alpine:latest
    needs:
    - detect_services_ch
  generate_badges:
    runs-on: ubuntu-latest
    steps:
    - name: After Script
      run: 'mkdir -p "badges/${SERVICE_NAME:-$CI_PROJECT_NAME}"

        cp badges/*.svg "badges/${SERVICE_NAME:-$CI_PROJECT_NAME}/" 2>/dev/null ||
        true'
      if: always()
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: generate_badges-artifacts
        path: badges/
env:
  TEMPLATE_PROJECT: grs89/gitlab-templates
