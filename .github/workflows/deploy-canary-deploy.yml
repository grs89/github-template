name: Deploy Canary Deploy
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  canary_deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\necho\
        \ \"\U0001F424 Canary Deploy\"\necho \"  \U0001F4E6 Servicio:  ${CI_PROJECT_NAME}\"\
        \necho \"  \U0001F3F7\uFE0F Imagen:    ${CI_REGISTRY_IMAGE}:${IMAGE_TAG:-latest}\"\
        \necho \"  \u2696\uFE0F  Peso:      ${CANARY_WEIGHT}%\"\necho \"  \U0001F4CA\
        \ R\xE9plicas:  ${CANARY_REPLICAS}\"\necho \"\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\"\n\necho \"\U0001F4C4 Generando deployment canary...\"\
        \nSTABLE_DEPLOY=$(kubectl get deployment \"${CI_PROJECT_NAME}\" -n \"${K8S_NAMESPACE}\"\
        \ -o yaml 2>/dev/null)\nif [ -z \"$STABLE_DEPLOY\" ]; then\n  echo \"\u26A0\
        \uFE0F No existe deployment estable previo. Desplegando como primera versi\xF3\
        n.\"\n  cat <<EOF | kubectl apply -n \"${K8S_NAMESPACE}\" -f -\napiVersion:\
        \ apps/v1\nkind: Deployment\nmetadata:\n  name: ${CI_PROJECT_NAME}-canary\n\
        \  labels:\n    app: ${CI_PROJECT_NAME}\n    track: canary\nspec:\n  replicas:\
        \ ${CANARY_REPLICAS}\n  selector:\n    matchLabels:\n      app: ${CI_PROJECT_NAME}\n\
        \      track: canary\n  template:\n    metadata:\n      labels:\n        app:\
        \ ${CI_PROJECT_NAME}\n        track: canary\n    spec:\n      containers:\n\
        \      - name: app\n        image: ${CI_REGISTRY_IMAGE}:${IMAGE_TAG:-latest}\n\
        \        ports:\n        - containerPort: 8080\nEOF\nelse\n  echo \"\U0001F504\
        \ Creando deployment canary basado en el estable...\"\n  echo \"$STABLE_DEPLOY\"\
        \ | \\\n    sed \"s/name: ${CI_PROJECT_NAME}/name: ${CI_PROJECT_NAME}-canary/g\"\
        \ | \\\n    sed \"s/track: stable/track: canary/g\" | \\\n    sed \"s|image:.*|image:\
        \ ${CI_REGISTRY_IMAGE}:${IMAGE_TAG:-latest}|g\" | \\\n    sed \"s/replicas:.*/replicas:\
        \ ${CANARY_REPLICAS}/g\" | \\\n    kubectl apply -n \"${K8S_NAMESPACE}\" -f\
        \ -\nfi\n\necho \"\u23F3 Esperando rollout del canary...\"\nkubectl rollout\
        \ status deployment/${CI_PROJECT_NAME}-canary -n \"${K8S_NAMESPACE}\" --timeout=180s\n\
        \necho \"\u2705 Canary desplegado. Pods:\"\nkubectl get pods -n \"${K8S_NAMESPACE}\"\
        \ -l \"app=${CI_PROJECT_NAME}\" -o wide\n"
    env:
      K8S_NAMESPACE: ${CI_PROJECT_NAME}
      CANARY_REPLICAS: '1'
  canary_verify:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F50D Verificando canary por ${CANARY_VERIFY_TIMEOUT}s...\"\
        \napk add --no-cache curl 2>/dev/null || true\nELAPSED=0\nERRORS=0\nCHECKS=0\n\
        \nwhile [ \"$ELAPSED\" -lt \"$CANARY_VERIFY_TIMEOUT\" ]; do\n  CHECKS=$((CHECKS\
        \ + 1))\n\n  # Verificar pods canary\n  READY=$(kubectl get pods -n \"${K8S_NAMESPACE}\"\
        \ -l \"app=${CI_PROJECT_NAME},track=canary\" -o jsonpath='{.items[*].status.containerStatuses[*].ready}'\
        \ 2>/dev/null)\n  RESTARTS=$(kubectl get pods -n \"${K8S_NAMESPACE}\" -l \"\
        app=${CI_PROJECT_NAME},track=canary\" -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{end}'\
        \ 2>/dev/null || echo \"0\")\n\n  if echo \"$READY\" | grep -q \"false\";\
        \ then\n    ERRORS=$((ERRORS + 1))\n    echo \"  \u26A0\uFE0F [${ELAPSED}s]\
        \ Pod canary no ready (errores: ${ERRORS})\"\n  fi\n\n  if [ \"$RESTARTS\"\
        \ -gt 0 ] 2>/dev/null; then\n    ERRORS=$((ERRORS + 1))\n    echo \"  \u26A0\
        \uFE0F [${ELAPSED}s] Restarts detectados: ${RESTARTS}\"\n  fi\n\n  # Health\
        \ check HTTP si est\xE1 configurado\n  if [ -n \"$CANARY_HEALTH_URL\" ]; then\n\
        \    HTTP_CODE=$(curl -s -o /dev/null -w \"%{http_code}\" \"$CANARY_HEALTH_URL\"\
        \ 2>/dev/null || echo \"000\")\n    if [ \"$HTTP_CODE\" -lt 200 ] || [ \"\
        $HTTP_CODE\" -ge 400 ] 2>/dev/null; then\n      ERRORS=$((ERRORS + 1))\n \
        \     echo \"  \u26A0\uFE0F [${ELAPSED}s] Health check HTTP ${HTTP_CODE}\"\
        \n    fi\n  fi\n\n  if [ \"$ERRORS\" -ge \"$CANARY_ERROR_THRESHOLD\" ]; then\n\
        \    echo \"\u274C Umbral de errores alcanzado (${ERRORS}/${CANARY_ERROR_THRESHOLD}).\"\
        \n    echo \"\U0001F519 Se recomienda ejecutar canary_rollback.\"\n    exit\
        \ 1\n  fi\n\n  sleep 10\n  ELAPSED=$((ELAPSED + 10))\ndone\n\necho \"\"\n\
        echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\necho \"\u2705\
        \ Canary verificado: ${CHECKS} checks, ${ERRORS} errores\"\necho \"\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\n"
    needs:
    - canary_deploy
    env:
      K8S_NAMESPACE: ${CI_PROJECT_NAME}
      CANARY_HEALTH_URL: ''
      CANARY_ERROR_THRESHOLD: '5'
  canary_promote:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F680 Promoviendo canary a producci\xF3n...\"\nkubectl set\
        \ image deployment/${CI_PROJECT_NAME} app=${CI_REGISTRY_IMAGE}:${IMAGE_TAG:-latest}\
        \ -n \"${K8S_NAMESPACE}\"\n\necho \"\u23F3 Esperando rollout de producci\xF3\
        n...\"\nkubectl rollout status deployment/${CI_PROJECT_NAME} -n \"${K8S_NAMESPACE}\"\
        \ --timeout=300s\n\necho \"\U0001F5D1\uFE0F Eliminando deployment canary...\"\
        \nkubectl delete deployment ${CI_PROJECT_NAME}-canary -n \"${K8S_NAMESPACE}\"\
        \ --ignore-not-found=true\n\necho \"\u2705 Canary promovido exitosamente.\"\
        \nkubectl get pods -n \"${K8S_NAMESPACE}\" -l \"app=${CI_PROJECT_NAME}\"\n"
    needs:
    - canary_verify
    env:
      K8S_NAMESPACE: ${CI_PROJECT_NAME}
  canary_rollback:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F519 Rollback: eliminando canary...\"\nkubectl delete deployment\
        \ ${CI_PROJECT_NAME}-canary -n \"${K8S_NAMESPACE}\" --ignore-not-found=true\n\
        echo \"\u2705 Canary eliminado. Tr\xE1fico 100% en versi\xF3n estable.\"\n\
        kubectl get pods -n \"${K8S_NAMESPACE}\" -l \"app=${CI_PROJECT_NAME}\"\n"
    env:
      K8S_NAMESPACE: ${CI_PROJECT_NAME}
env:
  CANARY_DISABLED: 'false'
  CANARY_WEIGHT: '20'
  CANARY_VERIFY_TIMEOUT: '120'
