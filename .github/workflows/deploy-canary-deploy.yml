name: Deploy Canary Deploy
permissions:
  contents: read
jobs:
  canary_deploy:
    name: canary deploy
    runs-on: ubuntu-latest
    if: inputs.CANARY_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - &id001
      name: Configurar kubeconfig
      run: |
        umask 077
        mkdir -p ~/.kube
        echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - name: canary deploy
      run: |
        echo "═══════════════════════════════════"
        echo "🐤 Canary Deploy"
        echo "  📦 Servicio:  ${REPO_NAME}"
        echo "  🏷️ Imagen:    ${REGISTRY}/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}"
        echo "  ⚖️  Peso:      ${CANARY_WEIGHT}%"
        echo "  📊 Réplicas:  ${CANARY_REPLICAS}"
        echo "═══════════════════════════════════"

        echo "📄 Generando deployment canary..."
        STABLE_DEPLOY=$(kubectl get deployment "${REPO_NAME}" -n "${K8S_NAMESPACE}" -o yaml 2>/dev/null || true)
        if [ -z "$STABLE_DEPLOY" ]; then
          echo "⚠️ No existe deployment estable previo. Desplegando como primera versión."
          cat <<EOF | kubectl apply -n "${K8S_NAMESPACE}" -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${REPO_NAME}-canary
          labels:
            app: ${REPO_NAME}
            track: canary
        spec:
          replicas: ${CANARY_REPLICAS}
          selector:
            matchLabels:
              app: ${REPO_NAME}
              track: canary
          template:
            metadata:
              labels:
                app: ${REPO_NAME}
                track: canary
            spec:
              containers:
              - name: app
                image: ${REGISTRY}/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
                ports:
                - containerPort: 8080
        EOF
        else
          echo "🔄 Creando deployment canary basado en el estable..."
          echo "$STABLE_DEPLOY" | \
            sed "s/name: ${REPO_NAME}/name: ${REPO_NAME}-canary/g" | \
            sed "s/track: stable/track: canary/g" | \
            sed "s|image:.*|image: ${REGISTRY}/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}|g" | \
            sed "s/replicas:.*/replicas: ${CANARY_REPLICAS}/g" | \
            kubectl apply -n "${K8S_NAMESPACE}" -f -
        fi

        echo "⏳ Esperando rollout del canary..."
        kubectl rollout status deployment/${REPO_NAME}-canary -n "${K8S_NAMESPACE}" --timeout=180s

        echo "✅ Canary desplegado. Pods:"
        kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${REPO_NAME}" -o wide
    env:
      CANARY_DISABLED: ${{ inputs.CANARY_DISABLED }}
      CANARY_WEIGHT: ${{ inputs.CANARY_WEIGHT }}
      CANARY_VERIFY_TIMEOUT: ${{ inputs.CANARY_VERIFY_TIMEOUT }}
      K8S_NAMESPACE: ${{ inputs.K8S_NAMESPACE }}
      CANARY_REPLICAS: ${{ inputs.CANARY_REPLICAS }}
      CANARY_HEALTH_URL: ${{ inputs.CANARY_HEALTH_URL }}
      CANARY_ERROR_THRESHOLD: ${{ inputs.CANARY_ERROR_THRESHOLD }}
      REGISTRY: ghcr.io
      REPO_NAME: ${{ github.event.repository.name }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  canary_verify:
    name: canary verify
    runs-on: ubuntu-latest
    if: inputs.CANARY_DISABLED != 'true'
    needs:
    - canary_deploy
    steps:
    - uses: actions/checkout@v4
    - *id001
    - name: canary verify
      run: |
        echo "🔍 Verificando canary por ${CANARY_VERIFY_TIMEOUT}s..."
        ELAPSED=0
        ERRORS=0
        CHECKS=0

        while [ "$ELAPSED" -lt "$CANARY_VERIFY_TIMEOUT" ]; do
          CHECKS=$((CHECKS + 1))

          # Verificar pods canary
          READY=$(kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${REPO_NAME},track=canary" -o jsonpath='{.items[*].status.containerStatuses[*].ready}' 2>/dev/null)
          RESTARTS=$(kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${REPO_NAME},track=canary" -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{end}' 2>/dev/null || echo "0")

          if echo "$READY" | grep -q "false"; then
            ERRORS=$((ERRORS + 1))
            echo "  ⚠️ [${ELAPSED}s] Pod canary no ready (errores: ${ERRORS})"
          fi

          if [ "$RESTARTS" -gt 0 ] 2>/dev/null; then
            ERRORS=$((ERRORS + 1))
            echo "  ⚠️ [${ELAPSED}s] Restarts detectados: ${RESTARTS}"
          fi

          # Health check HTTP si está configurado
          if [ -n "$CANARY_HEALTH_URL" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$CANARY_HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ] 2>/dev/null; then
              ERRORS=$((ERRORS + 1))
              echo "  ⚠️ [${ELAPSED}s] Health check HTTP ${HTTP_CODE}"
            fi
          fi

          if [ "$ERRORS" -ge "$CANARY_ERROR_THRESHOLD" ]; then
            echo "❌ Umbral de errores alcanzado (${ERRORS}/${CANARY_ERROR_THRESHOLD})."
            echo "🔙 Se recomienda ejecutar canary_rollback."
            exit 1
          fi

          sleep 10
          ELAPSED=$((ELAPSED + 10))
        done

        echo ""
        echo "═══════════════════════════════════"
        echo "✅ Canary verificado: ${CHECKS} checks, ${ERRORS} errores"
        echo "═══════════════════════════════════"
    env:
      CANARY_DISABLED: ${{ inputs.CANARY_DISABLED }}
      CANARY_WEIGHT: ${{ inputs.CANARY_WEIGHT }}
      CANARY_VERIFY_TIMEOUT: ${{ inputs.CANARY_VERIFY_TIMEOUT }}
      K8S_NAMESPACE: ${{ inputs.K8S_NAMESPACE }}
      CANARY_REPLICAS: ${{ inputs.CANARY_REPLICAS }}
      CANARY_HEALTH_URL: ${{ inputs.CANARY_HEALTH_URL }}
      CANARY_ERROR_THRESHOLD: ${{ inputs.CANARY_ERROR_THRESHOLD }}
      REPO_NAME: ${{ github.event.repository.name }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  canary_promote:
    name: canary promote
    runs-on: ubuntu-latest
    if: inputs.CANARY_DISABLED != 'true'
    needs:
    - canary_verify
    steps:
    - uses: actions/checkout@v4
    - *id001
    - name: canary promote
      run: |
        echo "🚀 Promoviendo canary a producción..."
        kubectl set image deployment/${REPO_NAME} app=${REGISTRY}/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest} -n "${K8S_NAMESPACE}"

        echo "⏳ Esperando rollout de producción..."
        kubectl rollout status deployment/${REPO_NAME} -n "${K8S_NAMESPACE}" --timeout=300s

        echo "🗑️ Eliminando deployment canary..."
        kubectl delete deployment ${REPO_NAME}-canary -n "${K8S_NAMESPACE}" --ignore-not-found=true

        echo "✅ Canary promovido exitosamente."
        kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${REPO_NAME}"
    env:
      CANARY_DISABLED: ${{ inputs.CANARY_DISABLED }}
      CANARY_WEIGHT: ${{ inputs.CANARY_WEIGHT }}
      CANARY_VERIFY_TIMEOUT: ${{ inputs.CANARY_VERIFY_TIMEOUT }}
      K8S_NAMESPACE: ${{ inputs.K8S_NAMESPACE }}
      CANARY_REPLICAS: ${{ inputs.CANARY_REPLICAS }}
      CANARY_HEALTH_URL: ${{ inputs.CANARY_HEALTH_URL }}
      CANARY_ERROR_THRESHOLD: ${{ inputs.CANARY_ERROR_THRESHOLD }}
      REGISTRY: ghcr.io
      REPO_NAME: ${{ github.event.repository.name }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  canary_rollback:
    name: canary rollback
    runs-on: ubuntu-latest
    if: always() && inputs.CANARY_DISABLED != 'true' && (needs.canary_verify.result == 'failure' || needs.canary_deploy.result == 'failure')
    steps:
    - uses: actions/checkout@v4
    - *id001
    - name: canary rollback
      run: |
        echo "🔙 Rollback: eliminando canary..."
        kubectl delete deployment ${REPO_NAME}-canary -n "${K8S_NAMESPACE}" --ignore-not-found=true
        echo "✅ Canary eliminado. Tráfico 100% en versión estable."
        kubectl get pods -n "${K8S_NAMESPACE}" -l "app=${REPO_NAME}"
    env:
      CANARY_DISABLED: ${{ inputs.CANARY_DISABLED }}
      CANARY_WEIGHT: ${{ inputs.CANARY_WEIGHT }}
      CANARY_VERIFY_TIMEOUT: ${{ inputs.CANARY_VERIFY_TIMEOUT }}
      K8S_NAMESPACE: ${{ inputs.K8S_NAMESPACE }}
      CANARY_REPLICAS: ${{ inputs.CANARY_REPLICAS }}
      CANARY_HEALTH_URL: ${{ inputs.CANARY_HEALTH_URL }}
      CANARY_ERROR_THRESHOLD: ${{ inputs.CANARY_ERROR_THRESHOLD }}
      REPO_NAME: ${{ github.event.repository.name }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    needs:
    - canary_deploy
    - canary_verify
on:
  workflow_call:
    inputs:
      CANARY_DISABLED:
        description: CANARY_DISABLED
        required: false
        type: string
        default: 'false'
      CANARY_WEIGHT:
        description: CANARY_WEIGHT
        required: false
        type: string
        default: '20'
      CANARY_VERIFY_TIMEOUT:
        description: CANARY_VERIFY_TIMEOUT
        required: false
        type: string
        default: '120'
      K8S_NAMESPACE:
        description: K8S_NAMESPACE
        required: false
        type: string
        default: default
      CANARY_REPLICAS:
        description: CANARY_REPLICAS
        required: false
        type: string
        default: '1'
      CANARY_HEALTH_URL:
        description: CANARY_HEALTH_URL
        required: false
        type: string
        default: ''
      CANARY_ERROR_THRESHOLD:
        description: CANARY_ERROR_THRESHOLD
        required: false
        type: string
        default: '5'
      IMAGE_TAG:
        description: Tag de la imagen a desplegar en ghcr.io/<repo>
        required: false
        type: string
        default: latest
    secrets:
      KUBE_CONFIG:
        description: kubeconfig en base64 con permisos de deploy
        required: true
