name: 03 Start Docker Matrix Child

on:
  workflow_call:
    inputs:
      SERVICE_PATH:
        description: 'Directorio del microservicio'
        required: false
        type: string
        default: '.'
      SERVICE_NAME:
        description: 'Nombre del microservicio'
        required: false
        type: string
        default: ''
      SERVICE_LANG:
        description: 'Lenguaje del microservicio (go, python, js, java-maven, java-gradle)'
        required: false
        type: string
        default: 'unknown'
      GITOPS_TARGET_ENV:
        description: 'Entorno objetivo para GitOps (DEV, STG, PROD)'
        required: false
        type: string
        default: 'PROD'
      TARGET_ENVIRONMENT:
        description: 'GitHub Environment (development, staging, production)'
        required: false
        type: string
        default: 'production'
    secrets:
      GITHUB_TOKEN:
        required: false
      GITLAB_TOKEN:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      DEFECTDOJO_API_KEY:
        required: false
      DEFECTDOJO_URL:
        required: false
      GITOPS_DEPLOY_KEY:
        required: false
      LLM_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

jobs:
  lint_and_test:
    name: 🧪 Test & Lint [${{ inputs.SERVICE_NAME || inputs.SERVICE_PATH }}]
    uses: grs89/github-template/.github/workflows/shared-lint-test.yml@main
    with:
      CONTEXT_DIR: ${{ inputs.SERVICE_PATH || '.' }}
      DETECTED_LANG: ${{ inputs.SERVICE_LANG || 'unknown' }}

  security_scan:
    name: 🛡️ SAST & SCA Scan [${{ inputs.SERVICE_NAME || inputs.SERVICE_PATH }}]
    needs: lint_and_test
    uses: grs89/github-template/.github/workflows/shared-security-scan.yml@main
    with:
      CONTEXT_DIR: ${{ inputs.SERVICE_PATH || '.' }}

  llm_security:
    name: 🤖 LLM Security [${{ inputs.SERVICE_NAME || inputs.SERVICE_PATH }}]
    needs: lint_and_test
    uses: grs89/github-template/.github/workflows/security-llm-security.yml@main
    with:
      SERVICE_PATH: ${{ inputs.SERVICE_PATH || '.' }}
      SERVICE_NAME: ${{ inputs.SERVICE_NAME }}
    secrets: inherit

  build_and_push:
    name: 🏗️ Docker Build & Sign [${{ inputs.SERVICE_NAME || inputs.SERVICE_PATH }}]
    needs: [security_scan, llm_security]
    uses: grs89/github-template/.github/workflows/shared-build-push.yml@main
    with:
      CONTEXT_DIR: ${{ inputs.SERVICE_PATH || '.' }}
      SERVICE_NAME: ${{ inputs.SERVICE_NAME }}
    secrets: inherit

  gitops_deploy:
    name: 🚀 GitOps Deploy [${{ inputs.TARGET_ENVIRONMENT || 'production' }}]
    needs: build_and_push
    if: success() && !contains(fromJSON('["refs/heads/feature", "refs/heads/fix"]'), github.ref)
    uses: grs89/github-template/.github/workflows/deploy-gitops-deploy.yml@main
    with:
      SERVICE_PATH: ${{ inputs.SERVICE_PATH || '.' }}
      SERVICE_NAME: ${{ inputs.SERVICE_NAME }}
      GITOPS_TARGET_ENV: ${{ inputs.GITOPS_TARGET_ENV || 'PROD' }}
      TARGET_ENVIRONMENT: ${{ inputs.TARGET_ENVIRONMENT || 'production' }}
    secrets: inherit

  generate_report:
    name: 📊 Reporte Ejecutivo & Badges
    needs: [build_and_push, gitops_deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: 📥 Descargar Todos los Reportes JSON
        uses: actions/download-artifact@v4
        with:
          path: ./all-reports
        continue-on-error: true

      - name: 📄 Consolidar Reporte Ejecutivo PDF y HTML
        shell: bash
        env:
          SERVICE_NAME: ${{ inputs.SERVICE_NAME || github.event.repository.name }}
          SERVICE_PATH: ${{ inputs.SERVICE_PATH || '.' }}
        run: |
          mkdir -p artifacts_report
          find ./all-reports -type f -name "*.json" -exec cp -f {} . \; 2>/dev/null || true
          
          if [ -f ".github/utilidades/generate_report.py" ]; then
            pip install jinja2 weasyprint --quiet 2>/dev/null || true
            python3 .github/utilidades/generate_report.py || true
          fi

      - name: Subir Reporte Ejecutivo
        uses: actions/upload-artifact@v4
        with:
          name: executive-security-report-${{ inputs.SERVICE_NAME || 'app' }}
          path: |
            *.pdf
            *.html
          if-no-files-found: ignore

  cleanup_registry:
    name: 🧹 Cleanup GHCR
    needs: [build_and_push, gitops_deploy]
    if: always()
    uses: grs89/github-template/.github/workflows/utilities-cleanup-ghcr.yml@main
    secrets: inherit
