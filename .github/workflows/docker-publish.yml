name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      CONTEXT_DIR:
        description: 'Directorio del código fuente para detección de versión (eg. pom.xml)'
        required: false
        default: '.'
        type: string
      DOCKERFILE_PATH:
        description: 'Ruta relativa al Dockerfile (ej. ./Dockerfile o ./mi_app/Dockerfile)'
        required: false
        default: './Dockerfile'
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_REPO:
        required: true
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-language:
    name: 🔍 Detect Language & Context
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      detected_lang: ${{ steps.detect.outputs.detected_lang }}
      repo_lc:       ${{ steps.detect.outputs.repo_lc }}
      image_tag:     ${{ steps.detect.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect language and prepare metadata
        id: detect
        env:
          DH_REPO: ${{ secrets.DOCKERHUB_REPO }}
        run: |
          echo "🔍 Detectando lenguaje del proyecto..."
          LANG="unknown"
          if [ -f "go.mod" ]; then
            LANG="go"
          elif [ -f "pom.xml" ]; then
            LANG="java-maven"
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            LANG="java-gradle"
          elif [ -f "package.json" ]; then
            LANG="js"
          elif [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            LANG="python"
          fi
          echo "✅ Lenguaje detectado: $LANG"
          echo "detected_lang=${LANG}" >> "$GITHUB_OUTPUT"

          RAW_REPO="${{ github.repository }}"
          REPO_LC="${RAW_REPO,,}"
          REPO_LC="${REPO_LC// /}"
          
          if echo "$DH_REPO" | grep -q '[[:alnum:]]'; then
            # Convertir el repositorio de Docker Hub provisto a minúsculas
            DH_REPO_LC="${DH_REPO,,}"
            echo "repo_lc=${DH_REPO_LC// /}" >> "$GITHUB_OUTPUT"
            echo "DEBUG: Usando DOCKERHUB_REPO provisto: ${DH_REPO_LC// /}"
          else
            echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
            echo "DEBUG: DOCKERHUB_REPO vacio o no provisto. Usando fallback: ${REPO_LC}"
          fi

          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

  lint-and-test:
    name: 🧹 Lint & 🧪 Test
    needs: detect-language
    uses: grs89/github-template/.github/workflows/shared-lint-test.yml@v2
    with:
      DETECTED_LANG: ${{ needs.detect-language.outputs.detected_lang }}
      CONTEXT_DIR: ${{ inputs.CONTEXT_DIR || '.' }}
    secrets: inherit

  build-and-push:
    name: 🏗️ Build, Push & Sign
    needs: 
      - detect-language
      - lint-and-test
    uses: grs89/github-template/.github/workflows/shared-build-push.yml@v2
    with:
      DETECTED_LANG: ${{ needs.detect-language.outputs.detected_lang }}
      IMAGE_TAG: ${{ needs.detect-language.outputs.image_tag }}
      REPO_LC: ${{ needs.detect-language.outputs.repo_lc }}
      CONTEXT_DIR: ${{ inputs.CONTEXT_DIR || '.' }}
      DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH || './Dockerfile' }}
      REGISTRY: 'docker.io'
      PLATFORMS: 'linux/amd64,linux/arm64'
    secrets:
      REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

  security-scan:
    name: 🔐 Security Scan & Reports
    needs:
      - detect-language
      - build-and-push
    uses: grs89/github-template/.github/workflows/shared-security-scan.yml@v2
    with:
      CONTEXT_DIR: ${{ inputs.CONTEXT_DIR || '.' }}
      IMAGE_TAG: ${{ needs.detect-language.outputs.image_tag }}
      REPO_LC: ${{ needs.detect-language.outputs.repo_lc }}
      REGISTRY: 'docker.io'
    secrets:
      REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}

  create-release:
    name: 🚀 Create GitHub Release
    needs:
      - detect-language
      - build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog & Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
