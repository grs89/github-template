name: Doc Project Scaffold
permissions:
  contents: write
jobs:
  project_scaffold:
    name: project scaffold
    runs-on: ubuntu-latest
    if: inputs.SCAFFOLD_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.SCAFFOLD_TOKEN || github.token }}
    - name: Scaffold del proyecto
      run: |
        if [ "$SCAFFOLD_DISABLED" = "true" ]; then
          echo "⏭️ Scaffold deshabilitado. Omitiendo."
          exit 0
        fi

        echo "═══════════════════════════════════"
        echo "🏗️ Project Scaffold Generator"
        echo "  📦 Proyecto: ${SCAFFOLD_NAME}"
        echo "  🔤 Lenguaje: ${SCAFFOLD_LANG:-auto-detect}"
        echo "═══════════════════════════════════"

        if [ -z "$SCAFFOLD_LANG" ]; then
          if [ -f "go.mod" ]; then SCAFFOLD_LANG="go"
          elif [ -f "package.json" ]; then SCAFFOLD_LANG="js"
          elif [ -f "pom.xml" ]; then SCAFFOLD_LANG="java-maven"
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then SCAFFOLD_LANG="java-gradle"
          elif [ -f "pyproject.toml" ] || [ -f "requirements.txt" ]; then SCAFFOLD_LANG="python"
          else SCAFFOLD_LANG="generic"
          fi
          echo "🔍 Lenguaje detectado: ${SCAFFOLD_LANG}"
        fi

        WORKFLOW_FILE=".github/workflows/ci-cd.yml"
        if [ ! -f "$WORKFLOW_FILE" ] || [ "$SCAFFOLD_FORCE" = "true" ]; then
          echo "📝 Generando ${WORKFLOW_FILE}..."
          mkdir -p .github/workflows
          cat > "$WORKFLOW_FILE" <<'EOF'
        name: CI/CD DevSecOps Pipeline

        on:
          push:
            branches: [main, master, dev, development, stg, staging, qa]
            tags: ['v*']
          pull_request:
            branches: [main, master, dev, development, stg, staging, qa]
          workflow_dispatch:

        jobs:
          pipeline:
            uses: grs89/github-template/.github/workflows/03-start-init.yml@main
            secrets: inherit
        EOF
          echo "  ✅ ${WORKFLOW_FILE} creado (el router 03-start-init detecta el lenguaje: ${SCAFFOLD_LANG})"
        else
          echo "  ℹ️ ${WORKFLOW_FILE} ya existe"
        fi

        if [ ! -f "Dockerfile" ] || [ "$SCAFFOLD_FORCE" = "true" ]; then
          echo "🐳 Generando Dockerfile..."
          case "$SCAFFOLD_LANG" in
            go)
              cat > Dockerfile <<EOF
        FROM golang:1.22-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 go build -ldflags="-s -w" -o /app/server .

        FROM alpine:latest
        RUN apk add --no-cache ca-certificates tzdata
        COPY --from=builder /app/server /usr/local/bin/server
        EXPOSE 8080
        CMD ["server"]
        EOF
              ;;
            js)
              cat > Dockerfile <<EOF
        FROM node:22-alpine AS builder
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci --only=production
        COPY . .
        RUN npm run build 2>/dev/null || true

        FROM node:22-alpine
        WORKDIR /app
        COPY --from=builder /app .
        EXPOSE 3000
        CMD ["node", "dist/main.js"]
        EOF
              ;;
            python)
              cat > Dockerfile <<EOF
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.txt ./
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8000
        CMD ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
        EOF
              ;;
            java-*)
              cat > Dockerfile <<EOF
        FROM eclipse-temurin:21-jdk-alpine AS builder
        WORKDIR /app
        COPY . .
        RUN ./mvnw package -DskipTests 2>/dev/null || mvn package -DskipTests

        FROM eclipse-temurin:21-jre-alpine
        COPY --from=builder /app/target/*.jar /app/app.jar
        EXPOSE 8080
        CMD ["java", "-jar", "/app/app.jar"]
        EOF
              ;;
            *)
              cat > Dockerfile <<EOF
        FROM alpine:latest
        WORKDIR /app
        COPY . .
        EXPOSE 8080
        CMD ["./start.sh"]
        EOF
              ;;
          esac
          echo "  ✅ Dockerfile creado"
        else
          echo "  ℹ️ Dockerfile ya existe"
        fi

        if [ ! -f ".gitignore" ] || [ "$SCAFFOLD_FORCE" = "true" ]; then
          echo "📄 Generando .gitignore..."
          cat > .gitignore <<EOF
        # IDE
        .idea/
        .vscode/
        *.swp
        *.swo
        .DS_Store

        # Build
        dist/
        build/
        target/
        *.exe
        *.dll
        *.so
        *.dylib

        # Env
        .env
        .env.local
        *.env

        # Logs
        *.log
        logs/
        EOF

          case "$SCAFFOLD_LANG" in
            go)
              cat >> .gitignore <<EOF

        # Go
        vendor/
        *.test
        coverage.out
        EOF
              ;;
            js)
              cat >> .gitignore <<EOF

        # Node.js
        node_modules/
        .npm/
        coverage/
        .next/
        .nuxt/
        EOF
              ;;
            python)
              cat >> .gitignore <<EOF

        # Python
        __pycache__/
        *.py[cod]
        .venv/
        venv/
        *.egg-info/
        .pytest_cache/
        coverage.xml
        EOF
              ;;
            java-*)
              cat >> .gitignore <<EOF

        # Java
        target/
        .gradle/
        build/
        *.class
        *.jar
        *.war
        EOF
              ;;
          esac
          echo "  ✅ .gitignore creado"
        else
          echo "  ℹ️ .gitignore ya existe"
        fi

        if [ ! -f ".dockerignore" ] || [ "$SCAFFOLD_FORCE" = "true" ]; then
          echo "📄 Generando .dockerignore..."
          cat > .dockerignore <<EOF
        .git
        .gitignore
        .github/
        README.md
        CHANGELOG.md
        docker-compose*.yml
        .env*
        .idea/
        .vscode/
        node_modules/
        coverage/
        __pycache__/
        .pytest_cache/
        target/
        build/
        *.md
        EOF
          echo "  ✅ .dockerignore creado"
        fi

        if [ ! -f "version.yml" ] || [ "$SCAFFOLD_FORCE" = "true" ]; then
          echo "📄 Generando version.yml..."
          cat > version.yml <<EOF
        version: "1.0.0"
        EOF
          echo "  ✅ version.yml creado"
        fi

        echo ""
        echo "═══════════════════════════════════"
        echo "✅ Scaffold completado para: ${SCAFFOLD_LANG}"
        echo "  Archivos generados/verificados:"
        for F in .github/workflows/ci-cd.yml Dockerfile .gitignore .dockerignore version.yml; do
          if [ -f "$F" ]; then
            echo "    ✅ ${F}"
          else
            echo "    ❌ ${F} (no generado)"
          fi
        done
        echo "═══════════════════════════════════"

        if [ "$SCAFFOLD_FORCE" = "push" ]; then
          echo "📤 Commiteando archivos de scaffold..."
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .github/workflows/ci-cd.yml Dockerfile .gitignore .dockerignore version.yml 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "chore: scaffold proyecto ${SCAFFOLD_LANG}"
            # Tocar .github/workflows requiere un PAT con scope "workflow" (secret SCAFFOLD_TOKEN).
            git push origin "HEAD:${GITHUB_REF_NAME}" \
              && echo "✅ Archivos pusheados exitosamente." \
              || echo "⚠️ No se pudo hacer push (revisa permisos / protección de rama)."
          }
        fi
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: project_scaffold-artifacts
        path: |-
          .github/workflows/ci-cd.yml
          Dockerfile
          .gitignore
          .dockerignore
          version.yml
        if-no-files-found: ignore
      if: always()
    env:
      SCAFFOLD_DISABLED: ${{ inputs.SCAFFOLD_DISABLED }}
      SCAFFOLD_LANG: ${{ inputs.SCAFFOLD_LANG }}
      SCAFFOLD_NAME: ${{ inputs.SCAFFOLD_NAME }}
      SCAFFOLD_FORCE: ${{ inputs.SCAFFOLD_FORCE }}
      REPO_ID: ${{ github.repository_id }}
on:
  workflow_call:
    inputs:
      SCAFFOLD_DISABLED:
        description: SCAFFOLD_DISABLED
        required: false
        type: string
        default: 'false'
      SCAFFOLD_LANG:
        description: SCAFFOLD_LANG
        required: false
        type: string
        default: ''
      SCAFFOLD_NAME:
        description: SCAFFOLD_NAME
        required: false
        type: string
        default: ''
      SCAFFOLD_FORCE:
        description: SCAFFOLD_FORCE
        required: false
        type: string
        default: 'false'
    secrets:
      SCAFFOLD_TOKEN:
        description: PAT con scope workflow (solo si SCAFFOLD_FORCE=push y se genera .github/workflows)
        required: false
