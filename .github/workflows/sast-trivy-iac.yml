name: SAST Trivy IaC

on:
  workflow_call:
    inputs:
      SCAN_PATH:
        description: 'Ruta a escanear'
        required: false
        type: string
        default: '.'
      TRIVY_SEVERITY:
        description: 'Severidades a reportar'
        required: false
        type: string
        default: 'HIGH,CRITICAL'
      UPLOAD_SARIF:
        description: 'Publicar SARIF en GitHub Code Scanning (requiere GHAS o repo público)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trivy_iac_scan:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config (JSON)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.SCAN_PATH }}
          format: json
          output: trivy-iac-report.json
          severity: ${{ inputs.TRIVY_SEVERITY }}
          exit-code: '0'

      - name: Trivy config (SARIF)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.SCAN_PATH }}
          format: sarif
          output: trivy-iac.sarif
          severity: ${{ inputs.TRIVY_SEVERITY }}
          exit-code: '0'

      - name: Subir SARIF a Code Scanning
        if: inputs.UPLOAD_SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-iac-report
          path: |
            trivy-iac-report.json
            trivy-iac.sarif
          if-no-files-found: ignore
