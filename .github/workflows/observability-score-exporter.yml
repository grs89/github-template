name: Observability Score Exporter

# Exporta a Prometheus Pushgateway el health score y las vulnerabilidades del reporte de seguridad consolidado.

on:
  workflow_call:
    inputs:
      PUSHGATEWAY_URL:
        description: 'URL de la Pushgateway (vacío = no exporta)'
        required: false
        type: string
        default: ''
      DORA_ENV:
        description: 'Etiqueta env de las métricas'
        required: false
        type: string
        default: 'production'
      REPORTS_ARTIFACT_PATTERN:
        description: 'Patrón del artefacto que contiene security-report.json'
        required: false
        type: string
        default: '*report*'
      TEMPLATE_PROJECT:
        description: 'Repo de plantillas que contiene scripts/export_metrics.py'
        required: false
        type: string
        default: 'grs89/github-template'
      TEMPLATE_REF:
        description: 'Rama o tag del repo de plantillas'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  export_metrics:
    name: Exportar métricas
    runs-on: ubuntu-latest
    if: inputs.PUSHGATEWAY_URL != ''
    env:
      PUSHGATEWAY_URL: ${{ inputs.PUSHGATEWAY_URL }}
      DORA_ENV: ${{ inputs.DORA_ENV }}
      GH_TOKEN: ${{ github.token }}
      TEMPLATE_PROJECT: ${{ inputs.TEMPLATE_PROJECT }}
      TEMPLATE_REF: ${{ inputs.TEMPLATE_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ inputs.REPORTS_ARTIFACT_PATTERN }}
          merge-multiple: true

      - name: Exportar
        run: |
          # Sin un reporte válido no se exporta nada: export_metrics.py publicaría nota "A" y 0 vulnerabilidades
          if ! jq -e '.health_score.grade and .summary' security-report.json >/dev/null 2>&1; then
            echo "::warning::security-report.json no existe o no tiene health_score/summary: no se exportan métricas."
            exit 0
          fi
          SCORE_GRADE=$(jq -r '.health_score.grade' security-report.json)
          SCORE_PENALTY=$(jq -r '.health_score.penalty // 0' security-report.json)
          VULN_CRITICAL=$(jq -r '.summary.critical // 0' security-report.json)
          VULN_HIGH=$(jq -r '.summary.high // 0' security-report.json)
          VULN_MEDIUM=$(jq -r '.summary.medium // 0' security-report.json)
          VULN_LOW=$(jq -r '.summary.low // 0' security-report.json)
          export SCORE_GRADE SCORE_PENALTY VULN_CRITICAL VULN_HIGH VULN_MEDIUM VULN_LOW

          if [ -f scripts/export_metrics.py ]; then
            cp scripts/export_metrics.py "$RUNNER_TEMP/export_metrics.py"
          else
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_PROJECT}/contents/scripts/export_metrics.py?ref=${TEMPLATE_REF}" > "$RUNNER_TEMP/export_metrics.py" \
              || { echo "::warning::No se pudo obtener export_metrics.py"; exit 0; }
          fi
          python3 "$RUNNER_TEMP/export_metrics.py"
