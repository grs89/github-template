name: Security DAST ZAP

on:
  workflow_call:
    inputs:
      DAST_ZAP_DISABLED:
        description: 'Deshabilitar el escaneo DAST ZAP'
        required: false
        type: string
        default: 'false'
      DAST_ZAP_TARGET:
        description: 'URL objetivo (si está vacía se usa SITE_URL)'
        required: false
        type: string
        default: ''
      SITE_URL:
        description: 'URL del sitio, usada si DAST_ZAP_TARGET está vacía'
        required: false
        type: string
        default: ''
      DAST_ZAP_SCAN_TYPE:
        description: 'baseline, full o api'
        required: false
        type: string
        default: 'baseline'
      DAST_ZAP_EXTRA_ARGS:
        description: 'Argumentos extra para el script de ZAP'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dast_zap_scan:
    name: DAST ZAP
    runs-on: ubuntu-latest
    if: inputs.DAST_ZAP_DISABLED != 'true'
    steps:
      - name: Ejecutar ZAP
        env:
          TARGET: ${{ inputs.DAST_ZAP_TARGET || inputs.SITE_URL }}
          SCAN_TYPE: ${{ inputs.DAST_ZAP_SCAN_TYPE }}
          EXTRA_ARGS: ${{ inputs.DAST_ZAP_EXTRA_ARGS }}
        run: |
          [ -n "$TARGET" ] || { echo "❌ Ni DAST_ZAP_TARGET ni SITE_URL están definidas."; exit 1; }
          mkdir -p reports && chmod 777 reports
          case "$SCAN_TYPE" in
            baseline) SCRIPT=zap-baseline.py ;;
            full)     SCRIPT=zap-full-scan.py ;;
            api)      SCRIPT=zap-api-scan.py ;;
            *) echo "❌ Tipo de scan no válido: ${SCAN_TYPE}"; exit 1 ;;
          esac
          FORMAT=()
          [ "$SCAN_TYPE" = "api" ] && FORMAT=(-f openapi)
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            "$SCRIPT" -t "$TARGET" "${FORMAT[@]}" -J zap-report.json -r zap-report.html -I $EXTRA_ARGS || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: reports/
          if-no-files-found: ignore
