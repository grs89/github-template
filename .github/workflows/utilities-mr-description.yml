# Automatically generated by migrate_gitlab_to_github.py
# Please review the generated actions for correctness.

name: Utilities Mr Description
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  generate_mr_description:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$MR_DESC_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\uFE0F MR\
        \ description deshabilitado. Omitiendo.\"\n  exit 0\nfi\n\nif [ -z \"$CI_MERGE_REQUEST_IID\"\
        \ ]; then\n  echo \"\u2139\uFE0F No es un pipeline de Merge Request. Omitiendo.\"\
        \n  exit 0\nfi\n\napk add --no-cache curl jq git"
    - name: Run Script
      run: "echo \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\necho\
        \ \"\U0001F4DD Generador de MR Description\"\necho \"  \U0001F500 MR: !${CI_MERGE_REQUEST_IID}\"\
        \necho \"  \U0001F4CC Branch: ${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}\"\necho\
        \ \"\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\
        \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\"\n\necho \"\U0001F4CB\
        \ Obteniendo commits del MR...\"\nCOMMITS=$(curl -s --header \"JOB-TOKEN:\
        \ ${CI_JOB_TOKEN}\" \\\n  \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/commits?per_page=${MR_DESC_MAX_COMMITS}\"\
        )\n\nCOMMIT_COUNT=$(echo \"$COMMITS\" | jq length)\necho \"  \U0001F4CA Commits:\
        \ ${COMMIT_COUNT}\"\n\nFEATS=\"\"\nFIXES=\"\"\nREFACTORS=\"\"\nDOCS=\"\"\n\
        TESTS=\"\"\nCHORES=\"\"\nOTHERS=\"\"\n\nfor i in $(seq 0 $((COMMIT_COUNT -\
        \ 1))); do\n  MSG=$(echo \"$COMMITS\" | jq -r \".[$i].title\")\n  SHORT_SHA=$(echo\
        \ \"$COMMITS\" | jq -r \".[$i].short_id\")\n\n  case \"$MSG\" in\n    feat*|feature*|add*)\
        \   FEATS=\"${FEATS}\\n- ${MSG} (\\`${SHORT_SHA}\\`)\" ;;\n    fix*|bug*|hotfix*)\
        \     FIXES=\"${FIXES}\\n- ${MSG} (\\`${SHORT_SHA}\\`)\" ;;\n    refactor*|improve*)\
        \    REFACTORS=\"${REFACTORS}\\n- ${MSG} (\\`${SHORT_SHA}\\`)\" ;;\n    doc*|readme*)\
        \          DOCS=\"${DOCS}\\n- ${MSG} (\\`${SHORT_SHA}\\`)\" ;;\n    test*)\
        \                 TESTS=\"${TESTS}\\n- ${MSG} (\\`${SHORT_SHA}\\`)\" ;;\n\
        \    chore*|ci*|build*)     CHORES=\"${CHORES}\\n- ${MSG} (\\`${SHORT_SHA}\\\
        `)\" ;;\n    *)                     OTHERS=\"${OTHERS}\\n- ${MSG} (\\`${SHORT_SHA}\\\
        `)\" ;;\n  esac\ndone\n\necho \"\U0001F4C2 Obteniendo archivos modificados...\"\
        \nCHANGES=$(curl -s --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\" \\\n  \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/changes\"\
        )\n\nFILES_CHANGED=$(echo \"$CHANGES\" | jq '.changes | length' 2>/dev/null\
        \ || echo \"0\")\nADDITIONS=$(echo \"$CHANGES\" | jq '[.changes[].diff | split(\"\
        \\n\") | map(select(startswith(\"+\"))) | length] | add' 2>/dev/null || echo\
        \ \"0\")\nDELETIONS=$(echo \"$CHANGES\" | jq '[.changes[].diff | split(\"\\\
        n\") | map(select(startswith(\"-\"))) | length] | add' 2>/dev/null || echo\
        \ \"0\")\n\nDESC=\"## \U0001F4CB Resumen\\n\\n\"\nDESC=\"${DESC}> Auto-generado\
        \ por CI pipeline #${CI_PIPELINE_ID}\\n\\n\"\n\nif [ -n \"$FEATS\" ]; then\n\
        \  DESC=\"${DESC}### \U0001F680 Nuevas funcionalidades\\n${FEATS}\\n\\n\"\n\
        fi\nif [ -n \"$FIXES\" ]; then\n  DESC=\"${DESC}### \U0001F41B Correcciones\\\
        n${FIXES}\\n\\n\"\nfi\nif [ -n \"$REFACTORS\" ]; then\n  DESC=\"${DESC}###\
        \ \U0001F527 Refactoring\\n${REFACTORS}\\n\\n\"\nfi\nif [ -n \"$DOCS\" ];\
        \ then\n  DESC=\"${DESC}### \U0001F4DA Documentaci\xF3n\\n${DOCS}\\n\\n\"\n\
        fi\nif [ -n \"$TESTS\" ]; then\n  DESC=\"${DESC}### \U0001F9EA Tests\\n${TESTS}\\\
        n\\n\"\nfi\nif [ -n \"$CHORES\" ]; then\n  DESC=\"${DESC}### \u2699\uFE0F\
        \ Mantenimiento\\n${CHORES}\\n\\n\"\nfi\nif [ -n \"$OTHERS\" ]; then\n  DESC=\"\
        ${DESC}### \U0001F4DD Otros\\n${OTHERS}\\n\\n\"\nfi\n\n# Stats\nif [ \"$MR_DESC_ADD_STATS\"\
        \ = \"true\" ]; then\n  DESC=\"${DESC}---\\n\\n\"\n  DESC=\"${DESC}### \U0001F4CA\
        \ Estad\xEDsticas\\n\\n\"\n  DESC=\"${DESC}| M\xE9trica | Valor |\\n\"\n \
        \ DESC=\"${DESC}|---------|-------|\\n\"\n  DESC=\"${DESC}| Commits | ${COMMIT_COUNT}\
        \ |\\n\"\n  DESC=\"${DESC}| Archivos modificados | ${FILES_CHANGED} |\\n\"\
        \n  DESC=\"${DESC}| L\xEDneas a\xF1adidas | +${ADDITIONS:-0} |\\n\"\n  DESC=\"\
        ${DESC}| L\xEDneas eliminadas | -${DELETIONS:-0} |\\n\\n\"\nfi\n\n# Checklist\n\
        if [ \"$MR_DESC_ADD_CHECKLIST\" = \"true\" ]; then\n  DESC=\"${DESC}### \u2705\
        \ Checklist\\n\\n\"\n  DESC=\"${DESC}- [ ] C\xF3digo revisado\\n\"\n  DESC=\"\
        ${DESC}- [ ] Tests actualizados/a\xF1adidos\\n\"\n  DESC=\"${DESC}- [ ] Documentaci\xF3\
        n actualizada\\n\"\n  DESC=\"${DESC}- [ ] Sin breaking changes (o documentados)\\\
        n\"\n  DESC=\"${DESC}- [ ] Pipeline CI exitoso\\n\"\nfi\n\necho \"\U0001F4E4\
        \ Actualizando descripci\xF3n del MR...\"\nENCODED_DESC=$(printf '%s' \"$DESC\"\
        \ | jq -Rsa .)\n\ncurl -s --request PUT \\\n  --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\"\
        \ \\\n  --header \"Content-Type: application/json\" \\\n  --data \"{\\\"description\\\
        \": ${ENCODED_DESC}}\" \\\n  \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}\"\
        \ \\\n  > /dev/null\n\necho \"\u2705 Descripci\xF3n del MR actualizada.\"\n\
        \nif [ \"$MR_DESC_AUTO_LABEL\" = \"true\" ]; then\n  echo \"\U0001F3F7\uFE0F\
        \ Asignando labels autom\xE1ticas...\"\n  LABELS=\"\"\n\n  if [ -n \"$FEATS\"\
        \ ]; then LABELS=\"${LABELS},feature\"; fi\n  if [ -n \"$FIXES\" ]; then LABELS=\"\
        ${LABELS},bugfix\"; fi\n  if [ -n \"$DOCS\" ]; then LABELS=\"${LABELS},documentation\"\
        ; fi\n  if [ -n \"$REFACTORS\" ]; then LABELS=\"${LABELS},refactor\"; fi\n\
        \n  # Detectar tama\xF1o del MR\n  if [ \"${FILES_CHANGED:-0}\" -le 5 ] 2>/dev/null;\
        \ then\n    LABELS=\"${LABELS},size/S\"\n  elif [ \"${FILES_CHANGED:-0}\"\
        \ -le 15 ] 2>/dev/null; then\n    LABELS=\"${LABELS},size/M\"\n  else\n  \
        \  LABELS=\"${LABELS},size/L\"\n  fi\n\n  LABELS=$(echo \"$LABELS\" | sed\
        \ 's/^,//')\n\n  if [ -n \"$LABELS\" ]; then\n    curl -s --request PUT \\\
        \n      --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\" \\\n      --header \"Content-Type:\
        \ application/json\" \\\n      --data \"{\\\"add_labels\\\": \\\"${LABELS}\\\
        \"}\" \\\n      \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}\"\
        \ \\\n      > /dev/null\n    echo \"  \u2705 Labels: ${LABELS}\"\n  fi\nfi\n"
    container:
      image: ${MR_DESC_IMAGE}
    env:
      MR_DESC_MAX_COMMITS: '50'
      MR_DESC_ADD_STATS: 'true'
      MR_DESC_ADD_CHECKLIST: 'true'
      MR_DESC_AUTO_LABEL: 'true'
env:
  MR_DESC_DISABLED: 'false'
  MR_DESC_IMAGE: alpine:latest
