name: Utilities PR Description

# Genera/actualiza una sección automática en la descripción del Pull Request con los commits agrupados
# por tipo (conventional commits), estadísticas, checklist y labels. El texto escrito por la persona
# autora se conserva: solo se reemplaza el bloque entre los marcadores.

on:
  workflow_call:
    inputs:
      MR_DESC_DISABLED:
        description: 'Deshabilitar el generador'
        required: false
        type: string
        default: 'false'
      MR_DESC_MAX_COMMITS:
        description: 'Máximo de commits a listar'
        required: false
        type: string
        default: '50'
      MR_DESC_ADD_STATS:
        description: 'Agregar tabla de estadísticas'
        required: false
        type: string
        default: 'true'
      MR_DESC_ADD_CHECKLIST:
        description: 'Agregar checklist de revisión'
        required: false
        type: string
        default: 'true'
      MR_DESC_AUTO_LABEL:
        description: 'Asignar labels automáticos (feature, bugfix, size/*)'
        required: false
        type: string
        default: 'true'

permissions:
  contents: read
  pull-requests: write

jobs:
  generate_pr_description:
    name: Generar descripción del PR
    runs-on: ubuntu-latest
    if: inputs.MR_DESC_DISABLED != 'true' && github.event_name == 'pull_request'
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MR_DESC_MAX_COMMITS: ${{ inputs.MR_DESC_MAX_COMMITS }}
      MR_DESC_ADD_STATS: ${{ inputs.MR_DESC_ADD_STATS }}
      MR_DESC_ADD_CHECKLIST: ${{ inputs.MR_DESC_ADD_CHECKLIST }}
      MR_DESC_AUTO_LABEL: ${{ inputs.MR_DESC_AUTO_LABEL }}
    steps:
      - name: Construir y publicar descripción
        run: |
          set -euo pipefail
          PR_API="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"

          COMMITS=$(gh api "${PR_API}/commits?per_page=${MR_DESC_MAX_COMMITS}" \
            --jq '[.[] | {sha: .sha[0:7], title: (.commit.message | split("\n")[0])}]')
          COMMIT_COUNT=$(jq length <<< "$COMMITS")
          echo "📊 Commits: ${COMMIT_COUNT}"

          section() { # $1=titulo $2=regex de tipos
            local items
            items=$(jq -r --arg re "$2" '.[] | select(.title | test($re; "i")) | "- \(.title) (`\(.sha)`)"' <<< "$COMMITS")
            [ -n "$items" ] && printf '### %s\n\n%s\n\n' "$1" "$items"
            return 0
          }
          FEATS=$(section "🚀 Nuevas funcionalidades" '^(feat|feature|add)')
          FIXES=$(section "🐛 Correcciones" '^(fix|bug|hotfix)')
          REFACTORS=$(section "🔧 Refactoring" '^(refactor|improve)')
          DOCS=$(section "📚 Documentación" '^(doc|readme)')
          TESTS=$(section "🧪 Tests" '^(test)')
          CHORES=$(section "⚙️ Mantenimiento" '^(chore|ci|build)')
          OTHERS=$(jq -r '.[] | select(.title | test("^(feat|feature|add|fix|bug|hotfix|refactor|improve|doc|readme|test|chore|ci|build)"; "i") | not) | "- \(.title) (`\(.sha)`)"' <<< "$COMMITS")
          [ -n "$OTHERS" ] && OTHERS=$(printf '### 📝 Otros\n\n%s\n\n' "$OTHERS")

          read -r FILES ADDS DELS < <(gh api "$PR_API" --jq '"\(.changed_files) \(.additions) \(.deletions)"')

          BODY="## 📋 Resumen

          > Auto-generado por el workflow #${GITHUB_RUN_NUMBER}

          ${FEATS}${FIXES}${REFACTORS}${DOCS}${TESTS}${CHORES}${OTHERS}"
          BODY=$(sed 's/^          //' <<< "$BODY")

          if [ "$MR_DESC_ADD_STATS" = "true" ]; then
            BODY+=$(printf '\n---\n\n### 📊 Estadísticas\n\n| Métrica | Valor |\n|---------|-------|\n| Commits | %s |\n| Archivos modificados | %s |\n| Líneas añadidas | +%s |\n| Líneas eliminadas | -%s |\n' "$COMMIT_COUNT" "$FILES" "$ADDS" "$DELS")
          fi
          if [ "$MR_DESC_ADD_CHECKLIST" = "true" ]; then
            BODY+=$(printf '\n### ✅ Checklist\n\n- [ ] Código revisado\n- [ ] Tests actualizados/añadidos\n- [ ] Documentación actualizada\n- [ ] Sin breaking changes (o documentados)\n- [ ] Pipeline CI exitoso\n')
          fi

          START='<!-- auto-pr-description:start -->'
          END='<!-- auto-pr-description:end -->'
          CURRENT=$(gh api "$PR_API" --jq '.body // ""')
          # elimina el bloque automático previo y conserva el texto de la persona autora
          MANUAL=$(awk -v s="$START" -v e="$END" '$0==s{skip=1} !skip{print} $0==e{skip=0}' <<< "$CURRENT")
          printf '%s\n\n%s\n%s\n%s\n' "$MANUAL" "$START" "$BODY" "$END" > pr-body.md
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file pr-body.md
          echo "✅ Descripción del PR actualizada."

          if [ "$MR_DESC_AUTO_LABEL" = "true" ]; then
            LABELS=()
            [ -n "$FEATS" ] && LABELS+=(feature)
            [ -n "$FIXES" ] && LABELS+=(bugfix)
            [ -n "$DOCS" ] && LABELS+=(documentation)
            [ -n "$REFACTORS" ] && LABELS+=(refactor)
            if [ "$FILES" -le 5 ]; then LABELS+=(size/S); elif [ "$FILES" -le 15 ]; then LABELS+=(size/M); else LABELS+=(size/L); fi
            for L in "${LABELS[@]}"; do
              gh label create "$L" --repo "$GITHUB_REPOSITORY" --force >/dev/null 2>&1 || true
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$L"
            done
            echo "🏷️ Labels: ${LABELS[*]}"
          fi
