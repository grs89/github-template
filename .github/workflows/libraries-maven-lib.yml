name: Libraries Maven Lib

on:
  workflow_call:
    inputs:
      JAVA_VERSION:
        description: 'Versión de JDK (Temurin)'
        required: false
        type: string
        default: '17'
      MAVEN_OPTS:
        description: 'MAVEN_OPTS'
        required: false
        type: string
        default: '-Dorg.slf4j.simpleLogger.log.level=warn'
      MAVEN_CLI_OPTS:
        description: 'Flags de Maven'
        required: false
        type: string
        default: '--batch-mode --errors --fail-at-end --show-version'
      DEPLOY:
        description: 'Publicar en GitHub Packages (solo en ramas main/stg/dev/qa y tags)'
        required: false
        type: boolean
        default: true
      TEMPLATE_PROJECT:
        description: 'Repo de plantillas con .github/utilidades/generate_report.py'
        required: false
        type: string
        default: 'grs89/github-template'

permissions:
  contents: read

jobs:
  maven_test:
    name: Maven test
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: ${{ inputs.MAVEN_OPTS }}
      MAVEN_CLI_OPTS: ${{ inputs.MAVEN_CLI_OPTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.JAVA_VERSION }}
          cache: maven
      - name: mvn test
        # shellcheck disable=SC2086  # MAVEN_CLI_OPTS es una lista de flags
        run: mvn $MAVEN_CLI_OPTS clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  maven_build:
    name: Maven build
    runs-on: ubuntu-latest
    needs: maven_test
    env:
      MAVEN_OPTS: ${{ inputs.MAVEN_OPTS }}
      MAVEN_CLI_OPTS: ${{ inputs.MAVEN_CLI_OPTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.JAVA_VERSION }}
          cache: maven
      - name: mvn package
        run: mvn $MAVEN_CLI_OPTS clean package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: |
            **/target/*.jar
            **/target/*.war
          if-no-files-found: ignore

  maven_deploy:
    name: Maven deploy (GitHub Packages)
    runs-on: ubuntu-latest
    needs: maven_build
    if: inputs.DEPLOY && (startsWith(github.ref, 'refs/tags/') || contains(fromJSON('["main","stg","dev","qa"]'), github.ref_name))
    permissions:
      contents: read
      packages: write
    env:
      MAVEN_OPTS: ${{ inputs.MAVEN_OPTS }}
      MAVEN_CLI_OPTS: ${{ inputs.MAVEN_CLI_OPTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.JAVA_VERSION }}
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: mvn deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: mvn $MAVEN_CLI_OPTS deploy -DskipTests "-DaltDeploymentRepository=github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}"

  generate_security_report:
    name: Reporte de seguridad
    runs-on: ubuntu-latest
    needs: maven_test
    if: always() && needs.maven_test.result != 'skipped'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.TEMPLATE_PROJECT }}
          path: github-template-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generar reporte
        run: |
          pip install --quiet jinja2 weasyprint
          python3 github-template-utils/.github/utilidades/generate_report.py || echo "⚠️ generate_report.py falló"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: |
            *.html
            *.pdf
          if-no-files-found: ignore
