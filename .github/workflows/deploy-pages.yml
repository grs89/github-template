name: Deploy Pages
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "if [ \"$PAGES_ENABLED\" != \"true\" ]; then\n  echo \"\u23ED\uFE0F Publicaci\xF3\
        n de GitLab Pages deshabilitada.\"\n  exit 0\nfi\n\nif [ -f \"index.html\"\
        \ ]; then\n  echo \"\U0001F310 Sitio web est\xE1tico detectado (index.html\
        \ en la ra\xEDz). Preparando archivos...\"\n  mkdir -p .public_temp\n  \n\
        \  # Copiar de forma segura excluyendo la propia carpeta temporal y carpetas\
        \ internas/de sistema\n  cp -r $PAGES_STATIC_DIR/* .public_temp/ 2>/dev/null\
        \ || true\n  rm -rf .public_temp/public .public_temp/.git .public_temp/.gitlab-ci.yml\
        \ .public_temp/gitlab-templates\n  \n  # Mover al directorio oficial 'public'\n\
        \  rm -rf public\n  mv .public_temp public\n  echo \"\u2705 Sitio est\xE1\
        tico listo en la carpeta 'public/'\"\nelse\n  echo \"\U0001F4D6 Wiki/README\
        \ detectado. Iniciando compilaci\xF3n de documentaci\xF3n...\"\n  # La imagen\
        \ ya cuenta con Python3 y Curl preinstalados de forma nativa.\n  \n  # \U0001F4E5\
        \ Obtener el compilador premium de documentaci\xF3n\n  if [ -f \"scripts/generate_docs.py\"\
        \ ]; then\n    echo \"\u2705 Compilador local detectado.\"\n    cp scripts/generate_docs.py\
        \ compiler.py\n  else\n    echo \"\U0001F4E5 Descargando compilador de documentaci\xF3\
        n desde el repositorio de plantillas...\"\n    REF=\"${TEMPLATE_REF:-main}\"\
        \n    PROJECT=\"${TEMPLATE_PROJECT:-grs89/gitlab-templates}\"\n    GITLAB_URL=\"\
        ${CI_SERVER_URL}\"\n    \n    # Intentar obtener con autenticaci\xF3n\n  \
        \  if [ -n \"${CI_JOB_TOKEN}\" ]; then\n      API_URL=\"${GITLAB_URL}/api/v4/projects/${PROJECT//\\\
        //%2F}/repository/files/scripts%2Fgenerate_docs.py/raw?ref=${REF}\"\n    \
        \  echo \"\U0001F517 Descargando v\xEDa API: ${API_URL}\"\n      curl -sSL\
        \ --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\" --fail \"${API_URL}\" -o compiler.py\
        \ || true\n      \n      if [ ! -s compiler.py ]; then\n        RAW_URL=\"\
        ${GITLAB_URL}/${PROJECT}/-/raw/${REF}/scripts/generate_docs.py\"\n       \
        \ echo \"\U0001F517 Descargando v\xEDa URL raw: ${RAW_URL}\"\n        curl\
        \ -sSL --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\" --fail \"${RAW_URL}\" -o compiler.py\
        \ || true\n      fi\n    fi\n\n    # Fallback sin autenticaci\xF3n si no se\
        \ obtuvo\n    if [ ! -s compiler.py ]; then\n      echo \"\u26A0\uFE0F No\
        \ se obtuvo con token. Intentando descarga p\xFAblica...\"\n      curl -sSL\
        \ --fail \"${GITLAB_URL}/${PROJECT}/-/raw/${REF}/scripts/generate_docs.py\"\
        \ -o compiler.py || {\n        echo \"\u26A0\uFE0F Fall\xF3 descarga desde\
        \ la rama '$REF'. Intentando desde 'main'...\"\n        curl -sSL --fail \"\
        ${GITLAB_URL}/${PROJECT}/-/raw/main/scripts/generate_docs.py\" -o compiler.py\
        \ || true\n      }\n    fi\n  fi\n\n  # Verificaci\xF3n final del compilador\n\
        \  if [ ! -s compiler.py ]; then\n    echo \"\u274C ERROR: No se pudo obtener\
        \ generate_docs.py.\"\n    exit 1\n  fi\n  chmod +x compiler.py\n  \n  # \U0001F680\
        \ Ejecutar el compilador din\xE1mico\n  python3 compiler.py\n  \n  # \U0001F9F9\
        \ Limpiar archivo temporal\n  rm -f compiler.py\n  echo \"\u2705 Compilaci\xF3\
        n de documentaci\xF3n finalizada en 'public/'\"\nfi\n"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pages-artifacts
        path: public/
    container:
      image: ${REPORT_IMAGE}
    needs:
    - compile_presentations
  compile_presentations:
    runs-on: ubuntu-latest
    steps:
    - name: Run Script
      run: "echo \"\U0001F4E5 Preparando compiladores de PowerPoint...\"\nmkdir -p\
        \ scripts\nSCRIPTS_TO_DOWNLOAD=\"build_pptx.py\"\n\nfor script in $SCRIPTS_TO_DOWNLOAD;\
        \ do\n  if [ -f \"scripts/$script\" ]; then\n    echo \"\u2705 Script local\
        \ $script detectado.\"\n  else\n    echo \"\U0001F4E5 Descargando $script\
        \ desde el repositorio de plantillas...\"\n    REF=\"${TEMPLATE_REF:-main}\"\
        \n    PROJECT=\"${TEMPLATE_PROJECT:-grs89/gitlab-templates}\"\n    GITLAB_URL=\"\
        ${CI_SERVER_URL}\"\n    \n    # Intentar descargar con autenticaci\xF3n\n\
        \    if [ -n \"${CI_JOB_TOKEN}\" ]; then\n      API_URL=\"${GITLAB_URL}/api/v4/projects/${PROJECT//\\\
        //%2F}/repository/files/scripts%2F${script}/raw?ref=${REF}\"\n      curl -sSL\
        \ --header \"JOB-TOKEN: ${CI_JOB_TOKEN}\" --fail \"${API_URL}\" -o \"scripts/$script\"\
        \ || true\n    fi\n    \n    # Fallback sin autenticaci\xF3n\n    if [ ! -s\
        \ \"scripts/$script\" ]; then\n      curl -sSL --fail \"${GITLAB_URL}/${PROJECT}/-/raw/${REF}/scripts/${script}\"\
        \ -o \"scripts/$script\" || {\n        curl -sSL --fail \"${GITLAB_URL}/${PROJECT}/-/raw/main/scripts/${script}\"\
        \ -o \"scripts/$script\" || true\n      }\n    fi\n  fi\n  \n  if [ ! -s \"\
        scripts/$script\" ]; then\n    echo \"\u274C ERROR: No se pudo obtener scripts/$script.\"\
        \n    exit 1\n  fi\n  chmod +x \"scripts/$script\"\ndone\n\necho \"\U0001F4C1\
        \ Asegurando existencia del directorio public...\"\nmkdir -p public\n\n# \U0001F40D\
        \ Validar preinstalaci\xF3n de python-pptx (ID: python-pptx-fallback)\nif\
        \ ! python3 -c \"import pptx\" &>/dev/null; then\n  echo \"\u26A0\uFE0F python-pptx\
        \ no est\xE1 preinstalado en la imagen. Instal\xE1ndolo din\xE1micamente...\"\
        \n  pip install --no-cache-dir python-pptx\nelse\n  echo \"\u2705 python-pptx\
        \ ya est\xE1 preinstalado en la imagen.\"\nfi\n\n# \U0001F9DC\u200D\u2642\uFE0F\
        \ Instalar Mermaid CLI y Chromium din\xE1micamente para soportar diagramas\n\
        if ! command -v mmdc &>/dev/null; then\n  echo \"\u26A0\uFE0F Mermaid CLI\
        \ no detectado. Instalando NodeJS, Chromium y mmdc...\"\n  if command -v apk\
        \ &>/dev/null; then\n    apk add --no-cache nodejs npm chromium\n  elif command\
        \ -v apt-get &>/dev/null; then\n    apt-get update && apt-get install -y nodejs\
        \ npm chromium\n  fi\n  export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true\n  export\
        \ PUPPETEER_EXECUTABLE_PATH=$(which chromium || which chromium-browser)\n\
        \  npm install -g @mermaid-js/mermaid-cli\nfi\n\necho '{\"args\": [\"--no-sandbox\"\
        , \"--disable-setuid-sandbox\"]}' > puppeteer-config.json\n\n# \U0001F680\
        \ Ejecutar los compiladores de PowerPoint y portal interactivo HTML\nif [\
        \ -f \"scripts/build_pptx.py\" ]; then\n  echo \"\U0001F4CA Generando presentaci\xF3\
        n din\xE1mica de la Wiki...\"\n  python3 scripts/build_pptx.py\nfi\n"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compile_presentations-artifacts
        path: public/
    container:
      image: ${REPORT_IMAGE}
env:
  PAGES_ENABLED: 'true'
  PAGES_STATIC_DIR: .
  TEMPLATE_PROJECT: grs89/gitlab-templates
  REPORT_IMAGE: ${CI_REGISTRY}/${TEMPLATE_PROJECT}/security-report-generator:latest
