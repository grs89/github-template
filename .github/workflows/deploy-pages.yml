name: Deploy Pages

# Publica en GitHub Pages: sitio estático (index.html en la raíz) o wiki/README compilado
# (+ presentación PPTX/HTML). Requiere Settings > Pages > Source = "GitHub Actions".

on:
  workflow_call:
    inputs:
      PAGES_ENABLED:
        description: 'Publicar en GitHub Pages'
        required: false
        type: string
        default: 'true'
      PAGES_STATIC_DIR:
        description: 'Directorio a publicar cuando el repo es un sitio estático'
        required: false
        type: string
        default: '.'
      BUILD_PRESENTATIONS:
        description: 'Generar presentación PPTX/HTML de la wiki (scripts/build_pptx.py)'
        required: false
        type: boolean
        default: true
      TEMPLATE_PROJECT:
        description: 'Repositorio de plantillas que contiene scripts/'
        required: false
        type: string
        default: 'grs89/github-template'
      TEMPLATE_REF:
        description: 'Rama o tag del repositorio de plantillas'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    name: Compilar sitio
    runs-on: ubuntu-latest
    if: inputs.PAGES_ENABLED == 'true'
    env:
      GH_TOKEN: ${{ github.token }}
      TEMPLATE_PROJECT: ${{ inputs.TEMPLATE_PROJECT }}
      TEMPLATE_REF: ${{ inputs.TEMPLATE_REF }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_URL: ${{ github.event.repository.html_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Obtener scripts de compilación
        run: |
          mkdir -p scripts
          for script in generate_docs.py build_pptx.py; do
            if [ -f "scripts/$script" ]; then echo "✅ Script local $script"; continue; fi
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_PROJECT}/contents/scripts/${script}?ref=${TEMPLATE_REF}" > "scripts/$script" \
              || { echo "⚠️ No se pudo descargar $script"; rm -f "scripts/$script"; }
          done

      - name: Sitio estático o wiki
        env:
          PAGES_STATIC_DIR: ${{ inputs.PAGES_STATIC_DIR }}
        run: |
          if [ -f index.html ]; then
            echo "🌐 Sitio estático detectado."
            mkdir -p .public_temp
            rsync -a --exclude='.git' --exclude='.github' --exclude='public' --exclude='.public_temp' "${PAGES_STATIC_DIR%/}/" .public_temp/
            rm -rf public && mv .public_temp public
          else
            echo "📖 Wiki/README detectado. Compilando documentación..."
            [ -s scripts/generate_docs.py ] || { echo "❌ Falta scripts/generate_docs.py"; exit 1; }
            python3 scripts/generate_docs.py
          fi
          test -d public

      - name: Presentación de la wiki (PPTX + HTML)
        if: inputs.BUILD_PRESENTATIONS && hashFiles('scripts/build_pptx.py') != ''
        run: |
          pip install --quiet python-pptx
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json
          python3 scripts/build_pptx.py || echo "⚠️ build_pptx.py falló; se publica el sitio sin presentación."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  pages:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
