name: Security API Security

on:
  workflow_call:
    inputs:
      API_SEC_OPENAPI:
        description: 'Ruta local o URL del spec OpenAPI'
        required: true
        type: string
      API_SEC_TARGET_URL:
        description: 'URL base de la API desplegada a escanear'
        required: true
        type: string
      API_SEC_EXTRA_ARGS:
        description: 'Argumentos extra para zap-api-scan.py'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  api_security:
    name: API Security (ZAP API Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZAP API Scan (OpenAPI)
        env:
          OPENAPI: ${{ inputs.API_SEC_OPENAPI }}
          TARGET_URL: ${{ inputs.API_SEC_TARGET_URL }}
          EXTRA_ARGS: ${{ inputs.API_SEC_EXTRA_ARGS }}
        run: |
          mkdir -p zap-wrk && chmod 777 zap-wrk
          case "$OPENAPI" in
            http*) SPEC="$OPENAPI" ;;
            *) cp "$OPENAPI" zap-wrk/openapi-spec && SPEC="/zap/wrk/openapi-spec" ;;
          esac
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD/zap-wrk:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t "$SPEC" -f openapi -O "$TARGET_URL" \
            -J api-security-report.json -r api-security-report.html -I $EXTRA_ARGS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-security-report
          path: zap-wrk/
          if-no-files-found: ignore
