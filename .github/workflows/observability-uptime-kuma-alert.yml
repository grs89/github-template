name: Observability Uptime Kuma Alert
'on':
  workflow_call:
    inputs: {}
    secrets: {}
jobs:
  uptime_kuma_alert:
    runs-on: ubuntu-latest
    steps:
    - name: Before Script
      run: "if [ \"$UPTIME_KUMA_DISABLED\" = \"true\" ]; then\n  echo \"\u23ED\uFE0F\
        \ Uptime Kuma deshabilitado (UPTIME_KUMA_DISABLED=true)\"\n  exit 0\nfi\n\n\
        for VAR in UPTIME_KUMA_URL UPTIME_KUMA_API_KEY UPTIME_KUMA_MONITOR_NAME; do\n\
        \  eval VAL=\\$$VAR\n  if [ -z \"$VAL\" ]; then\n    echo \"\u274C ERROR:\
        \ $VAR no est\xE1 definida.\"\n    exit 1\n  fi\ndone\n\napk add --no-cache\
        \ curl jq"
    - name: Run Script
      run: "echo \"\U0001F43B Uptime Kuma \u2014 Acci\xF3n: ${UPTIME_KUMA_ACTION}\"\
        \necho \"   URL Base:  ${UPTIME_KUMA_URL}\"\necho \"   Monitor:   ${UPTIME_KUMA_MONITOR_NAME}\"\
        \necho \"\"\n\nBASE=\"${UPTIME_KUMA_URL%/}\"\nAUTH_HEADER=\"Authorization:\
        \ Bearer ${UPTIME_KUMA_API_KEY}\"\n\n# \u2500\u2500\u2500 Buscar monitor existente\
        \ por nombre \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\necho \"\U0001F50D Buscando monitor existente: ${UPTIME_KUMA_MONITOR_NAME}...\"\
        \nMONITORS=$(curl -s --max-time 15 \\\n  -H \"${AUTH_HEADER}\" \\\n  \"${BASE}/api/v1/monitor\"\
        \ 2>/dev/null || echo \"{}\")\n\nMONITOR_ID=$(echo \"${MONITORS}\" | jq -r\
        \ \\\n  --arg name \"${UPTIME_KUMA_MONITOR_NAME}\" \\\n  '.monitors[]? | select(.name\
        \ == $name) | .id' 2>/dev/null | head -1)\n\nif [ -n \"${MONITOR_ID}\" ];\
        \ then\n  echo \"\u2705 Monitor encontrado (ID: ${MONITOR_ID})\"\nelse\n \
        \ echo \"\u26A0\uFE0F Monitor no encontrado.\"\nfi\n\n# \u2500\u2500\u2500\
        \ Acciones disponibles \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\ncase \"${UPTIME_KUMA_ACTION}\" in\n\n\
        \  notify)\n    # Enviar un heartbeat / notification de deploy\n    echo \"\
        \U0001F4E3 Enviando notificaci\xF3n de deploy a Uptime Kuma...\"\n    PAYLOAD=$(jq\
        \ -nc \\\n      --arg title \"Deploy: ${CI_PROJECT_NAME}\" \\\n      --arg\
        \ msg \"Branch: ${{ github.ref_name }} | Commit: ${CI_COMMIT_SHORT_SHA} |\
        \ Pipeline: ${CI_PIPELINE_URL}\" \\\n      '{title: $title, message: $msg}')\n\
        \n    RESPONSE=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 15 \\\
        \n      -X POST \\\n      -H \"${AUTH_HEADER}\" \\\n      -H \"Content-Type:\
        \ application/json\" \\\n      -d \"${PAYLOAD}\" \\\n      \"${BASE}/api/v1/monitor/${MONITOR_ID}/notification\"\
        \ 2>/dev/null || echo \"000\")\n\n    if [ \"${RESPONSE}\" = \"200\" ] ||\
        \ [ \"${RESPONSE}\" = \"201\" ]; then\n      echo \"\u2705 Notificaci\xF3\
        n enviada (HTTP ${RESPONSE})\"\n    else\n      echo \"\u26A0\uFE0F Respuesta\
        \ inesperada (HTTP ${RESPONSE}). Puede que la API no soporte este endpoint.\"\
        \n    fi\n    ;;\n\n  create)\n    # Crear monitor si no existe\n    if [\
        \ -n \"${MONITOR_ID}\" ]; then\n      echo \"\u2139\uFE0F El monitor ya existe\
        \ (ID: ${MONITOR_ID}). No se crear\xE1 uno nuevo.\"\n    else\n      if [\
        \ -z \"${UPTIME_KUMA_TARGET_URL}\" ]; then\n        echo \"\u274C ERROR: UPTIME_KUMA_TARGET_URL\
        \ requerida para action=create\"\n        exit 1\n      fi\n      echo \"\u2795\
        \ Creando monitor: ${UPTIME_KUMA_MONITOR_NAME}...\"\n      PAYLOAD=$(jq -nc\
        \ \\\n        --arg name \"${UPTIME_KUMA_MONITOR_NAME}\" \\\n        --arg\
        \ type \"${UPTIME_KUMA_MONITOR_TYPE}\" \\\n        --arg url \"${UPTIME_KUMA_TARGET_URL}\"\
        \ \\\n        --argjson interval \"${UPTIME_KUMA_INTERVAL}\" \\\n        --arg\
        \ keyword \"${UPTIME_KUMA_KEYWORD}\" \\\n        '{name: $name, type: $type,\
        \ url: $url, interval: $interval, keyword: $keyword, active: true}')\n\n \
        \     RESPONSE=$(curl -s -w \"\\n%{http_code}\" --max-time 15 \\\n       \
        \ -X POST \\\n        -H \"${AUTH_HEADER}\" \\\n        -H \"Content-Type:\
        \ application/json\" \\\n        -d \"${PAYLOAD}\" \\\n        \"${BASE}/api/v1/monitor\"\
        \ 2>/dev/null)\n\n      HTTP_CODE=$(echo \"${RESPONSE}\" | tail -1)\n    \
        \  BODY=$(echo \"${RESPONSE}\" | head -1)\n      NEW_ID=$(echo \"${BODY}\"\
        \ | jq -r '.monitorID // .id // empty' 2>/dev/null)\n\n      if [ \"${HTTP_CODE}\"\
        \ = \"200\" ] || [ \"${HTTP_CODE}\" = \"201\" ]; then\n        echo \"\u2705\
        \ Monitor creado (ID: ${NEW_ID})\"\n      else\n        echo \"\u274C Error\
        \ al crear monitor (HTTP ${HTTP_CODE}): ${BODY}\"\n        exit 1\n      fi\n\
        \    fi\n    ;;\n\n  pause)\n    if [ -z \"${MONITOR_ID}\" ]; then\n     \
        \ echo \"\u274C No se encontr\xF3 el monitor '${UPTIME_KUMA_MONITOR_NAME}'\
        \ para pausar.\"\n      exit 1\n    fi\n    echo \"\u23F8\uFE0F Pausando monitor\
        \ (ID: ${MONITOR_ID})...\"\n    RESPONSE=$(curl -s -o /dev/null -w \"%{http_code}\"\
        \ --max-time 15 \\\n      -X PATCH \\\n      -H \"${AUTH_HEADER}\" \\\n  \
        \    -H \"Content-Type: application/json\" \\\n      -d '{\"active\": false}'\
        \ \\\n      \"${BASE}/api/v1/monitor/${MONITOR_ID}\" 2>/dev/null || echo \"\
        000\")\n    echo \"Respuesta: HTTP ${RESPONSE}\"\n    ;;\n\n  resume)\n  \
        \  if [ -z \"${MONITOR_ID}\" ]; then\n      echo \"\u274C No se encontr\xF3\
        \ el monitor '${UPTIME_KUMA_MONITOR_NAME}' para reanudar.\"\n      exit 1\n\
        \    fi\n    echo \"\u25B6\uFE0F Reanudando monitor (ID: ${MONITOR_ID})...\"\
        \n    RESPONSE=$(curl -s -o /dev/null -w \"%{http_code}\" --max-time 15 \\\
        \n      -X PATCH \\\n      -H \"${AUTH_HEADER}\" \\\n      -H \"Content-Type:\
        \ application/json\" \\\n      -d '{\"active\": true}' \\\n      \"${BASE}/api/v1/monitor/${MONITOR_ID}\"\
        \ 2>/dev/null || echo \"000\")\n    echo \"Respuesta: HTTP ${RESPONSE}\"\n\
        \    ;;\n\n  *)\n    echo \"\u274C Acci\xF3n desconocida: ${UPTIME_KUMA_ACTION}\"\
        \n    echo \"   Acciones v\xE1lidas: notify | create | pause | resume\"\n\
        \    exit 1\n    ;;\nesac\n\necho \"\"\necho \"\U0001F43B Uptime Kuma \u2014\
        \ \xA1Listo!\"\n"
    container:
      image: alpine:latest
env:
  UPTIME_KUMA_DISABLED: 'false'
  UPTIME_KUMA_URL: ''
  UPTIME_KUMA_API_KEY: ''
  UPTIME_KUMA_MONITOR_NAME: ''
  UPTIME_KUMA_TARGET_URL: ''
  UPTIME_KUMA_MONITOR_TYPE: http
  UPTIME_KUMA_INTERVAL: '60'
  UPTIME_KUMA_ACTION: notify
  UPTIME_KUMA_KEYWORD: ''
  UPTIME_KUMA_NOTIFY_ON: deploy
  RUNNER_TAG: docker
