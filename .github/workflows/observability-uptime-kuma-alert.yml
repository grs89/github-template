name: Observability Uptime Kuma Alert
on:
  workflow_call:
    inputs:
      UPTIME_KUMA_DISABLED:
        description: UPTIME_KUMA_DISABLED
        required: false
        type: string
        default: 'false'
      UPTIME_KUMA_URL:
        description: UPTIME_KUMA_URL
        required: false
        type: string
        default: ''
      UPTIME_KUMA_MONITOR_NAME:
        description: UPTIME_KUMA_MONITOR_NAME
        required: false
        type: string
        default: ''
      UPTIME_KUMA_TARGET_URL:
        description: UPTIME_KUMA_TARGET_URL
        required: false
        type: string
        default: ''
      UPTIME_KUMA_MONITOR_TYPE:
        description: UPTIME_KUMA_MONITOR_TYPE
        required: false
        type: string
        default: http
      UPTIME_KUMA_INTERVAL:
        description: UPTIME_KUMA_INTERVAL
        required: false
        type: string
        default: '60'
      UPTIME_KUMA_ACTION:
        description: UPTIME_KUMA_ACTION
        required: false
        type: string
        default: notify
      UPTIME_KUMA_KEYWORD:
        description: UPTIME_KUMA_KEYWORD
        required: false
        type: string
        default: ''
      UPTIME_KUMA_NOTIFY_ON:
        description: UPTIME_KUMA_NOTIFY_ON
        required: false
        type: string
        default: deploy
    secrets:
      UPTIME_KUMA_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  uptime_kuma_alert:
    name: uptime kuma alert
    runs-on: ubuntu-latest
    if: inputs.UPTIME_KUMA_DISABLED != 'true'
    steps:
    - uses: actions/checkout@v4
    - name: uptime kuma alert
      run: |
        if [ "$UPTIME_KUMA_DISABLED" = "true" ]; then
          echo "⏭️ Uptime Kuma deshabilitado (UPTIME_KUMA_DISABLED=true)"
          exit 0
        fi

        for VAR in UPTIME_KUMA_URL UPTIME_KUMA_API_KEY UPTIME_KUMA_MONITOR_NAME; do
          eval VAL=\$$VAR
          if [ -z "$VAL" ]; then
            echo "❌ ERROR: $VAR no está definida."
            exit 1
          fi
        done

        echo "🐻 Uptime Kuma — Acción: ${UPTIME_KUMA_ACTION}"
        echo "   URL Base:  ${UPTIME_KUMA_URL}"
        echo "   Monitor:   ${UPTIME_KUMA_MONITOR_NAME}"
        echo ""

        BASE="${UPTIME_KUMA_URL%/}"
        AUTH_HEADER="Authorization: Bearer ${UPTIME_KUMA_API_KEY}"

        # ─── Buscar monitor existente por nombre ─────────────────────────
        echo "🔍 Buscando monitor existente: ${UPTIME_KUMA_MONITOR_NAME}..."
        MONITORS=$(curl -s --max-time 15 \
          -H "${AUTH_HEADER}" \
          "${BASE}/api/v1/monitor" 2>/dev/null || echo "{}")

        MONITOR_ID=$(echo "${MONITORS}" | jq -r \
          --arg name "${UPTIME_KUMA_MONITOR_NAME}" \
          '.monitors[]? | select(.name == $name) | .id' 2>/dev/null | head -1)

        if [ -n "${MONITOR_ID}" ]; then
          echo "✅ Monitor encontrado (ID: ${MONITOR_ID})"
        else
          echo "⚠️ Monitor no encontrado."
        fi

        # ─── Acciones disponibles ─────────────────────────────────────────
        case "${UPTIME_KUMA_ACTION}" in

          notify)
            # Enviar un heartbeat / notification de deploy
            echo "📣 Enviando notificación de deploy a Uptime Kuma..."
            PAYLOAD=$(jq -nc \
              --arg title "Deploy: ${REPO_NAME}" \
              --arg msg "Branch: ${GITHUB_REF_NAME} | Commit: ${GITHUB_SHA:0:7} | Pipeline: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{title: $title, message: $msg}')

            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -X POST \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${BASE}/api/v1/monitor/${MONITOR_ID}/notification" 2>/dev/null || echo "000")

            if [ "${RESPONSE}" = "200" ] || [ "${RESPONSE}" = "201" ]; then
              echo "✅ Notificación enviada (HTTP ${RESPONSE})"
            else
              echo "⚠️ Respuesta inesperada (HTTP ${RESPONSE}). Puede que la API no soporte este endpoint."
            fi
            ;;

          create)
            # Crear monitor si no existe
            if [ -n "${MONITOR_ID}" ]; then
              echo "ℹ️ El monitor ya existe (ID: ${MONITOR_ID}). No se creará uno nuevo."
            else
              if [ -z "${UPTIME_KUMA_TARGET_URL}" ]; then
                echo "❌ ERROR: UPTIME_KUMA_TARGET_URL requerida para action=create"
                exit 1
              fi
              echo "➕ Creando monitor: ${UPTIME_KUMA_MONITOR_NAME}..."
              PAYLOAD=$(jq -nc \
                --arg name "${UPTIME_KUMA_MONITOR_NAME}" \
                --arg type "${UPTIME_KUMA_MONITOR_TYPE}" \
                --arg url "${UPTIME_KUMA_TARGET_URL}" \
                --argjson interval "${UPTIME_KUMA_INTERVAL}" \
                --arg keyword "${UPTIME_KUMA_KEYWORD}" \
                '{name: $name, type: $type, url: $url, interval: $interval, keyword: $keyword, active: true}')

              RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 15 \
                -X POST \
                -H "${AUTH_HEADER}" \
                -H "Content-Type: application/json" \
                -d "${PAYLOAD}" \
                "${BASE}/api/v1/monitor" 2>/dev/null)

              HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
              BODY=$(echo "${RESPONSE}" | head -1)
              NEW_ID=$(echo "${BODY}" | jq -r '.monitorID // .id // empty' 2>/dev/null)

              if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
                echo "✅ Monitor creado (ID: ${NEW_ID})"
              else
                echo "❌ Error al crear monitor (HTTP ${HTTP_CODE}): ${BODY}"
                exit 1
              fi
            fi
            ;;

          pause)
            if [ -z "${MONITOR_ID}" ]; then
              echo "❌ No se encontró el monitor '${UPTIME_KUMA_MONITOR_NAME}' para pausar."
              exit 1
            fi
            echo "⏸️ Pausando monitor (ID: ${MONITOR_ID})..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -X PATCH \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/json" \
              -d '{"active": false}' \
              "${BASE}/api/v1/monitor/${MONITOR_ID}" 2>/dev/null || echo "000")
            echo "Respuesta: HTTP ${RESPONSE}"
            ;;

          resume)
            if [ -z "${MONITOR_ID}" ]; then
              echo "❌ No se encontró el monitor '${UPTIME_KUMA_MONITOR_NAME}' para reanudar."
              exit 1
            fi
            echo "▶️ Reanudando monitor (ID: ${MONITOR_ID})..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -X PATCH \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/json" \
              -d '{"active": true}' \
              "${BASE}/api/v1/monitor/${MONITOR_ID}" 2>/dev/null || echo "000")
            echo "Respuesta: HTTP ${RESPONSE}"
            ;;

          *)
            echo "❌ Acción desconocida: ${UPTIME_KUMA_ACTION}"
            echo "   Acciones válidas: notify | create | pause | resume"
            exit 1
            ;;
        esac

        echo ""
        echo "🐻 Uptime Kuma — ¡Listo!"
    env:
      UPTIME_KUMA_DISABLED: ${{ inputs.UPTIME_KUMA_DISABLED }}
      UPTIME_KUMA_URL: ${{ inputs.UPTIME_KUMA_URL }}
      UPTIME_KUMA_MONITOR_NAME: ${{ inputs.UPTIME_KUMA_MONITOR_NAME }}
      UPTIME_KUMA_TARGET_URL: ${{ inputs.UPTIME_KUMA_TARGET_URL }}
      UPTIME_KUMA_MONITOR_TYPE: ${{ inputs.UPTIME_KUMA_MONITOR_TYPE }}
      UPTIME_KUMA_INTERVAL: ${{ inputs.UPTIME_KUMA_INTERVAL }}
      UPTIME_KUMA_ACTION: ${{ inputs.UPTIME_KUMA_ACTION }}
      UPTIME_KUMA_KEYWORD: ${{ inputs.UPTIME_KUMA_KEYWORD }}
      UPTIME_KUMA_NOTIFY_ON: ${{ inputs.UPTIME_KUMA_NOTIFY_ON }}
      UPTIME_KUMA_API_KEY: ${{ secrets.UPTIME_KUMA_API_KEY }}
      REPO_NAME: ${{ github.event.repository.name }}
