name: 03 Start IaC (Terraform)

on:
  workflow_call:
    inputs:
      TF_ROOT:
        description: 'Directorio raíz de Terraform'
        required: false
        type: string
        default: '.'
      TARGET_ENVIRONMENT:
        description: 'GitHub Environment (development, staging, production)'
        required: false
        type: string
        default: 'production'
    secrets:
      INFRACOST_API_KEY:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      ARM_CLIENT_ID:
        required: false
      ARM_CLIENT_SECRET:
        required: false
      ARM_SUBSCRIPTION_ID:
        required: false
      ARM_TENANT_ID:
        required: false

jobs:
  tf_validate_and_scan:
    name: 🏗️ Validar & Escanear IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_INFRACOST: ${{ secrets.INFRACOST_API_KEY != '' }}
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: 🔍 Validar Formato y Sintaxis
        shell: bash
        working-directory: ${{ inputs.TF_ROOT || '.' }}
        run: |
          terraform fmt -check || echo "⚠️ Advertencia: Código Terraform requiere formato."
          terraform init -backend=false
          terraform validate

      - name: 🛡️ Escanear IaC con Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'config'
          scan-ref: ${{ inputs.TF_ROOT || '.' }}
          format: 'json'
          output: 'trivy-iac-report.json'
        continue-on-error: true

      - name: 🛡️ Escanear IaC con Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.TF_ROOT || '.' }}
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
        continue-on-error: true

      - name: 💰 Infracost Cloud Cost Estimation (en PRs)
        if: github.event_name == 'pull_request' && env.HAS_INFRACOST == 'true'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Subir Reportes IaC
        uses: actions/upload-artifact@v4
        with:
          name: iac-security-reports
          path: |
            trivy-iac-report.json
            checkov-report.json
          if-no-files-found: ignore

  tf_plan:
    name: 📋 Terraform Plan [${{ inputs.TARGET_ENVIRONMENT || 'production' }}]
    needs: tf_validate_and_scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ inputs.TARGET_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: 📋 Terraform Init y Plan
        shell: bash
        working-directory: ${{ inputs.TF_ROOT || '.' }}
        run: |
          echo "Ejecutando Terraform Plan para entorno: ${IN_TARGET_ENVIRONMENT}"
          terraform init -backend=false
          # En pipelines reales con credenciales conectadas:
          # terraform plan -out=tfplan

        env:
          IN_TARGET_ENVIRONMENT: ${{ inputs.TARGET_ENVIRONMENT }}
  generate_report:
    name: 📊 Reporte Ejecutivo IaC
    needs: [tf_validate_and_scan, tf_plan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: 📥 Descargar Reportes IaC
        uses: actions/download-artifact@v4
        with:
          name: iac-security-reports
        continue-on-error: true

      - name: 📄 Renderizar Reporte Ejecutivo
        shell: bash
        run: |
          if [ -f ".github/utilidades/generate_report.py" ]; then
            pip install jinja2 weasyprint --quiet 2>/dev/null || true
            python3 .github/utilidades/generate_report.py || true
          fi

      - name: Subir Reporte Ejecutivo IaC
        uses: actions/upload-artifact@v4
        with:
          name: executive-iac-security-report
          path: |
            *.pdf
            *.html
          if-no-files-found: ignore
