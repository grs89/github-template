name: Quality MegaLinter

# Linter universal multi-lenguaje (MegaLinter).

on:
  workflow_call:
    inputs:
      MEGALINTER_FLAVOR:
        description: 'Flavor de MegaLinter (all, cupcake, python, javascript, java, go, terraform, ...)'
        required: false
        type: string
        default: 'cupcake'
      MEGALINTER_FAIL:
        description: 'true = los hallazgos fallan el job; false = solo reporte'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MegaLinter
        env:
          MEGALINTER_FLAVOR: ${{ inputs.MEGALINTER_FLAVOR }}
          MEGALINTER_FAIL: ${{ inputs.MEGALINTER_FAIL }}
        run: |
          docker run --rm \
            -e DISABLE_ERRORS="$([ "$MEGALINTER_FAIL" = "true" ] && echo false || echo true)" \
            -e VALIDATE_ALL_CODEBASE=true \
            -e REPORT_OUTPUT_FOLDER=/tmp/lint/megalinter-reports \
            -v "$PWD:/tmp/lint" \
            "oxsecurity/megalinter-${MEGALINTER_FLAVOR}:v8"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: megalinter-reports
          path: megalinter-reports
          if-no-files-found: ignore
