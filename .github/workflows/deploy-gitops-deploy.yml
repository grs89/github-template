name: Deploy GitOps

on:
  workflow_call:
    inputs:
      SERVICE_PATH:
        description: 'Ruta del microservicio'
        required: false
        type: string
        default: '.'
      SERVICE_NAME:
        description: 'Nombre del microservicio'
        required: false
        type: string
        default: ''
      GITOPS_TARGET_ENV:
        description: 'Entorno destino de GitOps (DEV, STG, PROD)'
        required: false
        type: string
        default: 'PROD'
      TARGET_ENVIRONMENT:
        description: 'GitHub Environment (development, staging, production)'
        required: false
        type: string
        default: 'production'
      IMAGE_TAG:
        description: 'Tag de la imagen a desplegar'
        required: false
        type: string
        default: ''
      GITOPS_INFRA_REPO:
        description: 'Repositorio GitOps destino'
        required: false
        type: string
        default: ''
      GITOPS_TARGET_DIR:
        description: 'Directorio explícito de despliegue en GitOps (opcional)'
        required: false
        type: string
        default: ''
    secrets:
      GITHUB_TOKEN:
        required: false
      GITOPS_DEPLOY_KEY:
        required: false
      GITLAB_TOKEN:
        required: false

jobs:
  gitops_deploy:
    name: 🚀 GitOps Deploy [${{ inputs.TARGET_ENVIRONMENT || 'production' }}]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.TARGET_ENVIRONMENT || 'production' }}
    steps:
      - name: Checkout Repositorio de la Aplicación
        uses: actions/checkout@v4

      - name: 🔑 Configurar Claves y Autenticación SSH/HTTPS
        id: auth
        shell: bash
        run: |
          if [ -n "${{ secrets.GITOPS_DEPLOY_KEY }}" ]; then
            echo "🔑 Configurando SSH con GITOPS_DEPLOY_KEY..."
            mkdir -p ~/.ssh
            echo "${{ secrets.GITOPS_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: 🚀 Sincronizar Manifiestos con Repositorio GitOps
        shell: bash
        env:
          GITOPS_INFRA_REPO: ${{ inputs.GITOPS_INFRA_REPO || vars.GITOPS_INFRA_REPO || 'git@github.com:infra/kubernetes-gitops.git' }}
          GITOPS_TARGET_DIR: ${{ inputs.GITOPS_TARGET_DIR || vars.GITOPS_TARGET_DIR || '' }}
          GITOPS_TARGET_ENV: ${{ inputs.GITOPS_TARGET_ENV || 'PROD' }}
          SERVICE_PATH: ${{ inputs.SERVICE_PATH || '.' }}
          SERVICE_NAME: ${{ inputs.SERVICE_NAME }}
          IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "🚀 Sincronizando con Repositorio GitOps de Infraestructura..."
          echo "════════════════════════════════════════════════════════"

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SRV_NAME="${SERVICE_NAME:-$REPO_NAME}"
          TARGET_TAG="${IMAGE_TAG:-${GITHUB_REF_NAME}_${GITHUB_SHA::7}}"
          REGISTRY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$SERVICE_PATH" != "." ] && [ -n "$SERVICE_NAME" ]; then
            REGISTRY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${SRV_NAME}"
          fi

          ENV_UPPER=$(echo "$GITOPS_TARGET_ENV" | tr '[:lower:]' '[:upper:]')
          ENV_LOWER=$(echo "$GITOPS_TARGET_ENV" | tr '[:upper:]' '[:lower:]')

          echo "📦 Repositorio GitOps: ${GITOPS_INFRA_REPO}"
          echo "🎯 Tag de imagen:      ${TARGET_TAG}"
          echo "📁 Entorno objetivo:   ${GITOPS_TARGET_ENV} (${ENV_UPPER})"
          echo "🏷️  Servicio:           ${SRV_NAME}"

          # Resolver URL de clonación
          CLONE_URL="${GITOPS_INFRA_REPO}"
          if [ -z "${{ secrets.GITOPS_DEPLOY_KEY }}" ]; then
            CLEAN_REPO_PATH=$(echo "$GITOPS_INFRA_REPO" | sed -E 's|git@github\.com:||' | sed -E 's|https?://github\.com/||' | sed -E 's|\.git$||')
            CLONE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${CLEAN_REPO_PATH}.git"
          fi

          echo "📥 Clonando repositorio GitOps..."
          git clone "${CLONE_URL}" gitops-repo || {
            echo "⚠️ No se pudo clonar el repositorio GitOps. Verifica la URL y permisos de GITHUB_TOKEN o GITOPS_DEPLOY_KEY."
            exit 0
          }
          cd gitops-repo

          # 🔎 Descubrimiento dinámico y agnóstico del directorio del entorno en el repo GitOps
          RESOLVED_ENV_DIR=""
          # 1. Prioridad: GITOPS_TARGET_DIR explícito
          if [ -n "$GITOPS_TARGET_DIR" ] && [ -d "$GITOPS_TARGET_DIR" ]; then
            RESOLVED_ENV_DIR="$GITOPS_TARGET_DIR"
          fi
          # 2. Buscar */k8s/${ENV_UPPER} o */k8s/${ENV_LOWER} (ej: idp/k8s/DEV, vox/k8s/DEV)
          if [ -z "$RESOLVED_ENV_DIR" ]; then
            RESOLVED_ENV_DIR=$(find . -maxdepth 3 -type d \( -path "*/k8s/${ENV_UPPER}" -o -path "*/k8s/${ENV_LOWER}" \) 2>/dev/null | head -n 1 | sed 's|^\./||')
          fi
          # 3. Buscar ${REPO_NAME}/**/${ENV_UPPER} o ${REPO_NAME}/**/${ENV_LOWER}
          if [ -z "$RESOLVED_ENV_DIR" ]; then
            RESOLVED_ENV_DIR=$(find . -maxdepth 3 -type d \( -path "*${REPO_NAME}*/*${ENV_UPPER}*" -o -path "*${REPO_NAME}*/*${ENV_LOWER}*" \) 2>/dev/null | head -n 1 | sed 's|^\./||')
          fi
          # 4. Buscar k8s/${ENV_UPPER} o k8s/${ENV_LOWER}
          if [ -z "$RESOLVED_ENV_DIR" ]; then
            RESOLVED_ENV_DIR=$(find . -maxdepth 2 -type d \( -path "./k8s/${ENV_UPPER}" -o -path "./k8s/${ENV_LOWER}" \) 2>/dev/null | head -n 1 | sed 's|^\./||')
          fi
          # 5. Buscar cualquier carpeta con el nombre del entorno
          if [ -z "$RESOLVED_ENV_DIR" ]; then
            RESOLVED_ENV_DIR=$(find . -maxdepth 3 -type d \( -name "${ENV_UPPER}" -o -name "${ENV_LOWER}" \) 2>/dev/null | head -n 1 | sed 's|^\./||')
          fi
          # 6. Fallback a la variable
          if [ -z "$RESOLVED_ENV_DIR" ]; then
            RESOLVED_ENV_DIR="${GITOPS_TARGET_ENV}"
          fi

          echo "📂 Directorio GitOps resuelto: ${RESOLVED_ENV_DIR}"

          TARGET_FILE=""
          if [ -f "${RESOLVED_ENV_DIR}/${SRV_NAME}.yaml" ]; then
            TARGET_FILE="${RESOLVED_ENV_DIR}/${SRV_NAME}.yaml"
          elif [ -f "${RESOLVED_ENV_DIR}/${SRV_NAME}.yml" ]; then
            TARGET_FILE="${RESOLVED_ENV_DIR}/${SRV_NAME}.yml"
          elif [ -f "${RESOLVED_ENV_DIR}/${REPO_NAME}.yaml" ]; then
            TARGET_FILE="${RESOLVED_ENV_DIR}/${REPO_NAME}.yaml"
          elif [ -f "${RESOLVED_ENV_DIR}/${REPO_NAME}.yml" ]; then
            TARGET_FILE="${RESOLVED_ENV_DIR}/${REPO_NAME}.yml"
          fi

          if [ -z "$TARGET_FILE" ] && [ -d "${RESOLVED_ENV_DIR}" ]; then
            MATCHED=$(find "${RESOLVED_ENV_DIR}" -maxdepth 2 -type f \( -name "*${SRV_NAME}*.yaml" -o -name "*${SRV_NAME}*.yml" \) 2>/dev/null | sort | head -n 1)
            [ -n "$MATCHED" ] && TARGET_FILE="$MATCHED"
          fi

          if [ -z "$TARGET_FILE" ]; then
            echo "⚠️ Manifiesto no encontrado. Creando ${RESOLVED_ENV_DIR}/${SRV_NAME}.yaml..."
            mkdir -p "${RESOLVED_ENV_DIR}"
            TARGET_FILE="${RESOLVED_ENV_DIR}/${SRV_NAME}.yaml"
            cat <<EOF > "$TARGET_FILE"
          apiVersion: argoproj.io/v1alpha1
          kind: Rollout
          metadata:
            name: ${SRV_NAME}
          spec:
            template:
              spec:
                containers:
                  - name: ${SRV_NAME}
                    image: ${REGISTRY_IMAGE}:${TARGET_TAG}
          EOF
          fi

          echo "🔄 Actualizando tag de imagen en: $TARGET_FILE -> ${REGISTRY_IMAGE}:${TARGET_TAG}"
          sed -i -E "s|image:[[:space:]]*${REGISTRY_IMAGE}(:[^[:space:]\"']*)?|image: ${REGISTRY_IMAGE}:${TARGET_TAG}|g" "$TARGET_FILE" || \
          sed -i -E "s|image:[[:space:]]*.*${SRV_NAME}.*|image: ${REGISTRY_IMAGE}:${TARGET_TAG}|g" "$TARGET_FILE"

          git add .
          git -c user.name="GitHub GitOps Robot" -c user.email="gitops-robot@company.com" commit -m "upgrade(${SRV_NAME}): promote to version ${TARGET_TAG} [skip ci]" || echo "ℹ️ Sin cambios que commitear."
          git push origin main || git push origin master || echo "⚠️ No se pudo empujar el commit de GitOps."
          echo "✅ Despliegue GitOps actualizado exitosamente."

  gitops_auto_revert:
    name: ⏪ GitOps Auto-Revert (Rollback Clúster)
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: ⏪ Ejecutar Revert de Seguridad en Repositorio GitOps
        shell: bash
        env:
          GITOPS_INFRA_REPO: ${{ inputs.GITOPS_INFRA_REPO || vars.GITOPS_INFRA_REPO || 'git@github.com:infra/kubernetes-gitops.git' }}
          SERVICE_NAME: ${{ inputs.SERVICE_NAME || github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "⚠️ ALERTA: Fallo detectado. Ejecutando auto-revert en GitOps..."
          echo "════════════════════════════════════════════════════════"
          CLEAN_REPO_PATH=$(echo "$GITOPS_INFRA_REPO" | sed -E 's|git@github\.com:||' | sed -E 's|https?://github\.com/||' | sed -E 's|\.git$||')
          CLONE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${CLEAN_REPO_PATH}.git"

          git clone "${CLONE_URL}" gitops-repo || exit 0
          cd gitops-repo

          LAST_COMMIT_HASH=$(git log -n 1 --grep="upgrade(${SERVICE_NAME})" --format="%H")
          if [ -n "$LAST_COMMIT_HASH" ]; then
            echo "Revirtiendo commit: $LAST_COMMIT_HASH"
            git -c user.name="GitOps Revert Robot" -c user.email="gitops-robot@company.com" revert --no-edit "$LAST_COMMIT_HASH"
            git push origin main || git push origin master || true
            echo "✅ Repositorio GitOps alineado con el rollback."
          fi
