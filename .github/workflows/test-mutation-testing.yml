name: Test Mutation Testing

# Mutation testing por ecosistema: Go (go-mutesting), JS (Stryker), Python (mutmut), Java (PITest).
# Informativo: mutantes sobrevivientes generan un aviso, no rompen el pipeline.

on:
  workflow_call:
    inputs:
      SERVICE_PATH:
        description: 'Directorio del servicio'
        required: false
        type: string
        default: '.'
      MUTATION_FAIL:
        description: 'true = mutantes sobrevivientes/herramienta fallida falla el job'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.SERVICE_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar ecosistema
        id: lang
        run: |
          if [ -f go.mod ]; then L=go
          elif [ -f package.json ]; then L=js
          elif [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then L=python
          elif [ -f pom.xml ] || [ -f build.gradle ]; then L=java
          else L=unknown; fi
          echo "lang=$L" >> "$GITHUB_OUTPUT"
          echo "🔍 Ecosistema detectado: $L"

      - uses: actions/setup-go@v5
        if: steps.lang.outputs.lang == 'go'
        with:
          go-version-file: ${{ inputs.SERVICE_PATH }}/go.mod
      - uses: actions/setup-node@v4
        if: steps.lang.outputs.lang == 'js'
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        if: steps.lang.outputs.lang == 'python'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: steps.lang.outputs.lang == 'java'
        with:
          distribution: temurin
          java-version: '21'

      - name: Ejecutar mutación
        env:
          S_LANG: ${{ steps.lang.outputs.lang }}
          MUTATION_FAIL: ${{ inputs.MUTATION_FAIL }}
        run: |
          MUT_RC=0
          case "$S_LANG" in
            go)
              go install github.com/zimmski/go-mutesting/cmd/go-mutesting@latest
              GOBIN_DIR="$(go env GOPATH)/bin"
              export PATH="$PATH:$GOBIN_DIR"
              go-mutesting ./... || MUT_RC=$? ;;
            js)
              npm ci --prefer-offline --no-audit 2>/dev/null || npm install --legacy-peer-deps --no-audit || true
              npx stryker run --mutate "src/**/*.js" || MUT_RC=$? ;;
            python)
              pip install --quiet mutmut pytest || true
              [ -f requirements.txt ] && pip install --quiet -r requirements.txt || true
              mutmut run || MUT_RC=$?
              mutmut junitxml > mutation-report.xml 2>/dev/null || true ;;
            java)
              mvn -B org.pitest:pitest-maven:mutationCoverage || MUT_RC=$? ;;
            *) echo "⏭️ Ecosistema no soportado."; exit 0 ;;
          esac
          if [ "$MUT_RC" -ne 0 ]; then
            echo "::warning::La herramienta de mutación terminó con código ${MUT_RC}: sobreviven mutantes o no pudo ejecutarse (ver el log)."
            [ "$MUTATION_FAIL" = "true" ] && exit 1
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            ${{ inputs.SERVICE_PATH }}/**/stryker-report.json
            ${{ inputs.SERVICE_PATH }}/**/mutation-report.xml
            ${{ inputs.SERVICE_PATH }}/**/target/pit-reports/
          if-no-files-found: ignore
          retention-days: 7
