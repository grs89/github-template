name: Security Cluster Scanning

on:
  workflow_call:
    inputs:
      CLUSTER_SCAN_NAMESPACE:
        description: 'Namespace a escanear (vacío = todo el clúster)'
        required: false
        type: string
        default: ''
      TRIVY_SEVERITY:
        description: 'Severidades a reportar'
        required: false
        type: string
        default: 'HIGH,CRITICAL'
    secrets:
      KUBE_CONFIG:
        description: 'kubeconfig codificado en base64 con acceso de lectura al clúster'
        required: true

permissions:
  contents: read

jobs:
  cluster_scanning:
    name: Trivy Kubernetes Cluster Scan
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.58.1

      - name: Escanear clúster operativo
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          NAMESPACE: ${{ inputs.CLUSTER_SCAN_NAMESPACE }}
          SEVERITY: ${{ inputs.TRIVY_SEVERITY }}
        run: |
          umask 077
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          ARGS=(--kubeconfig "$RUNNER_TEMP/kubeconfig" --severity "$SEVERITY" --format json --output cluster-scan-report.json)
          [ -n "$NAMESPACE" ] && ARGS+=(--include-namespaces "$NAMESPACE")
          trivy k8s "${ARGS[@]}" cluster
          rm -f "$RUNNER_TEMP/kubeconfig"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-scan-report
          path: cluster-scan-report.json
          if-no-files-found: ignore
