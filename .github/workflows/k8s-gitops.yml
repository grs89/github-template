name: K8S GitOps Validation

on:
  workflow_call:
    inputs:
      CHECK_DIR:
        description: 'Directorio con manifiestos Kubernetes'
        required: false
        type: string
        default: '.'
      KUBERNETES_VERSION:
        description: 'Versión de Kubernetes contra la que validar esquemas (kubeconform)'
        required: false
        type: string
        default: '1.30.0'

permissions:
  contents: read

jobs:
  k8s_validate:
    name: Checkov + Kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov (Kubernetes)
        env:
          CHECK_DIR: ${{ inputs.CHECK_DIR }}
        run: |
          python3 -m pip install --quiet checkov
          checkov -d "$CHECK_DIR" --framework kubernetes --output json --soft-fail > checkov-report.json
          checkov -d "$CHECK_DIR" --framework kubernetes --compact --quiet --soft-fail

      - name: Kubeconform (esquemas)
        env:
          CHECK_DIR: ${{ inputs.CHECK_DIR }}
          K8S_VERSION: ${{ inputs.KUBERNETES_VERSION }}
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -summary -ignore-missing-schemas -kubernetes-version "$K8S_VERSION" \
            -ignore-filename-pattern 'kustomization\.ya?ml$' "$CHECK_DIR"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8s-gitops-report
          path: checkov-report.json
          if-no-files-found: ignore
