apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: ${APP_NAME}-pod-chaos
  namespace: ${K8S_NAMESPACE}
spec:
  action: pod-failure
  mode: fixed
  value: '1'
  duration: '60s'
  selector:
    namespaces:
    - ${K8S_NAMESPACE}
    labelSelectors:
      app: ${APP_NAME}
      track: preview
  scheduler:
    cron: '@every 10s'
